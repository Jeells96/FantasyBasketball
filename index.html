            onclick="showPlayer('${p.espnId}')">${esc(p.name)}</span>
          ${(p.injured||p.dtd||drafted||Math.abs(p.ownedChange||0) >= 1)?`<span class="sub" style="font-size:.58rem;display:block;white-space:nowrap">${injuryBadge(p)} ${drafted?esc(ownerTeam):''}${
            Math.abs(p.ownedChange||0) >= 1 ? `<span style="color:${p.ownedChange>0?'var(--good)':'var(--bad)'}">${p.ownedChange>0?'▲':'▼'}${Math.abs(p.ownedChange).toFixed(1)}%</span>` : ''}</span>`:''}
        </span>
      </span></td>
      <td class="pos" style="white-space:nowrap">${esc((p.eligible||[]).join('/') || p.pos || '?')}
        <span class="sub" style="font-size:.56rem;display:block">${esc(p.proTeam||'')}</span></td>
      <td class="r num cell-best" style="${p.adp>=9999?'color:var(--sage-dim)':''}">${adpTxt}</td>
      <td class="r num" style="font-size:.72rem;${(ptsVal==null||ptsVal<=0)?'color:var(--sage-dim)':'color:var(--chalk);font-weight:600'}">${ptsTxt}</td>
      ${useSal?(() => {
        // signed vs arb used to be an emoji and a letter appended to the money, which
        // wrapped onto a second line and doubled the height of every row. Colour says
        // the same thing in zero extra width.
        const signed = !!playerContract(p), arb = isArbPlayer(p);
        const col = signed ? 'color:var(--good)' : arb ? 'color:var(--sage-dim)' : '';
        const why = signed ? 'under contract' : arb ? 'arb rate (no contract on file)' : 'unsigned — import AAV';
        return `<td class="r num" style="font-size:.68rem;white-space:nowrap;${col}" title="${why}">${fmtMoney(playerCapHit(p))}</td>`;
      })():''}
    </tr>`;
  }).join('');

  const sortBtn = (key,label) =>
    `<button class="btn btn-sm ${playerView.sort===key?'':'btn-ghost'}" onclick="setSort('${key}')">${label}${playerView.sort===key?(dir<0?' ▼':' ▲'):''}</button>`;
  const posBtn = (pos) =>
    `<button class="btn btn-sm ${playerView.posFilter===pos?'btn-amber':'btn-ghost'}" onclick="setPosFilter('${pos}')">${pos}</button>`;
  const winBtn = (w,label) =>
    `<button class="btn btn-sm ${activeStatWindow()===w?'btn-amber':'btn-ghost'}" onclick="setPtsWindow('${w}')">${label}</button>`;

  return `
    <div class="eyebrow">${SP().label} pool · ${LG().playerPool.length} players${statsLive?` · ${mappedCount} linked`:''} · ${statSeasonNow()} season</div>
    <div class="h1">Players</div>

    ${statsLive && !havePoints ? `<div class="card card-tight mt">
      <p class="sub" style="font-size:.75rem;text-align:center"><span class="spinner-inline"></span>
        Loading player points…</p>
    </div>` : ''}
    ${!statsLive ? `<div class="card card-tight mt">
      <p class="sub" style="font-size:.72rem;text-align:center">${SP().label} shows ADP &amp; ownership from ESPN. This sport has no per-game stats provider yet, so points stay at 0.</p>
    </div>` : ''}

    <div class="field mt">
      <input class="input" placeholder="Search players…" value="${esc(playerView.search)}" oninput="setSearch(this.value)">
    </div>
    <div class="row-between" style="margin-top:.5rem;gap:.5rem">
      <button class="btn btn-sm ${playerFiltersOpen()?'btn-amber':'btn-ghost'}" onclick="togglePlayerFilters()">
        ⚙ Filters${activeFilterCount()?` (${activeFilterCount()})`:''} ${playerFiltersOpen()?'▲':'▼'}</button>
      ${activeFilterCount()?`<button class="btn btn-sm btn-ghost" onclick="resetPlayerFilters()">Reset</button>`:`<span class="sub" style="font-size:.66rem">${list.length} shown</span>`}
    </div>
    ${activeFilters().length && !playerFiltersOpen() ? `<p class="sub" style="font-size:.66rem;margin-top:.25rem">Showing ${esc(activeFilterSummary())}</p>` : ''}
    ${ptsMeaning ? `<p class="sub" style="font-size:.62rem;margin-top:.15rem">
      <b>${esc(ptsLabel)}</b> = ${esc(ptsMeaning)}${prevLoading?' · <span class="amber">loading…</span>':''}</p>` : ''}
    ${(() => { const h = poolHealthLine(); return h ? `<p class="sub" style="font-size:.62rem;margin-top:.15rem">${h}</p>` : ''; })()}
    <div style="${playerFiltersOpen()?'':'display:none'}">
    ${SP().key==='flb' ? `<div class="row" style="gap:.35rem;margin-top:.5rem">
      <button class="btn btn-sm ${playerView.grpFilter==='all'?'btn-amber':'btn-ghost'}" onclick="setGrpFilter('all')">All</button>
      <button class="btn btn-sm ${playerView.grpFilter==='batters'?'btn-amber':'btn-ghost'}" onclick="setGrpFilter('batters')">⚾ Batters</button>
      <button class="btn btn-sm ${playerView.grpFilter==='pitchers'?'btn-amber':'btn-ghost'}" onclick="setGrpFilter('pitchers')">🥎 Pitchers</button>
    </div>` : ''}
    <div class="row" style="gap:.35rem;overflow-x:auto;padding-bottom:.4rem;margin-top:.4rem">${allPos.map(posBtn).join('')}</div>
    <div class="row" style="gap:.35rem;margin-top:.4rem;flex-wrap:wrap">
      <span class="sub" style="align-self:center;font-size:.68rem">Sort:</span>
      ${sortBtn('adp','ADP')} ${sortBtn('pts','Pts')} ${sortBtn('name','Name')}${useSal?' '+sortBtn('salary','$'):''}
      ${LG().playerPool?.some(x => x.ownedChange) ? sortBtn('ownedChange','📈 Trending') : ''}
    </div>
    ${useSal?`<div class="row" style="gap:.35rem;margin-top:.4rem;flex-wrap:wrap">
      <span class="sub" style="align-self:center;font-size:.68rem">Salary:</span>
      <button class="btn btn-sm ${(!playerView.salFilter||playerView.salFilter==='all')?'btn-amber':'btn-ghost'}" onclick="setSalFilter('all')">All</button>
      <button class="btn btn-sm ${playerView.salFilter==='signed'?'btn-amber':'btn-ghost'}" onclick="setSalFilter('signed')">📝 Signed</button>
      <button class="btn btn-sm ${playerView.salFilter==='unsigned'?'btn-amber':'btn-ghost'}" onclick="setSalFilter('unsigned')">Unsigned</button>
      <button class="btn btn-sm ${playerView.salFilter==='arb'?'btn-amber':'btn-ghost'}" onclick="setSalFilter('arb')">A Arb</button>
      <button class="btn btn-sm ${playerView.salFilter==='expiring'?'btn-amber':'btn-ghost'}" onclick="setSalFilter('expiring')">⏳ Expiring</button>
    </div>`:''}
    ${!FEAT().statWindows ? '' : `<div class="row" style="gap:.35rem;margin-top:.4rem;flex-wrap:wrap">
      <span class="sub" style="align-self:center;font-size:.68rem">Show stat:</span>
      ${statWindowOptions().map(([w, label]) => winBtn(w, label)).join(' ')}
    </div>`}
    <div class="row" style="gap:.35rem;margin-top:.4rem">
      <span class="sub" style="align-self:center;font-size:.68rem">Show:</span>
      <button class="btn btn-sm ${playerView.avail==='all'?'btn-amber':'btn-ghost'}" onclick="setAvail('all')">All</button>

      <input class="input" type="number" min="0" value="${playerView.minWeeks}" style="width:64px;text-align:center;padding:.3rem"
        onchange="setMinWeeks(this.value)">

    </div>

    <p class="sub mt" style="font-size:.7rem;text-align:center">Pool is the top 300 by ADP. Tap a name for details. Players outside the 300 load to this device only.</p>`;

/* Load a player NOT in the top-300 pool, by searching MLB. Adds them to a
   LOCAL-ONLY extras list (not synced to Firebase, so the doc stays small). */
window.loadExtraPlayer = async function(name) {
  if (!name) return;
  if (SP().statsApi !== 'mlb') {
    openModal(`<div class="h2">Not available for ${SP().label}</div>
      <p class="sub mb">Loading individual players by search is currently only wired for MLB. For ${SP().label}, re-pull the full pool from Settings instead.</p>
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Close</button>`);
    return;
  }
  openModal(`<div class="h2">Searching MLB…</div><div class="spinner"></div>
    <p class="sub" style="text-align:center">Looking for "${esc(name)}"</p>`);
  try {
    const res = await fetch(`${MLB}/people/search?names=${encodeURIComponent(name)}`);
    const data = res.ok ? await res.json() : {};
    const people = (data.people || []).slice(0, 8);
    if (!people.length) {
      openModal(`<div class="h2">No match</div>
        <p class="sub mb">MLB had no player named "${esc(name)}".</p>
        <button class="btn btn-ghost btn-block" onclick="closeModal()">Close</button>`);
      return;
    }
    const rows = people.map(p => {
      const pos = p.primaryPosition?.abbreviation || '';
      const team = p.currentTeam?.name || '';
      const already = LG().playerPool.some(x => String(x.mlbId)===String(p.id));

/* SINGLE source of truth for a player's computed point fields from a game log.
   Sets ptsSeason, pts7/14/30, and bestAvg (avg of each week's best single game). */
function applyPointFields(p, log) {
  const today = new Date(); today.setHours(0,0,0,0);
  const cut = (d) => { const x = new Date(today); x.setDate(today.getDate()-d); return ymd(x); };
  const c7 = cut(7), c14 = cut(14), c30 = cut(30);
  let season=0,w7=0,w14=0,w30=0;
  const weekBest = {}; // fantasy week -> best single game pts
  // BEST-OF-WEEK LEAGUES SCORE ONE GAME A WEEK, so a sum of every game is the wrong
  // number to judge a player by — it rewards whoever played most. What matters is
  // the average of the games that would actually have counted. Kept per window, so
  // "last 30 days" answers "what has he been worth lately" in the league's own units.
  const winBest = { 7: {}, 14: {}, 30: {} };
  log.forEach(g => {
    const pts = gamePoints(g.stat, g.group);
    season+=pts;
    if(g.date>=c7)w7+=pts; if(g.date>=c14)w14+=pts; if(g.date>=c30)w30+=pts;
    const wk = weekOfDate(g.date);
    if (wk != null) {
      weekBest[wk] = Math.max(weekBest[wk] ?? -Infinity, pts);
      if (g.date>=c30) winBest[30][wk] = Math.max(winBest[30][wk] ?? -Infinity, pts);
      if (g.date>=c14) winBest[14][wk] = Math.max(winBest[14][wk] ?? -Infinity, pts);
      if (g.date>=c7)  winBest[7][wk]  = Math.max(winBest[7][wk]  ?? -Infinity, pts);
    }
  });
  const avgOf = (obj) => {
    const v = Object.values(obj).filter(x => x > -Infinity);
    return v.length ? Math.round((v.reduce((a,b)=>a+b,0)/v.length)*10)/10 : 0;
  };
  p.ptsSeason=Math.round(season*10)/10; p.pts7=Math.round(w7*10)/10;
  p.pts14=Math.round(w14*10)/10; p.pts30=Math.round(w30*10)/10;
  p.bestAvg = avgOf(weekBest); p.seasonPts=p.ptsSeason;
  p.bestAvg30 = avgOf(winBest[30]);
  p.bestAvg14 = avgOf(winBest[14]);
  p.bestAvg7  = avgOf(winBest[7]);
  p.gamesPlayed = log.length;                  // total games in the log
  p.weeksPlayed = Object.keys(weekBest).length; // distinct fantasy weeks played
}

/* ============================================================
   LAST SEASON
   The season that just finished is what you actually draft off, and in a keeper or
   dynasty league it is often more informative than a half-played current one. Both
   game-log endpoints already take a season argument, so this is the same fetch
   against a different year, cached separately so it can never mix with this year's.
   ============================================================ */
function priorStatSeason() { return statSeasonNow() - 1; }
/* the cache is only valid for the season it was fetched for — after the league
   advances a year, "last season" is a different season and the cache must go */
function prevLogs() {
  const lg = LG();
  const want = priorStatSeason();
  if (lg.gameLogsPrevYear !== want) { lg.gameLogsPrev = {}; lg.gameLogsPrevYear = want; }
  return (lg.gameLogsPrev ||= {});
}
/* A finished season has no fantasy weeks — weekOfDate is anchored to THIS league's
   opener, and pointing it at last year returns nothing. Bucket by seven-day blocks
   from that season's own first game instead, which is what a week meant then. */
function applyPrevFields(p, log) {
  let total = 0;
  const weekBest = {};
  const first = log.reduce((m, g) => (!m || g.date < m) ? g.date : m, null);
  const day0 = first ? new Date(first + 'T00:00:00').getTime() : null;
  log.forEach(g => {
    const pts = gamePoints(g.stat, g.group);
    total += pts;
    if (day0 != null) {
      const wk = Math.floor((new Date(g.date + 'T00:00:00').getTime() - day0) / 604800000);
      weekBest[wk] = Math.max(weekBest[wk] ?? -Infinity, pts);
    }
  });
  const vals = Object.values(weekBest).filter(x => x > -Infinity);
  const r1 = (n) => Math.round(n * 10) / 10;
  p.prevPts = r1(total);
  p.prevGames = log.length;
  p.prevPerGame = log.length ? r1(total / log.length) : 0;
  p.prevBestAvg = vals.length ? r1(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
  p.prevSeason = priorStatSeason();
}
/* one player's game log for a given season, in the shape everything downstream wants */
async function fetchSeasonLog(p, season) {
  if (SP().statsApi === 'nba') return await nbaGameLog(p.espnId, season);   // carries group:'stats'
  const elig = (p.eligible || []).join('');
  const isPitcher = /SP|RP/.test(elig) && !/1B|2B|3B|SS|OF|C|DH/.test(elig);
  const grp = isPitcher ? 'pitching' : 'hitting';
  const raw = await mlbGameLog(p.mlbId, grp, season);
  return raw.map(g => ({ ...g, group: grp }));
}
/* last season for ONE player — a single request, so opening a card always shows it
   without anybody waiting on a 300-player sweep */
async function computeOnePlayerPrev(p) {
  if (!p?.mlbId || !FEAT().gameLogs) return;
  let log = prevLogs()[p.mlbId];
  if (!log) { log = await fetchSeasonLog(p, priorStatSeason()); prevLogs()[p.mlbId] = log; }
  applyPrevFields(p, log);
}
let _prevPoolRunning = false, _prevPooledOnce = false;
/* last season for the WHOLE pool — the same sweep computePoolPoints does, so the
   player list can sort and rank on it. Only run when someone asks for that column. */
async function computePoolPrevPoints(progressFn) {
  if (_prevPoolRunning) return;
  _prevPoolRunning = true;
  try {
    const mapped = (LG().playerPool || []).filter(p => p.mlbId);
    let done = 0;
    for (const p of mapped) {
      done++;
      try {
        let log = prevLogs()[p.mlbId];
        if (!log) {
          log = await fetchSeasonLog(p, priorStatSeason());
          prevLogs()[p.mlbId] = log;
          await new Promise(r => setTimeout(r, 40));
        }
        applyPrevFields(p, log);
      } catch (e) {}
      progressFn?.(done, mapped.length);
    }
    if (STATE.activeLeagueDoc) saveLeague({silent:true}); else saveLocal();
  } finally { _prevPoolRunning = false; }
}
/* have we got last season for this pool yet? */
function havePrevPoolPoints() {
  const want = priorStatSeason();
  return (LG().playerPool || []).some(p => p.prevPts != null && p.prevSeason === want);
}
function prevPoolLoading() { return _prevPoolRunning; }
/* kicked off by selecting the last-season column, not at boot — it is a second full
   sweep of the stats API and nobody should pay for it unless they asked to see it */
function ensurePrevPoolPoints() {
  if (_prevPooledOnce || !FEAT().gameLogs) return;
  if (!(LG().playerPool || []).some(p => p.mlbId)) return;
  if (havePrevPoolPoints()) return;
  _prevPooledOnce = true;
  computePoolPrevPoints(() => {}).then(() => renderActive())
    .catch(() => { _prevPooledOnce = false; });
}

/* compute points for ONE player on demand (when their modal opens) */
async function computeOnePlayer(p) {
  if (!p?.mlbId) return;
  try {
    let log = LG().gameLogs?.[p.mlbId];
    if (!log) {
      const isPitcher = /SP|RP/.test((p.eligible||[]).join('')) && !/1B|2B|3B|SS|OF|C|DH/.test((p.eligible||[]).join(''));
      const grp = isPitcher ? 'pitching' : 'hitting';
      const raw = await mlbGameLog(p.mlbId, grp);
      log = raw.map(g => ({...g, group: grp}));
      LG().gameLogs = LG().gameLogs || {};
      LG().gameLogs[p.mlbId] = log;
    }
    applyPointFields(p, log);
  } catch(e) {}
}

/* Roll a player's whole-season game log into per-week buckets.
   Returns { weeks: [{week, total, best, games}], avg, playedWeeks }.
   total = sum of that week's games; best = highest single game (the "kept" score). */
function playerWeeklyBreakdown(p) {
  const log = LG().gameLogs?.[p.mlbId] || [];
  if (!log.length) return { weeks: [], avg: 0, playedWeeks: 0, bestWeek: 0 };
  // map each game date → fantasy week number
  const byWeek = {};
  log.forEach(g => {
    const wk = weekOfDate(g.date);
    if (wk == null) return;
    const pts = gamePoints(g.stat, g.group);
    (byWeek[wk] = byWeek[wk] || []).push({ ...g, pts });
  });
  const weeks = Object.keys(byWeek).map(Number).sort((a,b)=>a-b).map(wk => {
    const games = byWeek[wk];
    const total = Math.round(games.reduce((s,g)=>s+g.pts,0)*10)/10;
    const best = games.reduce((b,g)=> g.pts>b.pts?g:b, games[0]);
    return { week: wk, total, best: Math.round(best.pts*10)/10, games: games.length };
  });
  const playedWeeks = weeks.length;
  const avg = playedWeeks ? Math.round(weeks.reduce((s,w)=>s+w.total,0)/playedWeeks*10)/10 : 0;
  const bestWeek = weeks.reduce((m,w)=>Math.max(m,w.total), 0);
  return { weeks, avg, playedWeeks, bestWeek };
}

/* which fantasy week does a YYYY-MM-DD date fall in? (inverse of weekDays) */
function weekOfDate(dateYmd) {
  const d = new Date(dateYmd + 'T00:00:00');
  const open = seasonOpenerMonday();
  if (d < open) return null;
  // walk weeks (handles custom durations)
  for (let w = 1; w <= 26; w++) {
    const { start, end } = weekDateRange(w);
    if (d >= start && d <= end) return w;
  }
  return null;
}

window.showPlayer = function(espnId) {
  const p = LG().playerPool.find(x => String(x.espnId) === String(espnId));
  if (!p) return;

  if (!window._expandedWeek || String(window._expandedWeek.espnId) !== String(espnId)) {
    window._expandedWeek = null;

  // and a different player always starts with the weekly table folded, so the card
  // opens showing everything rather than a scroll box in the middle of it
  if (String(window._weeksOpen) !== String(espnId)) window._weeksOpen = null;
  // last season is one request for one player, so a card always carries it — no
  // waiting on the whole-pool sweep the players page uses for its column
  const wantPrev = () => {
    if ((p.prevPts != null && p.prevSeason === priorStatSeason()) || !p.mlbId || !FEAT().gameLogs) return;
    computeOnePlayerPrev(p).then(() => {
      // only repaint if this card is still the one on screen
      if (String(window._cardOpen) === String(espnId)) renderPlayerModal(p, false);
    }).catch(() => {});
  };
  window._cardOpen = String(espnId);
  // news arrives on its own, like last season's stats: one shared fetch for the
  // whole league, cached an hour, repainting the card only if it is still open
  if (FEAT().gameLogs) {
    ensureNews().then(items => {
      if (items && items.length && String(window._cardOpen) === String(espnId)) renderPlayerModal(p, false);
    }).catch(() => {});
  }
  // if this player's points aren't computed yet but they're mapped, fetch on demand
  if (p.ptsSeason == null && p.mlbId) {
    renderPlayerModal(p, true);  // show with a loading hint
    computeOnePlayer(p).then(() => { renderPlayerModal(p, false); wantPrev(); });
    return;
  }
  renderPlayerModal(p, false);
  wantPrev();
};

             : `<button class="btn btn-sm btn-ghost" style="flex:1;opacity:.5" onclick="moveToIR('${p.espnId}')" title="Not flagged injured">🩹 To IL</button>`)) : '';
        const blocked = onBlock(myTeamId()).includes(String(p.espnId));
        return `<div class="row" style="gap:.4rem">
          <button class="btn btn-sm btn-ghost" style="flex:1" onclick="closeModal();go('home')">My team →</button>
          ${ir}
          <button class="btn btn-sm ${blocked?'btn-amber':'btn-ghost'}" style="flex:1"
            title="${blocked?'Take off the trade block':'Put on the trade block'}"
            onclick="toggleTradeBlock('${p.espnId}')">⇄ ${blocked?'Off block':'Trade block'}</button>
        </div>`;
      })()}
      ${LSET().useSalaryCap ? signContractSection(p) : ''}
      <button class="btn btn-block mt" style="background:var(--bad);color:#fff" onclick="dropFromCard('${p.espnId}')">Drop ${esc(p.name)}${LSET().useSalaryCap&&playerContract(p)?` (dead cap ${fmtMoney(dropDeadCap(p))})`:''}</button>
    ` : ''}

    ${statsLive && !havePts ? `<p class="sub mt" style="font-size:.72rem">Points are loading… tap to view once ready.</p>` : ''}
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Close</button>
  `);
};

/* contract section on a rostered player's card (sign / show contract) */
function signContractSection(p) {
  const c = playerContract(p);
  if (c) {
    const yr = currentSeasonYear();
    const cur = contractSalaryForYear(c, yr);
    const left = (c.signedYear + c.termYears - 1) - yr;
    const mine = (LG().draft.picks||[]).some(pk =>
      String(pk.playerId)===String(p.espnId) && String(pk.teamId)===String(myTeamId()));
    return `<div class="card card-tight mt" style="border-color:var(--good)">
      <div class="sub" style="font-size:.72rem"><b class="amber">Signed</b> · ${c.termYears}yr term (${c.signedYear}–${c.signedYear+c.termYears-1})<br>
      This year: <b>${fmtMoney(cur)}</b> · ${left>=0?`${left+1} yr${left!==0?'s':''} left`:'expired'}<br>
      Drop dead-cap: <b class="cell-neg">${fmtMoney(dropDeadCap(p))}</b></div>
      ${mine && signingOpen() ? `
        <button class="btn btn-ghost btn-block mt" style="font-size:.72rem" onclick="openSignModal('${p.espnId}')">✍ Change the term</button>
        <button class="btn btn-ghost btn-block mt" style="font-size:.72rem;color:var(--bad)" onclick="removeContract('${p.espnId}')">✕ Remove this contract</button>`
      : !signingOpen() ? `<p class="sub mt" style="font-size:.66rem">Signing is closed, so this contract can't be changed until next season.</p>` : ''}
    </div>`;
  }
  if (isArbPlayer(p)) {
    return `<div class="card card-tight mt" style="border-color:var(--sage)">
      <div class="sub" style="font-size:.72rem"><b>Arbitration</b> — no ${SP().proLeague} contract.
      Counts <b>${fmtMoney(SALCFG().arbSalary)}</b>/yr (no escalation). Can't be signed to a term until they get a real contract.</div>
    </div>`;
  }
  // unsigned but has an AAV → can sign
  if (signingOpen()) {
    return `<button class="btn btn-amber btn-block mt" onclick="openSignModal('${p.espnId}')">✍ Sign ${esc(p.name)} (${fmtMoney(importedAAV(p))} AAV)</button>`;
  }
  return `<p class="sub mt" style="font-size:.7rem;text-align:center">Signing is closed (past the trade deadline).</p>`;
}

/* is signing/roster-move window open? Closed once playoffs start (roster lock).
   Signing deadline = trade deadline. Both are league settings (week numbers). */
function signingOpen() {
  if (rostersLocked()) return false;
  if (!LG().draft?.complete) return true;   // a season that hasn't started can't be past its deadline
  const deadlineWk = LSET().tradeDeadlineWeek || 20;   // default wk 20
  return currentWeekNow() <= deadlineWk;
}
function rostersLocked() {
  // You cannot be in the playoffs if you never drafted. Without this, a league
  // created outside its sport's season window computes a late week and is born
  // locked — no signing, no trades, no roster moves, with no way out except
  // editing the schedule. That is how a fresh basketball league (whose configured
  // season opened in 2024) arrived in "week 26" with everything shut.
  if (!LG().draft?.complete) return false;
  const playoffWk = LSET().playoffStartWeek || 23;     // default wk 23
  return currentWeekNow() >= playoffWk;
}

window.openSignModal = function(espnId) {
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  if (!p) return;
  if (!signingOpen()) { toast('Signing is closed (past trade deadline)', 'err'); return; }
  const existing = playerContract(p);
  // editing a signed player uses their FROZEN baseAAV; new signing uses the import AAV
  const aav = existing ? existing.baseAAV : importedAAV(p);
  if (aav == null) { toast('No AAV on record — cannot sign (arb player)', 'err'); return; }
  const maxT = SALCFG().maxTerm;
  window._signTerm = existing ? existing.termYears : 1;   // pre-fill current term when editing
  renderSignModal(p, aav, maxT, !!existing);
};
function renderSignModal(p, aav, maxT, editing) {
  const term = window._signTerm;
  const yr = currentSeasonYear();
  const rows = [];
  for (let n=1; n<=term; n++) {
    const sal = n===1 ? Math.round(aav*SALCFG().signingDiscount) : Math.round(aav*Math.pow(1+SALCFG().escalatorGrowth,n-1));
    rows.push(`<div class="row-between" style="font-size:.72rem"><span class="sub">${yr+n-1} (yr ${n})</span><b>${fmtMoney(sal)}</b></div>`);
  }
  openModal(`<div class="h2">${editing?'Re-sign':'Sign'} ${esc(p.name)}</div>
    <p class="sub mb">Base AAV ${fmtMoney(aav)}${editing?' (frozen at original signing)':''}. Year 1 gets the ${SALCFG().signingDiscount}× discount, then +${(SALCFG().escalatorGrowth*100)}%/yr. Once signed, they can't be dropped without a <b>2× dead-cap</b> hit.</p>
    <label class="sub">Term: <b class="amber">${term} year${term>1?'s':''}</b> (max ${maxT})</label>
    <input type="range" min="1" max="${maxT}" value="${term}" style="width:100%" oninput="setSignTerm('${p.espnId}',this.value)">
    <div class="card card-tight mt">${rows.join('')}</div>
    <button class="btn btn-amber btn-block mt" onclick="confirmSign('${p.espnId}')">${editing?'Update to':'Sign for'} ${term} year${term>1?'s':''}</button>
    <button class="btn btn-ghost btn-block mt" onclick="showPlayer('${p.espnId}')">Cancel</button>`);
}
window.setSignTerm = function(espnId, val) {
  window._signTerm = parseInt(val)||1;
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  const existing = playerContract(p);
  const aav = existing ? existing.baseAAV : importedAAV(p);
  renderSignModal(p, aav, SALCFG().maxTerm, !!existing);
};
/* REMOVING A CONTRACT IS NOT DROPPING A PLAYER.
   There was no way to undo a contract from the player card at all — the only exit
   was clearing the term box in the contracts table, which nobody finds. Signing a
   player is data entry and data entry has typos, so while signing is open the owner
   can simply take the contract off. The player stays on the roster and there is no
   dead cap; dead cap is the price of DROPPING someone under contract, which is a
   different act and still costs. */
window.removeContract = function(espnId) {
  const p = LG().playerPool.find(x => String(x.espnId)===String(espnId));
  if (!p) return;
  const c = playerContract(p);
  if (!c) { toast('No contract on this player', 'err'); return; }
  if (!signingOpen()) { toast('Signing is closed — contracts are locked until next season', 'err'); return; }
  const mine = (LG().draft.picks||[]).some(pk =>
    String(pk.playerId)===String(espnId) && String(pk.teamId)===String(myTeamId()));
  if (!mine && !(window._masterUnlocked || commishUnlocked())) {
    toast('You can only change contracts on your own roster', 'err'); return;
  }
  openModal(`<div class="h2">Remove ${esc(p.name)}'s contract?</div>
    <p class="sub mt mb">He stays on your roster and there is <b>no dead cap</b> — this just clears the
      ${c.termYears}-year deal you entered. He goes back to counting
      ${importedAAV(p)!=null?`his ${fmtMoney(importedAAV(p))} AAV`:`the ${fmtMoney(SALCFG().arbSalary)} minimum`}.</p>
    <button class="btn btn-amber btn-block" onclick="confirmRemoveContract('${espnId}')">Remove the contract</button>
    <button class="btn btn-ghost btn-block mt" onclick="closeModal();showPlayer('${espnId}')">Cancel</button>`);
};
window.confirmRemoveContract = function(espnId) {
  const p = LG().playerPool.find(x => String(x.espnId)===String(espnId));
  if (!p || !LG().contracts) return;
  delete LG().contracts[String(espnId)];
  logTxn('contract', `${teamName(myTeamId())} removed ${p.name}'s contract`);
  save();
  toast(`${p.name}'s contract removed`, 'ok');
  closeModal(); renderActive();
};
window.confirmSign = function(espnId) {
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  if (!p || !signingOpen()) { toast('Signing closed', 'err'); return; }
  // GUARD: you can only sign players on YOUR OWN roster (no signing free agents
  // or sabotaging another team's cap with an unwanted contract)
  const onMyRoster = (LG().draft.picks||[]).some(pk =>
    String(pk.playerId)===String(espnId) && String(pk.teamId)===String(myTeamId()));
  if (!onMyRoster) { toast('You can only sign players on your own roster', 'err'); return; }
  const existing = playerContract(p);
  // GUARD: an edit can extend a deal but never shorten it — shortening would erase
  // future salary obligations without the dead-cap cost of a drop
  if (existing && (window._signTerm||1) < existing.termYears) {
    toast(`Contracts can't be shortened (currently ${existing.termYears}yr). Drop the player to void it (2× dead cap).`, 'err'); return;
  }
  // editing keeps the FROZEN baseAAV and original signedYear; new signing uses import + now
  const aav = existing ? existing.baseAAV : importedAAV(p);
  if (aav == null) { toast('No AAV — cannot sign', 'err'); return; }
  LG().contracts = LG().contracts || {};
  LG().contracts[String(espnId)] = {
    baseAAV: aav,                                  // frozen
    signedYear: existing ? existing.signedYear : currentSeasonYear(),
    termYears: window._signTerm || 1,
    teamId: existing ? existing.teamId : myTeamId(),
  };
  save();
  syncExtraIfRostered(espnId);
  toast(`${existing?'Updated':'Signed'} ${p.name} · ${window._signTerm} year(s)`, 'ok');
  closeModal();
  renderActive();
};

/* drop one of your own players directly from their card */
window.dropFromCard = function(espnId) {

      Dropping incurs a <b>${fmtMoney(dead)}</b> dead-cap hit (2× this year's salary) on your cap this season.</p></div>`
      : `<p class="sub mt mb">They'll return to free agency.${LSET().useSalaryCap?' Their AAV will refresh to the latest import if re-added.':''}</p>`}
    <button class="btn btn-block" style="background:var(--bad);color:#fff" onclick="confirmDropCard('${espnId}')">

/* add a free agent when roster is FULL — pick someone to drop in the same move */

        ${r.bestAvg!=null?`<span class="sub" style="font-size:.65rem"> · ${r.bestAvg.toFixed(1)} avg</span>`:''}</span>
      <button class="btn btn-sm" style="background:var(--bad);color:#fff" onclick="confirmSwap('${addId}','${r.espnId}')">Drop</button>

window.confirmSwap = function(addId, dropId) {
  doDropPlayer(dropId);                       // release the chosen player
  const maxPick = LG().draft.picks.reduce((m,pk)=>Math.max(m,pk.pick||0), 0);
  LG().draft.picks.push({ teamId: myTeamId(), playerId: addId, pick: maxPick+1, addedFA: true });
  save();
  const addP = LG().playerPool.find(x=>String(x.espnId)===String(addId));
  const dropP = LG().playerPool.find(x=>String(x.espnId)===String(dropId));
  toast(`Added ${addP?.name||'player'}, dropped ${dropP?.name||'player'}`, 'ok');
  closeModal();
  renderActive();
};

/* SALARY-CAP GUARD: dropping a signed player ALWAYS costs 2x dead cap, no matter
   which drop path is used (card, add/drop modal, add-with-swap). Voids the contract. */
function applyDropDeadCap(espnId, tid) {
  if (!LSET().useSalaryCap) return 0;
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  const c = p ? playerContract(p) : null;
  if (!c) return 0;
  const dead = dropDeadCap(p);
  if (dead > 0) {
    LG().deadCap = LG().deadCap || {};
    LG().deadCap[tid] = LG().deadCap[tid] || [];
    LG().deadCap[tid].push({ playerId: String(espnId), amount: dead, year: currentSeasonYear(), name: p.name });
  }
  delete LG().contracts[String(espnId)];   // the deal is void either way
  logTxn('drop', dead > 0
    ? `${teamName(tid)} took ${fmtMoney(dead)} dead cap dropping ${p.name}`
    : `${teamName(tid)} dropped ${p.name} from his contract (no dead cap)`);
  return dead;
}

/* Clear a player out of a team's lineups for the current week onward (past weeks are
   history and must keep their record). Vacated slots become null, not deleted. */
function clearFromLineups(teamId, espnId, opts = {}) {
  const weeks = LG().lineups?.[teamId] || {};
  const from = opts.fromWeek != null ? opts.fromWeek : currentWeekNow();
  const pl = opts.respectLocks
    ? LG().playerPool.find(x => String(x.espnId)===String(espnId)) : null;
  Object.keys(weeks).forEach(wk => {
    if (Number(wk) < from) return;
    // respectLocks: a locked player keeps the slot they already started in — vacating
    // it would let the owner recycle one slot for two players' games in a week
    if (opts.respectLocks && pl && playerLockedForWeek(pl, Number(wk))) return;
    const as = weeks[wk]?.assignments;
    if (!as) return;
    for (const k of Object.keys(as)) if (String(as[k])===String(espnId)) as[k] = null;
  });
}

/* shared drop logic: remove from picks + clear from upcoming lineups */
function doDropPlayer(espnId, teamId) {
  const tid = teamId || myTeamId();
  applyDropDeadCap(espnId, tid);
  // MID-WEEK DROP: if this player is already locked into the current week's lineup,
  // they finish the week for you (you keep what they scored) and the roster spot only
  // opens up from next week on. Otherwise the drop takes effect immediately.
  const wk = currentWeekNow();
  const pl = LG().playerPool.find(x => String(x.espnId)===String(espnId));
  const startingNow = getStarters(tid, wk).some(pid => String(pid)===String(espnId));
  const held = !!(pl && startingNow && playerLockedForWeek(pl, wk));
  if (held) addHoldover(tid, wk, espnId);
  LG().draft.picks = LG().draft.picks.filter(pk =>
    !(String(pk.teamId)===String(tid) && String(pk.playerId)===String(espnId)));
  clearFromLineups(tid, espnId, held ? { fromWeek: wk + 1 } : {});
  return held;
}
/* weekly scoring breakdown table for the player modal — rows expand on tap */
function renderWeeklyBreakdown(p) {
  const bd = playerWeeklyBreakdown(p);
  if (!bd.weeks.length) return '';
  const exp = window._expandedWeek;  // {espnId, week} of the currently expanded row
  const rows = bd.weeks.map(w => {
    const isBestWk = w.total === bd.bestWeek && bd.bestWeek > 0;
    const isOpen = exp && String(exp.espnId)===String(p.espnId) && exp.week===w.week;
    let html = `<tr style="cursor:pointer;${isBestWk?'background:var(--amber-bg)':''}" onclick="toggleWeek('${p.espnId}',${w.week})">
      <td class="pos">${isOpen?'▾':'▸'} Wk ${w.week}</td>
      <td class="r num" style="font-size:.72rem">${w.games}</td>
      <td class="r num cell-best">${w.best.toFixed(0)}</td>
      <td class="r num" style="font-weight:600;${isBestWk?'color:var(--amber)':''}">${w.total.toFixed(0)}</td>
    </tr>`;
    if (isOpen) {
      // individual games that week with each game's points + the kept (best) flagged
      const games = weekGamesDetail(p, w.week);
      const gameRows = games.map(g => `
        <tr style="background:var(--field-2)">
          <td class="pos" style="padding-left:1rem">${esc(g.dateLabel)}</td>
          <td colspan="2" class="sub" style="font-size:.68rem">${esc(g.opp||'')}${g.isBest?' <span class="amber">★ kept</span>':''}</td>
          <td class="r num ${g.pts<0?'cell-neg':''}" style="${g.isBest?'color:var(--amber);font-weight:700':''}">${g.pts.toFixed(0)}</td>
        </tr>
        <tr style="background:var(--field-2)"><td colspan="4" class="sub" style="font-size:.6rem;padding:.1rem .5rem .4rem 1rem;color:var(--sage-dim)">${esc(g.statline)}</td></tr>`).join('');
      html += gameRows;
    }
    return html;
  }).join('');
  // FOLDED BY DEFAULT. This table used to sit open in its own 38vh scroll box, and
  // on a phone — especially as a home-screen app, where there is no browser chrome
  // to scroll away — it swallowed the middle of the card. People could not tell
  // there was anything below it, so Sign, Drop and Add went unnoticed. The summary
  // line carries the numbers that matter; the week-by-week detail is one tap away.
  const open = !!window._weeksOpen && String(window._weeksOpen) === String(p.espnId);
  return `
    <div class="row-between mt" style="align-items:center;gap:.5rem">
      <div class="divlabel" style="margin:0">Weekly scoring${p.gamesPlayed?` · ${p.gamesPlayed} g`:''}</div>
      <button class="btn btn-sm btn-ghost" style="flex:none" onclick="toggleWeeks('${p.espnId}')">
        ${open ? 'Hide' : `${bd.weeks.length} week${bd.weeks.length!==1?'s':''}`} ${open ? '▲' : '▼'}</button>
    </div>
    <div class="card card-tight" style="padding:.35rem .6rem;line-height:1.35">
      ${playerScoreMode(p) === 'best' ? '' : `<div class="row-between info" style="font-size:.72rem">
        <span class="sub">Best game, per week</span><b class="amber">${(p.bestAvg??0).toFixed(1)}</b></div>
      <div class="row-between info" style="font-size:.72rem">
        <span class="sub">All games, per week</span><b>${bd.avg.toFixed(1)}</b></div>`}
      <div class="row-between info" style="font-size:.72rem">
        <span class="sub">Best week</span><b>${bd.bestWeek.toFixed(0)}</b></div>
      ${playerScoreMode(p) === 'best' ? `<div class="row-between info" style="font-size:.72rem">
        <span class="sub">Season total</span><b>${(p.ptsSeason??0).toFixed(0)}</b></div>` : ''}
    </div>
    ${open ? `<div class="card card-tight mt" style="max-height:40vh;overflow-y:auto">
      <table class="tbl">
        <thead><tr><th>Week</th><th class="r">G</th><th class="r">Best</th><th class="r">Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="sub" style="font-size:.62rem;text-align:center;margin-top:.3rem">
      Tap a week to see each game. Best = kept score. Highlighted row = best week.</p>` : ''}`;
}

/* detail of each game in a player's given week: date, opp, pts, statline, isBest */
function weekGamesDetail(p, week) {
  const log = LG().gameLogs?.[p.mlbId] || [];
  const days = weekDays(week).map(ymd);
  const games = log.filter(g => days.includes(g.date)).map(g => ({
    date: g.date,
    dateLabel: (()=>{ const d=new Date(g.date+'T00:00:00'); return ['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate(); })(),
    opp: g.opp ? (g.isHome?'vs ':'@ ')+g.opp : '',
    pts: gamePoints(g.stat, g.group),
    statline: buildStatline(g.stat, g.group),
  })).sort((a,b)=>a.date.localeCompare(b.date));
  // flag the best (kept) game
  if (games.length) {
    const best = games.reduce((b,g)=> g.pts>b.pts?g:b, games[0]);
    games.forEach(g => g.isBest = (g.date===best.date && g.pts===best.pts));
  }
  return games;
}

/* short human statline from a game's stat object for the active group */
function buildStatline(stat, group) {
  if (!stat) return '';
  if (group === 'pitching') {
    const ip = stat.inningsPitched ?? '0';
    return `${ip} IP, ${stat.strikeOuts??0} K, ${stat.earnedRuns??0} ER, ${stat.hits??0} H, ${stat.baseOnBalls??0} BB${stat.wins?', W':''}${stat.saves?', SV':''}`;
  }
  const h = stat.hits??0, hr = stat.homeRuns??0, rbi = stat.rbi??0, r = stat.runs??0,
        bb = stat.baseOnBalls??0, sb = stat.stolenBases??0, k = stat.strikeOuts??0;
  let parts = [`${h}-for-${stat.atBats??0}`];
  if (hr) parts.push(`${hr} HR`); if (rbi) parts.push(`${rbi} RBI`); if (r) parts.push(`${r} R`);
  if (sb) parts.push(`${sb} SB`); if (bb) parts.push(`${bb} BB`); if (k) parts.push(`${k} K`);
  return parts.join(', ');
}

window.toggleWeeks = function(espnId) {
  window._weeksOpen = (String(window._weeksOpen) === String(espnId)) ? null : String(espnId);
  window._expandedWeek = null;      // collapsing the table closes any open week with it
  showPlayer(espnId);
};
window.toggleWeek = function(espnId, week) {
  const e = window._expandedWeek;
  if (e && String(e.espnId)===String(espnId) && e.week===week) window._expandedWeek = null;
  else window._expandedWeek = { espnId, week };
  // re-render the open player modal
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  if (p) renderPlayerModal(p, false);
};
/* add a free agent straight from the player modal */
window.addPlayerFromPool = function(espnId) {
  if (LG().draft?.live) { toast('Draft is live — use the Draft room to pick', 'err'); go('draft'); return; }
  if (LSET().useSalaryCap && rostersLocked()) { toast('Rosters are locked (playoffs) — no adds', 'err'); return; }
  if (!myTeamId()) { toast('Claim your team first', 'err'); return; }
  if (rosterActiveCount(myTeamId()) >= rosterCap()) { toast('Roster full — drop someone first', 'err'); return; }
  const ilWhy = ilBlockReason(myTeamId());
  if (ilWhy) { toast(ilWhy, 'err'); return; }
  const blocked = addBlockedReason(myTeamId());
  if (blocked) { toast(blocked, 'err'); return; }
  // if the player is on waivers, this becomes a CLAIM, not an instant add
  const wv = (LG().waivers||{})[espnId];
  if (wv && wv.until > Date.now()) { openClaimModal(espnId); return; }
  if (wv) { delete LG().waivers[espnId]; }   // expired, unclaimed → clean up
  const maxPick = LG().draft.picks.reduce((m,pk)=>Math.max(m,pk.pick||0), 0);
  LG().draft.picks.push({ teamId: myTeamId(), playerId: espnId, pick: maxPick+1, addedFA: true });
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  logTxn('add', `${teamName(myTeamId())} added ${p?.name||'a player'}`);
  save();
  syncExtraIfRostered(espnId);   // if this is a local-only extra, push it to master so all see it
  toast(`Added ${p?.name||'player'} to your team`, 'ok');
  closeModal();
  renderActive();
};
/* if a player is a local-only extra and is now on a roster, sync master so their
   record reaches Firebase (masterPayload includes rostered extras). */
function syncExtraIfRostered(espnId) {
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  if (p && p.extra) saveMaster();
}

/* ---- settings log ---- */
function slog(msg, kind='pending') {
  const el = $('settings-log'); if (!el) return;
  const ic = kind==='ok'?'✓':kind==='err'?'✗':kind==='run'?'…':'·';
  const col = kind==='ok'?'var(--good)':kind==='err'?'var(--bad)':kind==='run'?'var(--clay)':'var(--sage)';
  if (el.querySelector('.sage') && el.children.length === 1) el.innerHTML = '';
  el.insertAdjacentHTML('beforeend',
    `<div class="log-step"><span class="log-ic" style="color:${col}">${ic}</span><span>${esc(msg)}</span></div>`);
  el.scrollTop = el.scrollHeight;
}

/* ---- settings actions ---- */
/* ---- MASTER SETTINGS ----
   Master is reachable ONLY from the bare-URL landing (gateOpenMaster). Inside a
   league there is no master UI at all — members and league commissioners only
   ever see their league's page. */
/* Jump from a league's settings to the site-wide admin layer. Only reachable when
   the master PIN is already unlocked; it just changes which scope Settings renders. */
window.openMasterScope = function() {
  if (!window._masterUnlocked) { toast('Master PIN required', 'err'); return; }
  window._settingsScope = 'master';
  renderActive();
};
/* Step back out of site-wide admin into the league this device is bound to,
   without locking master — the door swings both ways. */
window.closeMasterScope = function() {
  window._settingsScope = 'league';
  renderActive();
};
window.lockMaster = function() {
  window._masterUnlocked = false;
  window._settingsScope = 'league';
  toast('Master settings locked', 'ok');
  renderActive();
  if (gateNeeded()) showGate('landing');   // locked at the hub → back to the front door
};

/* ---- PER-LEAGUE commissioner PIN ----
   Each league has its own PIN (set in master at creation, editable later). It
   gates that league's commissioner settings so members can view but not edit. */
function currentLeaguePin() {
  const docId = STATE.activeLeagueDoc;
  if (!docId) return null;
  const ap = Object.entries(STATE.approvals||{}).find(([k,a]) => (a.leagueDocId||('league_'+k))===docId);
  return ap ? (ap[1].pin || '0000') : null;
}
window.openCommishUnlock = function() {
  openModal(`

    <div class="field"><input class="input" id="commish-pin" inputmode="numeric" placeholder="League PIN" onkeydown="if(event.key==='Enter')tryCommish()"></div>
    <button class="btn btn-block mt" onclick="tryCommish()">Unlock</button>
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Cancel</button>`);
  setTimeout(()=>$('commish-pin')?.focus(), 100);

window.tryCommish = function() {
  const pin = $('commish-pin')?.value;
  const real = currentLeaguePin();
  // master PIN also opens any league's commissioner settings (admin override)
  if (pin === real || pin === ADMIN_PIN) {
    window._commishUnlocked = STATE.activeLeagueDoc;   // unlock is per-league-doc
    closeModal(); toast('Commissioner settings unlocked', 'ok'); renderActive();
  } else { toast('Wrong PIN', 'err'); }

/* ============================================================
   COMMISSIONER LOG (master settings)
   You approve leagues here. Each entry: commissioner name, league
   name, and an approved toggle. Stored in master Firebase. When a
   user launches and enters their league name, we check this list;
   approved leagues sync to their own doc (leagues/league_<id>).
   Toggle approved=false to cut off access (e.g. non-payment).
   ============================================================ */
function normLeague(name) {
  return String(name||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')   // strip accents
    .trim().toLowerCase()
    .replace(/['’`]/g,'')                               // apostrophes vanish: jaren's → jarens
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-|-$/g,'');
}

/* generate a 5-digit league id not already in use */
function genLeagueId() {
  const used = new Set(Object.keys(STATE.approvals || {}));
  let id;
  do { id = String(Math.floor(10000 + Math.random() * 90000)); } while (used.has(id));
  return id;
}
/* Give an OLD name-based league a 5-digit ID. The new approval points at the SAME
   existing data doc (e.g. league_jarens-league), so no data moves — members can now
   join with the 5-digit ID and reach the commissioner's existing teams/draft. */
window.migrateLeagueId = function(oldKey) {
  const old = STATE.approvals?.[oldKey];
  if (!old) return;
  const newId = genLeagueId();
  STATE.approvals[newId] = {
    ...old,
    leagueId: newId,
    // KEEP the original data doc so existing data is reachable via the new ID
    leagueDocId: old.leagueDocId || ('league_' + oldKey),
    migratedFrom: oldKey,
    approved: true,
  };
  // If THIS device is the commissioner currently bound to the old doc, keep it bound
  // (the doc didn't change) and just remember the new ID for sharing.
  save({ master:true });
  openModal(`<div class="h2">5-digit ID created 🎉</div>
    <p class="sub mb">Share this ID with your members. It points to your existing league data — nothing was moved.</p>
    <div style="text-align:center;padding:1rem;background:var(--field-2);border-radius:8px;margin-bottom:1rem">
      <div class="sub" style="font-size:.65rem;letter-spacing:2px">LEAGUE ID</div>
      <div class="display amber" style="font-size:2.5rem;letter-spacing:6px">${newId}</div>
      <div class="sub" style="font-size:.7rem">${esc(old.leagueName||'')}</div>
    </div>
    <p class="sub" style="font-size:.66rem">The old text key still works too. You can remove it later once everyone has joined with the new ID.</p>
    <button class="btn btn-block" onclick="openCommishLog()">Done</button>`);
};
window.saveApproval = function() {
  const commish = $('ap-commish')?.value.trim() || '';
  const leagueName = $('ap-league')?.value.trim() || '';   // optional
  const pin = ($('ap-pin')?.value || '').trim();
  const id = genLeagueId();                          // 5-digit key (the required identifier)
  const sport = window._newLeagueSport || STATE.sport;
  const salaryAllowed = !!window._newLeagueSalary;
  STATE.approvals = STATE.approvals || {};
  STATE.approvals[id] = {
    commish,
    leagueName: leagueName || ('League ' + id),      // default name from ID if blank
    approved: true,
    leagueId: id,
    leagueDocId: 'league_' + id,
    sport,                                            // which sport this league belongs to
    salaryAllowed,                                    // did commissioner approve salary cap?
    pin: pin || '0000',                              // per-league commissioner PIN (editable later)
    created: Date.now(),
  };
  // clear the form's stashed PIN so it doesn't leak to the next create
  window._apPin = '';
  // switch to the chosen sport so the league is created under it
  STATE.sport = sport;
  // START THE NEW LEAGUE EMPTY.
  // STATE.leagues[sport] is a single per-sport object that the previous league was
  // using. Creating a league without resetting it meant the new league opened with
  // the old league's teams, draft, contracts and settings — and the saveLeague()
  // below then PUSHED all of that into the new league's Firestore doc. The player
  // pool is the one thing that carries over: it is reference data for the sport,
  // costly to re-pull, and identical for every league in it.
  const keepPool = (STATE.leagues[sport]?.playerPool) || [];
  STATE.leagues[sport] = blankLeague(leagueName || ('League ' + id));
  STATE.leagues[sport].playerPool = keepPool;
  STATE.memberId = null;                 // a new league needs a fresh claim
  save({master:true});
  // CRITICAL: the commissioner must JOIN the league they just created, so that all
  // their setup (teams, draft, settings) syncs to the league doc in Firebase. Without
  // this, activeLeagueDoc stays null and every save goes local-only — other devices
  // would join and see nothing.
  STATE.activeLeagueDoc = 'league_' + id;
  LG().leagueName = STATE.approvals[id].leagueName;
  // apply the approved salary setting to this league
  if (salaryAllowed) { ensureSettings(); LG().settings.useSalaryCap = true; }
  saveLocal();
  subscribeLeague('league_' + id);
  // Seed the empty league doc so members who join immediately get a real document
  // rather than nothing. (It used to push whatever the previous league had left in
  // memory, which is how a brand-new league arrived pre-populated.)
  saveLeague({ silent:true, allowEmpty:true });   // the wipe guard exists for accidents, not for a deliberate new league
  const shownName = leagueName || ('League ' + id);
  openModal(`<div class="h2">League created 🎉</div>
    <p class="sub mb">Your league now has its own link. Share it with members — or open it yourself.</p>
    <div style="text-align:center;padding:1rem;background:var(--field-2);border-radius:8px;margin-bottom:1rem">
      <div class="sub" style="font-size:.65rem;letter-spacing:2px">LEAGUE ID</div>
      <div class="display amber" style="font-size:2.5rem;letter-spacing:6px">${id}</div>

window.removeApproval = function(key) {

  openModal(`<div class="h2">Delete ${esc(a.leagueName || 'this league')}?</div>

window.confirmRemoveApproval = async function(key) {
  const a = (STATE.approvals || {})[key];
  if (!a) return;
  const docId = a.leagueDocId || ('league_' + key);
  const sport = sportForApproval(key);
  // another approval aliasing the same doc means the data is still in use
  const aliased = Object.entries(STATE.approvals).some(([k, v]) =>
    k !== key && (v.leagueDocId || ('league_' + k)) === docId);
  delete STATE.approvals[key];

  // stop listening before anything else, or the snapshot handler will happily
  // re-apply the league we are deleting
  const wasActive = STATE.activeLeagueDoc === docId;
  if (wasActive && _leagueUnsub) { try { _leagueUnsub(); } catch (e) {} _leagueUnsub = null; }

  if (!aliased && fbReady && deleteDoc) {
    try { await deleteDoc(doc(db, 'leagues', docId)); }
    catch (e) { toast('Removed here, but the cloud copy could not be deleted: ' + (e?.message || ''), 'err'); }
  }
  // forget it locally too — bindings, identity, and the learned sport
  Object.keys(STATE.leaguesBySport || {}).forEach(sk => {
    if (STATE.leaguesBySport[sk]?.activeLeagueDoc === docId) delete STATE.leaguesBySport[sk];
  });
  if (STATE.memberByLeague) delete STATE.memberByLeague[docId];
  if (STATE.sportByDoc) delete STATE.sportByDoc[docId];
  if (!aliased && STATE.leagues[sport]) {
    // keep the sport's player pool; it is reference data, not this league's
    const keepPool = STATE.leagues[sport].playerPool || [];
    STATE.leagues[sport] = blankLeague('');
    STATE.leagues[sport].playerPool = keepPool;
  }
  if (wasActive) { STATE.activeLeagueDoc = null; STATE.memberId = null; }
  saveLocal();
  save({ master: true });
  toast('League deleted', 'ok');
  if (wasActive) { closeModal(); goToHub(); } else { openCommishLog(); }
};

/* All leagues THIS DEVICE has ever joined (claimed a team in), across every sport —
   built from memberByLeague (leagueDocId -> memberId, set the moment a team is claimed
   and never cleared by "leave league") cross-referenced with approvals for the name/
   sport/current-id needed to quick-join. Two approval keys can alias the same data doc
   (a league migrated from a text key to a 5-digit id) — dedupe to one row, preferring
   the numeric id as the canonical join target. */
function joinedLeaguesList() {
  const mbl = STATE.memberByLeague || {};
  const appr = STATE.approvals || {};

  Object.keys(appr).forEach(id => {
    const a = appr[id];
    const docId = a.leagueDocId || ('league_' + id);

    const cur = byDoc[docId];

      // disagree with the league you actually land in
      byDoc[docId] = { id, leagueDocId: docId, leagueName: a.leagueName || ('League ' + id),
        sport: sportForApproval(id), approved: a.approved !== false };

/* Core join logic, shared by the manual gate, the URL deep-link, and the switcher.
   Returns true if joined, false if not (with a toast/UI explaining why). */
/* WHICH SPORT DOES THIS LEAGUE BELONG TO?
   The Enter button used to read appr.sport and, if that field was missing, simply
   leave the active sport alone — so opening a baseball league while basketball was
   active bound the baseball DOC to the basketball league object. LG() then returned
   basketball, and the app looked like it had just reopened the league you were
   trying to leave. It also renamed the basketball league to the baseball one.

   The master-load self-heal already assumed "no sport tag = baseball" (those
   approvals predate sport tagging); this is the same rule in one shared place, plus
   what the device has actually learned, so the two can never disagree again. */
function sportForApproval(id) {
  const a = (STATE.approvals || {})[id];
  if (a && SPORTS[a.sport]) return a.sport;
  const docId = (a && a.leagueDocId) || ('league_' + id);
  // what this device learned the last time it opened this doc for real
  const learned = (STATE.sportByDoc || {})[docId];
  if (SPORTS[learned]) return learned;
  // or whichever sport is currently bound to it
  for (const [sk, e] of Object.entries(STATE.leaguesBySport || {})) {
    if (e && e.activeLeagueDoc === docId && SPORTS[sk]) return sk;
  }
  return 'flb';   // untagged approvals predate basketball, so they are baseball
}
/* remember it, so an untagged approval only has to be resolved once */
function rememberSportForDoc(docId, sport) {
  if (!docId || !SPORTS[sport]) return;
  STATE.sportByDoc = STATE.sportByDoc || {};
  if (STATE.sportByDoc[docId] === sport) return;
  STATE.sportByDoc[docId] = sport;
  saveLocal();
}
function joinLeagueById(id, opts = {}) {
  // Accept a 5-digit ID, or ANY key that actually exists in approvals — a name-based
  // league URL can resolve to a legacy text key, which is still a real league.
  const known = !!(STATE.approvals && STATE.approvals[id]);
  if (!known && !/^\d{5}$/.test(String(id))) {
    if (!opts.silent) toast('Invalid League ID', 'err'); return false;
  }
  const appr = STATE.approvals?.[id];
  if (!appr) {
    if (!opts.silent) toast('League ID not found. Double-check it with your commissioner.', 'err');
    return false;
  }
  if (!appr.approved) {
    $('gate-inner').innerHTML = `
      <div class="brand-big"><span class="bl-the">THE</span><span class="bl-name">LEAGUE<span class="mark">.</span></span></div>
      <div class="step-label" style="color:var(--bad)">Access paused</div>
      <p class="sub" style="text-align:center;margin-bottom:1rem">
        This league's access is currently turned off. Please contact the site admin.</p>
      <button class="btn btn-ghost btn-block" onclick="showGate('landing')">← Back</button>`;
    $('gate').style.display = 'flex';   // show as-is — do NOT re-render another gate step over it
    return false;
  }
  // approved → adopt the league's sport FIRST. Everything below writes into
  // STATE.leagues[STATE.sport], so getting this wrong edits the wrong sport.
  const wantSport = sportForApproval(id);
  if (wantSport !== STATE.sport) STATE.sport = wantSport;
  LG().leagueName = appr.leagueName;
  // leagueDocFor(): a migrated/legacy approval may not carry an explicit leagueDocId
  const docId = leagueDocFor(id);
  STATE.activeLeagueDoc = docId;
  // restore this device's identity in THIS league if it was here before (so switching
  // between league URLs doesn't lose which team you claimed); otherwise start fresh.
  STATE.memberId = (STATE.memberByLeague || {})[docId] || null;
  // AFTER memberId is restored, never before: saveLocal() writes memberByLeague for
  // the active doc, so saving here while memberId still belonged to the league we
  // just left would overwrite this league's stored identity with the old one.
  rememberSportForDoc(docId, wantSport);
  window._settingsScope = 'league';   // Settings now configures THIS league
  saveLocal();
  // make this league's URL its own address: #league=<id> (bookmarkable, survives refresh)
  setLeagueHash(id);
  subscribeLeague(docId);
  hideGate();
  if (!opts.silent) toast(`Opened ${appr.leagueName}`, 'ok');
  go('home');
  return true;
}
/* Write / clear the URL hash so each league is its own address. Guarded so it
   doesn't retrigger the hashchange auto-join loop. */
/* Go to the hub: clear the URL to bare AND show the landing, so URL and view stay
   in sync. Use this everywhere a "back to hub" action happens in-app. */
function goToHub() {
  setLeagueHash(null);   // bare URL (pushes a hub history entry if the URL changes)
  window._pausedFor = null;
  showGate('landing');
}
/* Write the URL so each league is its own address AND a real browser-history entry,
   so Safari's back button steps league → hub naturally.
   - setLeagueHash(id): PUSH a new entry '#league=<id>' (so back returns to whatever
     was showing before — normally the hub).
   - setLeagueHash(null): return to the bare hub URL as its own entry. */
function setLeagueHash(id) {
  window._suppressHash = true;
  try {
    // never mint a name-slug before approvals exist — it wouldn't resolve on reload.
    // Fall back to the always-resolvable legacy form until the name is known.
    const frag = id ? (STATE.approvals?.[id] ? ('#' + leagueSlug(id)) : ('#league=' + id)) : '';
    const target = id ? (location.pathname + location.search + frag)
                      : (location.pathname + location.search);
    const current = location.pathname + location.search + location.hash;
    // only push a new history entry if the URL is actually changing — prevents
    // double entries when the boot deep-link already put us at this league URL.
    if (target !== current) history.pushState({ league: id || null }, '', target);
  } catch(e) {
    try {
      if (id) location.hash = STATE.approvals?.[id] ? leagueSlug(id) : ('league=' + id);
      else location.hash = '';
    } catch(e2) {}
  }
  setTimeout(() => { window._suppressHash = false; }, 50);
}
/* Seed a hub entry UNDER the current one at boot, so that when someone opens a
   league link directly (no prior hub view), pressing back still lands on the hub
   instead of leaving the site. Called once during boot when we start in a league. */
function seedHubHistory() {
  try {
    const here = location.pathname + location.search + location.hash;
    // replace current with a clean hub entry, then push the league back on top
    const leagueHash = location.hash;
    history.replaceState({ hub: true }, '', location.pathname + location.search);
    if (leagueHash) history.pushState({ league: true }, '', here);
  } catch(e) {}
}

/* ESPN PARKS EVERY UNDRAFTED PLAYER AT ONE CONSTANT ADP — 140.0 for basketball
   (last pick of a 10x14 draft), 260.0 for baseball (10x26) — and once a season's
   drafts are over it can stamp that constant on EVERYBODY: the live 2026 NBA feed
   returns 140.0 for all 1,097 players, Jokic included, while his real STANDARD
   draft rank sits right beside it at 1. Taking any positive ADP at face value made
   the whole pool "140+", and sorting on a constant meant the top-300 trim kept an
   arbitrary 300. Detect the constant per pull: the most common value, when it
   covers a big share of the payload, is the placeholder and not information. */
function detectAdpPlaceholder(raw) {
  const counts = {};
  let n = 0;
  raw.forEach(pp => {
    const a = (pp.player || pp).ownership?.averageDraftPosition;
    if (a > 0) { const k = Math.round(a * 10) / 10; counts[k] = (counts[k] || 0) + 1; n++; }
  });
  let best = null, bestN = 0;
  Object.entries(counts).forEach(([k, c]) => { if (c > bestN) { best = parseFloat(k); bestN = c; } });
  // a real ADP spread never has 30% of the league on the same tenth of a pick
  return (bestN >= 20 && bestN >= n * 0.3) ? best : null;
}
/* one player's draft slot: real ADP unless it is the placeholder, then ESPN's
   draft rank, then ownership % — so stars stay on top in every season phase */
function espnAdp(pl, placeholder) {
  let adp = pl.ownership?.averageDraftPosition || 0;
  if (placeholder != null && Math.abs(adp - placeholder) < 0.05) adp = 0;
  if (!(adp > 0)) {
    const ranks = pl.draftRanksByRankType || {};
    const r = ranks.STANDARD || ranks.PPR || ranks.STANDARDDRAFT || Object.values(ranks)[0];
    if (r && r.rank > 0) adp = r.rank;
  }
  if (!(adp > 0)) {
    // last resort: order by ownership % (more-owned = earlier). Map 100%→1, 0%→9999.
    const own = pl.ownership?.percentOwned || 0;
    adp = own > 0 ? Math.max(1, Math.round(1000 - own * 9)) : 9999;
  }
  return adp;
}
/* Fold a raw ESPN payload into the pool. Separate from the fetch so it can be
   tested, and because it has real rules of its own:
   - a payload that is basically empty means ESPN hasn't published the season yet
     (the league advanced before the sport did) — keep the pool we have
   - players the league already depends on (rostered, trade-blocked, watched)
     survive the top-300 trim even when ESPN ranks them below it
   - stat identity carries over: same espnId keeps its mlbId link and computed
     points, so a re-pull never resets a season's numbers or re-runs mapping */
function ingestPool(raw) {
  if (!Array.isArray(raw) || raw.length < 50) {
    throw new Error(`ESPN returned ${raw?.length || 0} players — season not published yet, keeping the current pool`);
  }
  const old = LG().playerPool || [];
  const oldById = {};
  old.forEach(p => { oldById[String(p.espnId)] = p; });
  const adpPlaceholder = detectAdpPlaceholder(raw);
  let pool = raw.map(pp => {
      const pl = pp.player || pp;
      const eligible = deriveEligibility(pl.eligibleSlots, pl.defaultPositionId);
      const defPos = posName(pl.defaultPositionId);
      const adp = espnAdp(pl, adpPlaceholder);
      // points: MLB uses ESPN's applied total (placeholder until game logs pull);
      // NBA computes from raw ESPN stats using the league's scoring right here.
      let seasonPts = 0, ptsPerGame = null, gamesPlayed = null;
      if (SP().statsApi === 'nba') {
        const np = nbaPointsFromEspn(pl);
        seasonPts = np.seasonPts;
        ptsPerGame = np.perGame;
        gamesPlayed = np.games;
      } else {
        seasonPts = seasonPointsFromEspn(pl);
      }
      return {
        espnId: pl.id,
        name: pl.fullName || `${pl.firstName||''} ${pl.lastName||''}`.trim(),
        pos: defPos,
        defPosId: pl.defaultPositionId,
        eligible,
        proTeam: proTeamAbbr(pl.proTeamId),
        eligSlots: pl.eligibleSlots || [],   // raw, for re-deriving eligibility later
        adp: Math.round(adp * 10) / 10,
        seasonPts,
        ptsPerGame, gamesPlayed,             // NBA per-game rate (null for MLB)
        ptsSeason: SP().statsApi === 'nba' ? seasonPts : null,  // mark NBA as "has points"
        owned: Math.round((pl.ownership?.percentOwned || 0) * 10) / 10,
        // already in the payload, previously discarded: the ownership delta is
        // most-added / most-dropped for free, and percentStarted says whether the
        // people who roster him actually trust him
        ownedChange: Math.round((pl.ownership?.percentChange || 0) * 100) / 100,
        startedPct: Math.round((pl.ownership?.percentStarted || 0) * 10) / 10,
        // Only real IL statuses count as injured — matching refreshInjuries(), so a
        // pool pull and an injury refresh can never disagree. DAY_TO_DAY is tracked
        // separately: those players are usually still playable and are not
        // IL-eligible anywhere.
        injured: /(_DL|_IL|^OUT$)/i.test(String(pl.injuryStatus || '')),
        dtd: /DAY_TO_DAY/i.test(String(pl.injuryStatus || '')),
        injuryStatus: pl.injuryStatus || null,
        mlbId: null,
      };
  }).filter(p => p.name);

  // sort by ADP (best first), then trim to the top 300. Keeping the pool small
  // and fixed keeps the synced Firebase doc well under the 1 MB limit. Players
  // outside the top 300 can be loaded individually to local storage on demand.
  // Ownership breaks ties, so the tail of equal-ADP players keeps its most-owned
  // names inside the trim instead of whoever the payload happened to list first.
  pool.sort((a,b) => (a.adp - b.adp) || ((b.owned||0) - (a.owned||0)));
  pool = pool.slice(0, 300);
  // players the league depends on survive the trim — a re-pull must never make a
  // rostered player vanish from the pool
  const have = new Set(pool.map(p => String(p.espnId)));
  const keep = new Set();
  (LG().draft?.picks || []).forEach(pk => { if (pk.playerId != null) keep.add(String(pk.playerId)); });
  ((LG().rookieDraft || {}).picks || []).forEach(pk => { if (pk.playerId != null) keep.add(String(pk.playerId)); });
  Object.values(LG().tradeBlock || {}).forEach(l => (l || []).forEach(id => keep.add(String(id))));
  Object.values(LG().watchLists || {}).forEach(l => (l || []).forEach(id => keep.add(String(id))));
  keep.forEach(id => { if (!have.has(id) && oldById[id]) { pool.push(oldById[id]); have.add(id); } });
  // carry stat identity and computed numbers across the re-pull. Two kinds of
  // field: the game-log-derived ones (weekly windows, last season) NEVER come from
  // the pool payload, so the old values always carry; the payload-supplied season
  // numbers (NBA computes them at pull time) win only when the fresh payload
  // actually contained games — a statless payload must not zero a real season.
  pool.forEach(p => {
    const o = oldById[String(p.espnId)];
    if (!o) return;
    if (o.mlbId != null && p.mlbId == null) p.mlbId = o.mlbId;
    if (o.mlbTeamId != null && p.mlbTeamId == null) p.mlbTeamId = o.mlbTeamId;
    ['pts7','pts14','pts30','bestAvg','bestAvg7','bestAvg14','bestAvg30','weeksPlayed',
     'prevPts','prevGames','prevPerGame','prevBestAvg','prevSeason']
      .forEach(k => { if (p[k] == null && o[k] != null) p[k] = o[k]; });
    const freshHasStats = (p.gamesPlayed || 0) > 0;
    ['ptsSeason','seasonPts','ptsPerGame','gamesPlayed']
      .forEach(k => { if (!freshHasStats && o[k] != null) p[k] = o[k]; });
  });
  LG().playerPool = pool;
  STATE.poolMeta = STATE.poolMeta || {};
  STATE.poolMeta[STATE.sport] = { pulledAt: Date.now(), season: statSeasonNow() };
  return { total: raw.length, stored: pool.length, placeholder: adpPlaceholder,
           ranked: pool.filter(p => p.adp < 9999).length };
}
window.doPullPool = async function(opts = {}) {
  try {
    const raw = await fetchPlayerPool(slog);
    const r = ingestPool(raw);
    if (r.placeholder != null) slog(`ESPN ADP is parked at ${r.placeholder} — using draft ranks instead`, 'run');
    slog(`Stored top ${r.stored} players (${r.ranked} with real ADP)`, 'ok');
    // mapping is part of the pull, not a second chore: MLB looks up only players
    // the carry-over didn't already link; NBA adopts its own ids instantly
    if (FEAT().gameLogs && LG().playerPool.some(p => !p.mlbId)) {
      try { await resolveMlbIds(slog, null); } catch (e) { slog('Mapping: ' + e.message, 'err'); }
    }
    _pooledOnce = false;               // let the points loop pick up the new faces
    _prevPooledOnce = false;
    await save({master:true});
    if (!opts.auto) toast('Player pool loaded (top 300)', 'ok');
    renderActive();
  } catch(e) {
    slog('Pool fetch failed: ' + e.message, 'err');
    if (!opts.auto) toast(e.message, 'err');
    throw e;
  }
};

/* ============================================================
   THE POOL PULLS ITSELF. Nobody should have to know that a button in master
   settings feeds the entire app. A pull happens when the pool is missing, when
   it was stored for a season the league has since left, when its ADP is the
   parked constant an old pull saved, or when it is simply a week old (ownership,
   eligibility and injuries drift). The freshness stamp lives in the master doc,
   so ONE device's pull satisfies every device in the league — phones don't each
   download a 190 MB payload because someone opened the app.
   ============================================================ */
const POOL_REFRESH_MS = 7 * 24 * 3600 * 1000;
let _poolPullRunning = false;
const _poolPullTriedAt = {};           // per sport, this session — no retry storms
function poolLooksParked() {
  const pool = LG().playerPool || [];
  if (pool.length < 50) return false;
  const counts = {};
  pool.forEach(p => { if (p.adp > 0 && p.adp < 9999) { const k = Math.round(p.adp*10)/10; counts[k] = (counts[k]||0)+1; } });
  const top = Math.max(0, ...Object.values(counts));
  return top >= pool.length * 0.5;
}
function poolNeedsRefresh() {
  const pool = LG().playerPool || [];
  if (!pool.length) return 'empty';
  const meta = (STATE.poolMeta || {})[STATE.sport] || {};
  if (meta.season && meta.season !== statSeasonNow()) return 'season';
  if (poolLooksParked()) return 'adp';
  if (!meta.pulledAt || Date.now() - meta.pulledAt > POOL_REFRESH_MS) return 'stale';
  return null;
}
let _poolPullLastError = null;   // shown on the players page so a screenshot diagnoses itself
function ensureFreshPool() {
  if (_poolPullRunning || !STATE._loaded) return;
  if (LG().draft?.live) return;                       // never swap the pool mid-draft
  const why = poolNeedsRefresh();
  if (!why) return;
  const sport = STATE.sport;
  if (Date.now() - (_poolPullTriedAt[sport] || 0) < 3600 * 1000) return;
  _poolPullTriedAt[sport] = Date.now();
  _poolPullRunning = true;
  slog(`Player pool ${why === 'empty' ? 'missing' : why === 'season' ? 'is for an old season'
       : why === 'adp' ? 'has parked ADP' : 'is a week old'} — refreshing from ESPN`, 'run');
  doPullPool({ auto: true })
    .then(() => { _poolPullLastError = null; })
    .catch((e) => { _poolPullLastError = e?.message || 'unknown'; })   // retried next hour
    .finally(() => { _poolPullRunning = false; renderActive(); });
}
/* one line of pool health for the players page — silent when everything is fine */
function poolHealthLine() {
  if (_poolPullRunning) return '<span class="amber">Refreshing the player pool from ESPN…</span>';
  const why = poolNeedsRefresh();
  if (!why) return '';
  const what = why === 'empty' ? 'is loading itself'
    : why === 'season' ? 'is from an old season — refreshing'
    : why === 'adp' ? 'has stale draft data — refreshing'
    : 'is due a refresh';
  return `<span class="amber">Player pool ${what}.</span>${_poolPullLastError
    ? ` <span class="cell-neg">Last try failed: ${esc(_poolPullLastError)}</span>` : ''}`;
}

/* compute atomic eligibility from raw ESPN slots + default position id.
   Shared by the pool pull and the re-derive button so they never diverge. */
function deriveEligibility(eligSlots, defaultPositionId, sportKey) {
  const sp = SPORTS[sportKey] || SP();   // use the EXPLICIT sport when given
  const isMLB = sp.key === 'flb';
  // position sort order differs by sport
  const order = isMLB
    ? ['C','1B','2B','3B','SS','OF','DH','SP','RP']
    : ['PG','SG','SF','PF','C','G','F'];   // NBA
  const eligMap = sp.eligMap || {};
  const atomic = new Set();
  (eligSlots||[]).forEach(slotId => (eligMap[slotId]||[]).forEach(pos => atomic.add(pos)));
  const defPos = (sp.posMap||{})[defaultPositionId] || posName(defaultPositionId);
  if (defPos && defPos !== '?') atomic.add(defPos);
  if (isMLB) {
    // pitcher/hitter separation is baseball-specific
    const isPitcher = defaultPositionId === 1 || defaultPositionId === 11;
    if (isPitcher) {
      ['C','1B','2B','3B','SS','OF','DH'].forEach(h => atomic.delete(h));
      if (!atomic.has('SP') && !atomic.has('RP')) atomic.add(defPos);
    } else {
      atomic.delete('SP'); atomic.delete('RP');
    }
  }
  const eligible = [...atomic].sort((a,b) => order.indexOf(a) - order.indexOf(b));
  return eligible.length ? eligible : [defPos];
}

/* re-derive eligibility for the WHOLE pool from stored raw slots — no ESPN re-pull.
   Use after changing eligMap rules. */
window.reDeriveEligibility = function() {
  let changed = 0;
  LG().playerPool.forEach(p => {
    const before = (p.eligible||[]).join('/');
    p.eligible = deriveEligibility(p.eligSlots, p.defPosId);
    if ((p.eligible||[]).join('/') !== before) changed++;
  });
  save({master:true});
  toast(`Eligibility re-derived · ${changed} players updated`, 'ok');
  renderActive();
};

/* All salary-rule edits write into the ACTIVE sport's slot, never a shared object,
   so editing basketball's rules can never move baseball's. */
function salCfgSlot() {
  normalizeSalaryConfig();
  const sk = STATE.sport || 'flb';
  // arbSalaryDerived is a computed marker, not a setting — persisting it would make
  // an auto minimum look hand-set the next time it's read back.
  const { arbSalaryDerived, ...cfg } = SALCFG(sk);
  if (arbSalaryDerived) delete cfg.arbSalary;   // keep letting the data decide
  STATE.salaryConfig[sk] = cfg;
  return STATE.salaryConfig[sk];
}
window.setSalCfg = function(key, val) {
  salCfgSlot()[key] = parseFloat(val) || 0;
  save({master:true});
};
/* set a salary-config value that's entered in MILLIONS (stored as dollars) */
window.setSalCfgM = function(key, val) {

/* cap headroom multiplier per league type, e.g. setCapHeadroom('dynasty', 1.3) */

/* Will this team actually be able to pay its pick penalty, or does it convert to
   money? Answered without mutating anything, so the rollover preview can say. */
function penaltyPayableIn(teamId, startYear, picksOwed) {
  const taken = new Set();
  let payable = 0;
  // mirrors confirmSeasonRollover exactly: pick k is round k+1, same round only,
  // inside the roll window. If the preview and the rollover ever disagree, the
  // preview is lying about what the button is going to do.
  for (let k = 0; k < picksOwed; k++) {
    const y = penaltyPickYear(teamId, k + 1, startYear, taken);
    if (y == null) continue;
    taken.add(y + ':' + (k + 1)); payable++;
  }
  return payable;
}
window.openSeasonRollover = function() {
  // Every league ends its season — a points-only league just has no cap business
  // to settle on the way. The preview below only shows the sections that apply.
  const yr = currentSeasonYear();
  const cap = !!LSET().useSalaryCap;
  const type = LSET().leagueType || 'redraft';
  // preview penalties per team (cap leagues only)
  const teamLines = cap ? LG().teams.map(t => {
    const pen = teamCapPenalty(t.id, yr);
    return { t, pen };
  }) : [];
  const overTeams = teamLines.filter(x => x.pen.picks > 0);
  const penHtml = overTeams.length ? overTeams.map(x => {
    // say up front which of these are payable in picks and which turn into money —
    // a team that traded its picks away pays the overage as dead cap instead
    const payable = penaltyPayableIn(x.t.id, yr + 1, x.pen.picks);
    const missing = x.pen.picks - payable;
    return `<div style="padding:.3rem 0;border-bottom:1px solid rgba(42,61,48,.4)">
      <div class="row-between">
        <span style="font-size:.8rem">${esc(x.t.name)}</span>

          + ${fmtMoney(x.pen.over)}</span>
      </div>
      <div class="sub" style="font-size:.66rem">${fmtMoney(x.pen.over)} dead cap in ${yr+1}${
        missing > 0 ? ` · only ${payable} of ${x.pen.picks} pick${x.pen.picks!==1?'s':''} is theirs to take — the money is charged in full either way` : ''}</div>
    </div>`;
  }).join('') : '<p class="sub" style="font-size:.75rem">No teams are over the cap. No pick penalties.</p>';

    ${cap ? `<div class="divlabel">Pick penalties (over-cap teams)</div>
    ${penHtml}

      amount you went over by, as dead cap next season. Picks already traded away stay with the team that acquired
      them; the forfeit falls on the penalised team's own pick of the same round the year after instead — no further,
      and never a different round. A pick they cannot pay is simply not taken; the money is charged in full regardless.</p>` : ''}
