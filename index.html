/* the filtered+sorted pool used by both the players page and draft room */
function filteredPool() {
  const draftedIds = new Set(LG().draft.picks.map(pk => String(pk.playerId)));
  let list = LG().playerPool.filter(p => {
    if (playerView.search && !normName(p.name).includes(normName(playerView.search))) return false;
    if (playerView.grpFilter && playerView.grpFilter !== 'all') {
      const elig = (p.eligible||[]).join(' ');
      const isPitcher = /\bSP\b|\bRP\b/.test(elig) && !/\bC\b|1B|2B|3B|SS|\bOF\b|\bDH\b/.test(elig);
      if (playerView.grpFilter==='pitchers' && !isPitcher) return false;
      if (playerView.grpFilter==='batters' && isPitcher) return false;
    }
    if (playerView.posFilter !== 'ALL') {
      const elig = (p.eligible||[]).join(' ') + ' ' + (p.pos||'');
      if (!elig.includes(playerView.posFilter)) return false;
    }
    return true;
  });
  // the draft room lets you re-sort by the stat column or by salary, same as the
  // players page — 'adp' (and the legacy 'seasonPts' default) mean draft order
  const s = playerView.sort, dir = playerView.dir || 1;
  const win = activeStatWindow();
  if (s === 'pts') list.sort((a,b) => dir * ((a[ptsFieldFor(win,a)] ?? -Infinity) - (b[ptsFieldFor(win,b)] ?? -Infinity)));
  else if (s === 'salary') list.sort((a,b) => dir * ((playerCapHit(a) ?? 0) - (playerCapHit(b) ?? 0)));
  else list.sort((a,b)=>a.adp-b.adp);
  return list;
}
/* a team's total for a given week = sum of its starters' best single game */
function teamWeekTotal(teamId, week) {
  const roster = rosterForWeek(teamId, week);   // includes mid-week-drop holdovers
  const starters = getStarters(teamId, week);
  let total = 0;
  starters.forEach(pid => {
    const p = roster.find(r => String(r.espnId)===String(pid));
    if (p) total += playerWeekScore(p, week);   // format-aware: best game / sum / scoped
  });
  return Math.round(total*10)/10;
}
/* a team's season total across all weeks up to (and including) the current week */
function teamSeasonTotal(teamId) {
  const upTo = currentWeekNow();
  let total = 0;
  for (let w = 1; w <= upTo; w++) total += teamWeekTotal(teamId, w);
  return Math.round(total*10)/10;
}

/* round-robin matchup schedule: returns opponentId for teamId in a given week.
   Standard circle method; teams rotate. Deterministic from team order. */
function matchupSchedule() {
  let ids = (LG().draft.order?.length ? LG().draft.order : LG().teams.map(t=>t.id)).slice();
  if (ids.length < 2) return {};
  const bye = (ids.length % 2 === 1);
  if (bye) ids.push('__BYE__');
  const n = ids.length, rounds = n - 1, half = n/2;
  const sched = {};  // week -> [[a,b],...]
  let arr = ids.slice();
  for (let r = 0; r < rounds; r++) {
    const pairs = [];
    for (let i = 0; i < half; i++) pairs.push([arr[i], arr[n-1-i]]);
    sched[r+1] = pairs;
    // rotate (keep first fixed)
    arr = [arr[0], arr[n-1], ...arr.slice(1, n-1)];
  }
  return sched;
}
/* who does teamId play in week? (cycles through the rounds if season > rounds) */
function opponentFor(teamId, week) {
  const sched = matchupSchedule();
  const rounds = Object.keys(sched).length;
  if (!rounds) return null;
  const wk = ((week - 1) % rounds) + 1;
  const pairs = sched[wk] || [];
  for (const [a,b] of pairs) {
    if (String(a)===String(teamId)) return b==='__BYE__'?null:b;
    if (String(b)===String(teamId)) return a==='__BYE__'?null:a;
  }
  return null;
}

/* full H2H record for every team through the current week.
   Returns { teamId: {w,l,t, pf, pa, bonusW, bonusL} }. */
function computeRecords() {
  const cur = currentWeekNow();
  const teams = LG().teams.map(t=>t.id);
  const rec = {}; teams.forEach(id => rec[id] = {w:0,l:0,t:0,pf:0,pa:0,bonusW:0,bonusL:0});
  const bonus = LSET().bonusWin;
  for (let wk = 1; wk <= cur; wk++) {
    // skip weeks with no games played yet by anyone (avoids 0-0 phantom losses)
    const totals = {}; let anyPlayed = false;
    teams.forEach(id => { const tot = teamWeekTotal(id, wk); totals[id]=tot; if (tot>0) anyPlayed=true; });
    if (!anyPlayed) continue;
    // head-to-head — each matchup processed once, result credited to BOTH teams
    teams.forEach(id => { rec[id].pf += totals[id]; });
    const counted = new Set();
    teams.forEach(id => {
      const opp = opponentFor(id, wk);
      if (!opp || counted.has(id+'-'+opp)) return;
      counted.add(id+'-'+opp); counted.add(opp+'-'+id);
      const a = totals[id]||0, b = totals[opp]||0;
      rec[id].pa += b; rec[opp].pa += a;
      if (a > b) { rec[id].w++; rec[opp].l++; }
      else if (a < b) { rec[id].l++; rec[opp].w++; }
      else { rec[id].t++; rec[opp].t++; }
    });
    // bonus win: top half of weekly scorers get +W, bottom half +L
    if (bonus) {
      const ranked = teams.slice().sort((a,b)=>(totals[b]||0)-(totals[a]||0));
      const half = Math.floor(ranked.length/2);
      ranked.forEach((id,i) => {
        if (i < half) { rec[id].w++; rec[id].bonusW++; }
        else if (ranked.length - i <= half) { rec[id].l++; rec[id].bonusL++; }
      });
    }
  }
  return rec;
}

/* WHO IS ACTUALLY IN, AND WHO IS OUT.
   The ✦ marker means "in the playoffs as it stands", which flips week to week and
   means nothing in October. A clinch is a different claim: it is arithmetic. Count
   the weeks nobody has played yet, work out the best and worst every team can still
   finish on, and only assert a result that no remaining outcome can change.

   Deliberately conservative in both directions. For a clinch, a rival who can merely
   DRAW level counts as able to pass you, because the tiebreak could go their way. For
   elimination, rivals must be strictly ahead in every remaining scenario. It also
   ignores that two teams playing each other cannot both win out — which only ever
   makes it slower to declare, never wrong.

   Returns { teamId: { clinched, top, out } }. */
function clinchState() {
  const out = {};
  const teams = LG().teams.map(t => t.id);
  const berths = Math.min(teams.length, Number(LSET().playoffTeams) || 0);
  const lastRegular = (Number(LSET().playoffStartWeek) || 0) - 1;
  if (!berths || lastRegular < 1 || teams.length < 2) return out;   // no playoffs configured
  const rec = computeRecords();
  // Weeks still to be played = the ones computeRecords skipped because nobody has
  // scored in them. Using its own test means the two can never disagree about which
  // weeks are already in the record.
  let weeksLeft = 0;
  for (let wk = 1; wk <= lastRegular; wk++) {
    if (!teams.some(id => teamWeekTotal(id, wk) > 0)) weeksLeft++;
  }
  // a bonus-win league pays up to two a week: the head-to-head and the top-half bonus
  const maxAdd = weeksLeft * (LSET().bonusWin ? 2 : 1);
  // half a win for a tie, matching how the table itself sorts (w + t/2 over games)
  const now = {}, best = {};
  teams.forEach(id => {
    const r = rec[id] || { w: 0, t: 0 };
    now[id] = (r.w || 0) + (r.t || 0) * 0.5;
    best[id] = now[id] + maxAdd;
  });
  teams.forEach(id => {
    const couldReach = teams.filter(o => o !== id && best[o] >= now[id]).length;
    const surelyAhead = teams.filter(o => o !== id && now[o] > best[id]).length;
    const st = { clinched: false, top: false, out: false };
    if (couldReach < berths) st.clinched = true;      // at worst finishes couldReach+1
    if (couldReach < 1) st.top = true;                // nobody can catch them at all
    if (surelyAhead >= berths) st.out = true;         // that many finish above, certainly
    if (st.clinched || st.out || st.top) out[id] = st;
  });
  return out;
}

      <td class="pos">${esc((p.eligible||[]).join('/')||p.pos)}</td>
      <td class="pos">${esc(p.proTeam||'')}</td>
      <td class="r num cell-best">${showPts ? (p.seasonPts||0).toFixed(0) : (p.adp<9999?p.adp.toFixed(0):'—')}</td>
    </tr>`).join('');
  openModal(`
    <div class="h2">${esc(t.name)}</div>
    <div class="sub mb">${esc(t.owner||'')} · ${roster.length} players${showPts ? ` · ${seasonTotal.toFixed(0)} season pts` : ''}</div>
    <table class="tbl mt">
      <thead><tr><th>Pick</th><th>Player</th><th>Pos</th><th>Tm</th><th class="r">${showPts?'Pts':'ADP'}</th></tr></thead>
      <tbody>${rosterRows || '<tr><td colspan="5" class="sub">No players</td></tr>'}</tbody>
    </table>
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Close</button>
  `);
};
function viewPlayers()   { return viewPlayersReal(); }

/* ============================================================
   MY TEAM — pick once (permanent), then see roster + daily scoring
   ============================================================ */
function viewMyTeam() {
  // not chosen yet → prompt selection (only OPEN teams) or auto-create
  if (!myTeamId()) {
    // JOINING IS PERMANENT, so the choice has to be legible. A bare list of names
    // tells you nothing about what you are taking over — an open team may already
    // have a drafted roster behind it (someone left, or the commissioner made it),
    // and claiming the wrong one is not undoable. Every row says what it is.
    const claimedTeamIds = new Set(Object.values(LG().members||{}).map(m => String(m.teamId)));
    const all = LG().teams || [];
    const openTeams = all.filter(t => !claimedTeamIds.has(String(t.id)));
    const takenTeams = all.filter(t => claimedTeamIds.has(String(t.id)));
    const row = (t) => {
      const n = teamRoster(t.id).length;
      return `<div class="card card-tight mt">
        <div class="row-between" style="align-items:center;gap:.6rem">
          <div style="min-width:0">
            <div style="font-weight:700;font-size:.9rem">${esc(t.name)}</div>
            <div class="sub" style="font-size:.68rem">
              ${t.owner ? `previously ${esc(t.owner)}` : 'no owner yet'} ·
              ${n ? `<b class="amber">${n} player${n!==1?'s':''} already drafted</b>` : 'empty roster'}
            </div>
          </div>
          <button class="btn btn-sm btn-amber" style="flex:none" onclick="pickMyTeam('${t.id}')">Join</button>
        </div>
      </div>`;
    };
    // A TAKEN TEAM STILL NEEDS A BUTTON. These used to render as a dimmed,
    // non-interactive line — which meant the "is this you on another device?"
    // confirmation was unreachable from the UI, however well it worked when called
    // directly. The second-device case is the whole reason this list shows taken
    // teams at all, so each one carries the way in.
    const takenRows = takenTeams.map(t => {
      const owner = Object.values(LG().members||{}).find(m => String(m.teamId)===String(t.id));
      return `<div class="row-between" style="padding:.35rem 0;font-size:.74rem;align-items:center;gap:.5rem">
        <span style="min-width:0">${esc(t.name)}
          <span class="sub" style="font-size:.66rem;display:block">taken · ${esc(owner?.name||'')}</span></span>
        <button class="btn btn-sm btn-ghost" style="flex:none" onclick="pickMyTeam('${t.id}')">This is me</button>
      </div>`;
    }).join('');
    return `<div class="eyebrow">${esc(LG().leagueName||'League')} · one-time choice</div>
      <div class="h1">Join this league</div>
      ${openTeams.length
        ? `<p class="sub mt mb">Take over one of these teams, or start a new one. Whichever you pick is
             <b>permanent</b> — read the line under each name before you tap Join.</p>
           ${openTeams.map(row).join('')}
           <div class="divlabel mt">Or</div>`
        : `<p class="sub mt mb">${all.length ? 'Every team is taken, so a new one will be created for you.'
             : 'This league has no teams yet — yours will be the first.'}</p>`}
      <button class="btn btn-amber btn-block mt" onclick="createMyTeam()">+ Start a new team</button>
      ${takenRows ? `<div class="divlabel mt">Already taken</div>
        <p class="sub mb" style="font-size:.68rem">Opening the league on a second device? Tap <b>This is me</b>
          on your own team to use it here too — it stays one team, one owner.</p>
        <div class="card card-tight">${takenRows}</div>` : ''}`;
  }

  const mine = myTeamId();
  // which team are we viewing? defaults to mine; can browse others read-only
  const viewingId = STATE.viewingTeamId || mine;
  const isMine = String(viewingId) === String(mine);
  const t = teamById(viewingId);
  const week = activeWeek();
  // week-aware: a player dropped mid-week still shows in the week they were locked into
  const roster = rosterForWeek(viewingId, week);
  const starters = getStarters(viewingId, week);
  const haveLogs = Object.keys(LG().gameLogs||{}).length > 0;

  // team weekly total = sum of STARTERS' best game
  // use the league's ACTUAL scoring rule so this matches standings/matchups. (It used
  // to always sum best-games, which silently disagreed with the real total in
  // every-game-counts leagues.)
  const teamTotal = teamWeekTotal(viewingId, week);

  const { start, end } = weekDateRange(week);
  const dayHeads = weekDays(week).map(d =>
    `<div class="dhead">${['Su','M','Tu','W','Th','F','Sa'][d.getDay()]}<br>${d.getMonth()+1}/${d.getDate()}</div>`).join('');

  // reverse lookup: playerId -> assigned slot index + label
  const lu = getLineup(viewingId, week);
  const assign = lu.assignments || {};
  const slotOf = {}; // espnId -> {idx, label}
  Object.entries(assign).forEach(([idx, pid]) => {
    // ignore stale indices beyond the current slot count (roster overrides can shrink
    // the lineup) so those players fall back to the bench list instead of vanishing
    if (pid && activeLineupSlots()[idx]) slotOf[String(pid)] = { idx: +idx, label: activeLineupSlots()[idx].slot };
  });
  // Editability is now PER PLAYER (each locks at their own first game), so the only
  // blanket restriction left is viewing someone else's team. Past weeks are frozen
  // by playerLockedForWeek itself.
  const locked = !isMine;

  // schedule for this week (from cache; autoPull populates it)
  const weekSched = (() => {
    const days0 = weekDays(week);
    const key = `${SP().season}_${ymd(days0[0])}_${ymd(days0[days0.length-1])}`;
    return LG().scheduleCache?.[key] || null;
  })();
  const todayYmd = ymd(new Date());

  // build a card per player
  const cardFor = (p) => {
    const slot = slotOf[String(p.espnId)];
    const isStarter = !!slot;
    const games = p.mlbId ? playerWeekGames(p.mlbId, week) : [];
    const best = p.mlbId ? playerBestGame(p.mlbId, week) : null;
    // HOW OFTEN DOES HE PLAY THIS WEEK. In basketball this is the entire start/sit
    // decision — a four-game week beats a better player with two — and nothing in
    // the app counted it. Silent when the schedule for this week isn't cached yet.
    const gc = playerWeekGameCount(p, week);
    const gcTag = gc.total ? `<span class="sub" style="font-size:.6rem;white-space:nowrap"
      title="${gc.played} played, ${gc.left} left this week">${gc.total} gm${gc.left ? ` · ${gc.left} left` : ''}</span>` : '';
    const cells = weekDays(week).map((d,i) => {
      const g = games.find(x => x.dayIdx === i);
      if (g) {
        const isBest = best && g.date === best.date && isStarter;
        const cls = 'dcell' + (isBest?' best':'') + (g.pts<0?' neg':'');
        return `<div class="${cls}" onclick="showGameBreakdown('${p.mlbId}',${week},${i})">${g.pts}</div>`;
      }
      // no game logged → if it's today/future and we have schedule, show matchup
      const dYmd = ymd(d);
      if (dYmd >= todayYmd && weekSched) {
        const m = playerDayMatchup(p, dYmd, weekSched);
        if (m) {
          // A hitter's day is defined by the arm he is facing. The name only exists
          // once the other club announces it — a day or two out — so this is blank
          // more often than not and the opponent tag has to stand on its own.
          const facing = (!m.isProbable && m.oppProb && m.oppProb.name)
            ? `<span class="ps-tag" style="background:none;color:var(--sage-dim)"
                 title="Probable starter: ${esc(m.oppProb.name)}">${esc(lastNameOf(m.oppProb.name))}</span>` : '';
          return `<div class="dcell upcoming">
            <span class="opp-tag">${esc(m.opp)}</span>
            ${m.isProbable?'<span class="ps-tag">PROB</span>':facing}
          </div>`;
        }
      }
      return `<div class="dcell dnf">·</div>`;
    }).join('');

    // tappable slot badge → opens position picker. Lock is PER PLAYER: this player
    // is frozen once their own first game of the week starts.
    // a held-over player was dropped mid-week — frozen in place for this week only
    const pLocked = locked || p.heldOver || playerLockedForWeek(p, week);
    const onIR = isOnIR(p.espnId, viewingId);
    const badge = p.heldOver
      ? `<span class="starter-badge s" style="opacity:.8" title="Dropped mid-week — still counts for week ${week}">${esc(slot?.label||'')} 🔒</span>`
      : onIR
      ? `<span class="starter-badge b" style="opacity:.7">IL</span>`
      : isStarter
      ? `<span class="starter-badge s" style="cursor:${pLocked?'default':'pointer'}"
          ${pLocked?'':`onclick="pickPosition('${p.espnId}')"`}>${esc(slot.label)} ${pLocked?'🔒':'▾'}</span>`
      : `<span class="starter-badge b" style="cursor:${pLocked?'default':'pointer'}"
          ${pLocked?'':`onclick="pickPosition('${p.espnId}')"`}>BENCH ${pLocked?'🔒':'▾'}</span>`;

    // COMPACT MODE: one line per player instead of a card with a seven-day grid.
    // A 21-man roster is nearly nine thousand pixels tall in card view, which is
    // fine for setting a lineup and hopeless for "who do I have again".
    if (rosterDense()) {
      return `<div class="row-between" style="padding:.3rem .1rem;border-bottom:1px solid rgba(42,61,48,.35)">
        <span class="row" style="gap:.4rem;align-items:center;min-width:0">
          ${badge}
          <span class="plink" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
            onclick="showPlayer('${p.espnId}')">${esc(p.name)}</span>
          ${injuryBadge(p)}
        </span>
        <span class="row" style="gap:.5rem;align-items:center;flex-shrink:0">
          <span class="sub" style="font-size:.62rem">${esc((p.eligible||[]).join('/'))}</span>
          ${gcTag}
          ${contractTagHtml(p, { size: '.6rem' })}
          ${LSET().useSalaryCap?`<span class="sub" style="font-size:.64rem">${fmtMoney(teamPlayerCapHit(viewingId, p, currentSeasonYear()))}</span>`:''}
          <span class="num amber" style="font-weight:700;min-width:2ch;text-align:right">${best?best.pts:'—'}</span>
        </span>
      </div>`;
    }
    return `<div class="pcard ${isStarter?'':'bench'}">
      <div class="row-between" style="margin-bottom:.4rem">
        <div class="row" style="gap:.5rem;align-items:center">
          ${headshotImg(p, 38)}
          <div>
            ${badge}
            ${injuryBadge(p)}
            <span class="plink" style="margin-left:.4rem" onclick="showPlayer('${p.espnId}')">${esc(p.name)}</span>
            <span class="sub" style="font-size:.7rem"> ${esc((p.eligible||[]).join('/'))}</span>
            ${gcTag ? ` · ${gcTag}` : ''}
            ${contractTagHtml(p, { size: '.62rem' }) ? ` · ${contractTagHtml(p, { size: '.62rem' })}` : ''}
            ${p.heldOver ? `<span class="sub" style="font-size:.6rem;display:block;color:var(--amber)">dropped — final week here</span>`
              : pLocked && !onIR ? `<span class="sub" style="font-size:.6rem;display:block">🔒 locked</span>` : ''}
          </div>
        </div>
        <div style="text-align:right">
          <div class="num amber" style="font-weight:700">${best?best.pts:'—'}</div>
          <div class="sub" style="font-size:.55rem">BEST</div>
        </div>
      </div>
      <div class="daygrid" style="grid-template-columns:repeat(7,1fr)">
        ${dayHeads}${cells}
      </div>
    </div>`;
  };

  // STARTERS RENDER BY SLOT, not by player: every lineup slot always appears, in order.
  // An unfilled slot shows as an empty placeholder rather than vanishing from the page.
  const emptySlotCard = (s, idx) => rosterDense() ? `
    <div class="row-between" style="padding:.3rem .1rem;border-bottom:1px solid rgba(42,61,48,.35);opacity:.7">
      <span class="row" style="gap:.4rem;align-items:center">
        <span class="starter-badge s" style="opacity:.55">${esc(s.slot)}</span>
        <span class="sub" style="font-size:.76rem">Empty</span>
      </span>
      ${isMine && !locked
        ? `<button class="btn btn-sm btn-ghost" onclick="fillSlot(${idx})">+ Fill</button>`
        : `<span class="sub" style="font-size:.65rem">—</span>`}
    </div>` : `
    <div class="pcard empty-slot">
      <div class="row-between">
        <div>
          <span class="starter-badge s" style="opacity:.55">${esc(s.slot)}</span>
          <span class="sub" style="margin-left:.5rem;font-size:.78rem">Empty</span>
        </div>
        ${isMine && !locked
          ? `<button class="btn btn-sm btn-ghost" onclick="fillSlot(${idx})">+ Fill</button>`
          : `<span class="sub" style="font-size:.65rem">—</span>`}
      </div>
    </div>`;
  // a slot only counts as filled if it resolves to a real, non-IL rostered player —
  // a stale id (dropped/traded) or an IL player leaves the slot genuinely empty
  const slotPlayer = (idx) => {
    const pid = assign[idx];
    if (!pid) return null;
    const p = roster.find(r => String(r.espnId)===String(pid));
    if (!p || isOnIR(p.espnId, viewingId)) return null;
    return p;
  };
  const shown = new Set();
  const starterCards = (activeLineupSlots()||[]).map((s, idx) => {
    const p = slotPlayer(idx);
    if (p) shown.add(String(p.espnId));
    return p ? cardFor(p) : emptySlotCard(s, idx);
  }).join('');
  // bench = everyone not occupying a slot above and not on IL (covers players whose
  // assignment index no longer exists after a roster-size change)
  const benchList = roster.filter(p => !shown.has(String(p.espnId)) && !isOnIR(p.espnId, viewingId));
  const irList = roster.filter(p => isOnIR(p.espnId, viewingId));
  const benchCards = benchList.map(cardFor).join('');
  const irCards = irList.map(cardFor).join('');
  const filledCount = shown.size;

  return `
    <div class="eyebrow">${isMine?'★ Your team':'👁 Viewing'} · ${esc(t.name)}${
      // a pen right beside the name you are looking at, so renaming is where you
      // read the name. Inline, not a flex child, or it drops to its own line when
      // a long name wraps.
      isMine?` <button class="btn btn-ghost" style="display:inline-block;padding:0 .3rem;font-size:.7rem;line-height:1.4;min-height:0;vertical-align:middle"
        onclick="openRenameTeam()" title="Rename your team" aria-label="Rename your team">✎</button>`:''
      }${t.owner?` · ${esc(t.owner)}`:''}</div>
    <div class="row-between">
      <div class="h1">${isMine?'My Team':'League Team'}</div>
      ${isMine ? '' : `<button class="btn btn-sm btn-amber" onclick="viewMyOwnTeam()">← My team</button>`}
    </div>

    ${isMine && ilBlockReason(mine) ? `<div class="card card-tight mt" style="border-color:var(--bad)">
      <p class="sub" style="font-size:.74rem;color:var(--bad)">🩹 ${esc(ilBlockReason(mine))}.
        Adds and trades are blocked until you do. Tap their IL badge to activate.</p>
    </div>` : ''}
    ${isMine && LSET().useSalaryCap ? (() => {
      // In a cap league payroll is the number you want in front of you at all times,
      // not one buried behind the Contracts tab.
      const spent = teamSalaryTotal(mine), cap = leagueCap(), space = cap - spent;
      return `<div class="row-between" style="margin-top:.4rem;font-size:.72rem">
        <span class="sub">Payroll <b class="${space<0?'cell-neg':'amber'}">${fmtMoney(spent)}</b> of ${fmtMoney(cap)}</span>
        <span class="${space<0?'cell-neg':''}" style="${space>=0?'color:var(--good)':''}">${space<0?`${fmtMoney(-space)} over`:`${fmtMoney(space)} free`}</span>
      </div>`;
    })() : ''}

    <div class="row" style="gap:.35rem;margin-top:.5rem;flex-wrap:wrap">
      <button class="btn btn-sm ${teamViewMode==='lineup'?'btn-amber':'btn-ghost'}" onclick="setTeamView('lineup')">📋 Lineup</button>
      <button class="btn btn-sm ${teamViewMode==='stats'?'btn-amber':'btn-ghost'}" onclick="setTeamView('stats')">📊 Stats</button>
      ${LSET().useSalaryCap?`<button class="btn btn-sm ${teamViewMode==='contracts'?'btn-amber':'btn-ghost'}" onclick="setTeamView('contracts')">📝 Contracts</button>`:''}
    </div>
    ${isMine ? `<div class="row" style="gap:.35rem;margin-top:.35rem;flex-wrap:wrap">
      <button class="btn btn-sm btn-ghost" onclick="openTradeCenter()">⇄ Trades${pendingForMe().length?` (${pendingForMe().length})`:''}</button>
      ${isDynasty()?`<button class="btn btn-sm btn-ghost" onclick="openPickAssets()">◆ Picks</button>`:''}
      <button class="btn btn-sm btn-ghost" onclick="openLeagueRules()" title="League rules & FAQ">§ Rules</button>
      <button class="btn btn-sm btn-ghost" onclick="openActivityLog()" title="League activity">≡ Activity</button>
    </div>` : ''}

    <div class="card" style="padding:.5rem .75rem;margin-top:.5rem">
      <label class="sub" style="font-size:.65rem">View team</label>
      <select class="select" style="width:100%;margin-top:.25rem" onchange="setViewingTeam(this.value)">
        ${LG().teams.map(tm => `<option value="${tm.id}" ${String(tm.id)===String(viewingId)?'selected':''}>
          ${esc(tm.name)}${tm.owner?` (${esc(tm.owner)})`:''}${String(tm.id)===String(mine)?' — you':''}</option>`).join('')}
      </select>
    </div>

    ${isMine ? (() => {
      // per-player locks: report how many are still movable and when the next one locks
      const openPlayers = roster.filter(p => !playerLockedForWeek(p, week));
      const nextLock = openPlayers
        .map(p => ({ p, t: playerLockTime(p, week) }))
        .filter(x => x.t != null && x.t > Date.now())
        .sort((a,b) => a.t - b.t)[0];
      const allLocked = openPlayers.length === 0;
      return `<div class="card" style="padding:.5rem .75rem;margin-top:.5rem;border-color:${allLocked?'var(--bad)':'var(--line)'}">
        <div class="row-between">
          <span class="sub" style="font-size:.72rem">
            ${allLocked
              ? `<span class="cell-neg">🔒 Week ${week} — every player's game has started</span>`
              : `⏳ Week ${week} · <b class="amber">${openPlayers.length}</b> player${openPlayers.length!==1?'s':''} still movable`}
          </span>
          <span class="sub" style="font-size:.65rem">${nextLock ? `next locks in ${playerLockCountdown(nextLock.p, week)}` : ''}</span>
        </div>
        <p class="sub" style="font-size:.62rem;margin-top:.25rem;color:var(--sage-dim)">
          Each player locks at their own first game of the week — not all at once.</p>
      </div>`;
    })() : `<div class="card" style="padding:.5rem .75rem;margin-top:.5rem">
      <span class="sub" style="font-size:.72rem">👁 Read-only — you can view but not edit another team's lineup.</span>
    </div>`}

    ${teamViewMode === 'contracts' ? '' : `
    <div class="card mt" style="border-color:var(--amber)">
      <div class="row-between" style="margin-bottom:.5rem">
        <button class="btn btn-sm btn-ghost" onclick="changeWeek(-1)" ${week<=1?'disabled':''}>← ${week<=1?'Wk 1':'Wk '+(week-1)}</button>
        <span class="display amber">WEEK ${week}</span>
        <button class="btn btn-sm btn-ghost" onclick="changeWeek(1)" ${week>=26?'disabled':''}>Wk ${week+1} →</button>
      </div>
      ${week!==currentWeekNow()?`<button class="btn btn-sm btn-amber btn-block" style="margin-bottom:.5rem" onclick="goToCurrentWeek()">↩ Back to week ${currentWeekNow()}</button>`:''}
      <div class="row-between">
        <div>
          <div class="sub" style="font-size:.65rem">${dayLabel(start)}–${dayLabel(end)}</div>
          <div class="display" style="font-size:.9rem;color:var(--sage)">${LSET().scoringFormat==='regular'?'All starters\u2019 games':'Starters\u2019 best games'}</div>
        </div>
        <div style="text-align:right">
          <div class="num amber display" style="font-size:2rem">${teamTotal.toFixed(1)}</div>
          <div class="sub" style="font-size:.6rem">WEEK TOTAL</div>
        </div>
      </div>
    </div>`}

    ${teamViewMode === 'contracts'
      ? renderTeamContracts(viewingId, isMine)
      : teamViewMode === 'stats'
      ? renderTeamStats(roster, slotOf)
      : `${!haveLogs ? `<div class="card card-tight"><p class="sub" style="font-size:.74rem;text-align:center">
          <span class="spinner-inline"></span> Loading ${esc(SP().label)} game data…</p></div>`
          : (teamTotal===0 ? `<div class="card"><p class="sub" style="font-size:.78rem">
            No games found for your starters in week ${week} (${dayLabel(start)}–${dayLabel(end)}).
            ${currentWeekNow()!==week
              ? `Today is week ${currentWeekNow()} — <span class="plink" onclick="goToCurrentWeek()">jump back to it</span>.`
              : 'Use the week arrows above to find a week with games.'}</p></div>` : '')}

        <div class="row-between" style="align-items:center">
          <div class="divlabel" style="margin:0">Starters · ${filledCount}/${(activeLineupSlots()||[]).length}</div>
          <div class="row" style="gap:.35rem;flex:none">
            ${isMine ? `<button class="btn btn-sm btn-amber" onclick="optimizeLineup(${week})"
              title="Fill empty slots and bench anyone who cannot score this week">⚡ Fill</button>` : ''}
            <button class="btn btn-sm btn-ghost" onclick="toggleRosterDense()">${rosterDense()?'▦ Cards':'≡ Compact'}</button>
          </div>
        </div>
        ${isMine ? (() => {
          // WHAT IS ACTUALLY WRONG WITH THIS LINEUP. An empty slot was already
          // flagged; a starter who is on the IL or has no game left scores exactly
          // as much as an empty one and said nothing at all.
          const empties = (activeLineupSlots()||[]).length - filledCount;
          const dead = starters.map(pid => roster.find(r => String(r.espnId)===String(pid)))
            .filter(Boolean)
            .filter(p => isOnIR(p.espnId, viewingId) || playerWeekGameCount(p, week).left === 0)
            .filter(p => !p.heldOver);
          if (!empties && !dead.length) return '';
          const bits = [];
          if (empties) bits.push(`${empties} empty starting slot${empties!==1?'s':''}`);
          if (dead.length) bits.push(`${dead.length} starter${dead.length!==1?'s':''} with no game left (${dead.slice(0,2).map(p=>esc(p.name)).join(', ')}${dead.length>2?'…':''})`);
          return `<div class="card card-tight mb" style="border-color:var(--bad)">
            <p class="sub" style="font-size:.72rem;color:var(--bad)">⚠ ${bits.join(' · ')} — each of those scores 0 this week.</p>
            <button class="btn btn-sm btn-amber mt" onclick="optimizeLineup(${week})">⚡ Fix it</button>
          </div>`;
        })() : ''}
        ${starterCards}

        ${benchCards ? `<div class="divlabel mt">Bench</div>${benchCards}` : ''}
        ${irCards ? `<div class="divlabel mt">Injured list</div>${irCards}` : ''}

        <p class="sub mt" style="font-size:.7rem;text-align:center">
          ${rosterDense()
            ? `Compact view — one line a player. Switch to <b>Cards</b> for the day-by-day grid.`
            : `Tap a player's <b>position badge</b> to move or bench them; tap <b>+ Fill</b> on an empty slot.
               Tap any daily score for a breakdown. Amber = kept (best) game.`}
          Each player locks when their own first game of the week starts.</p>`}
  `;
}

/* CONTRACTS view: a multi-year TABLE. Rows = players; columns = next N seasons.
   Each player has an inline text box to set their fantasy contract length. A signed
   player's escalated salary fills each contract year. Arb players show the flat arb
   rate across all years (placeholder — they never lock and can't be given a term). */
function renderTeamContracts(teamId, isMine) {
  const roster = teamRoster(teamId);
  if (!roster.length) return '<div class="card"><p class="sub">No players on this roster yet.</p></div>';
  const locked = rostersLocked() || !signingOpen();
  const startYr = currentSeasonYear();
  const YEARS = 7;
  const years = Array.from({length:YEARS}, (_,i) => startYr + i);
  const capGrowth = (SALCFG().capGrowthPct||0)/100;

  // ORDER BY STARTER POSITION: walk the lineup slots in order, placing each assigned
  // player first (in slot order), then any remaining roster players (bench) after.
  const week = activeWeek();
  const lu = getLineup(teamId, week);
  const slotOrder = activeLineupSlots();
  const assignments = lu.assignments || {};
  const ordered = [];
  const seen = new Set();
  // assigned starters, in slot order
  slotOrder.forEach((slot, idx) => {
    const pid = assignments[idx];        // assignments are keyed by slot INDEX
    if (pid && !seen.has(String(pid))) {
      const p = roster.find(x => String(x.espnId)===String(pid));
      if (p) { ordered.push(p); seen.add(String(pid)); }
    }
  });
  // any other assignment keys not in slotOrder (safety)
  Object.values(assignments).forEach(pid => {
    if (pid && !seen.has(String(pid))) {
      const p = roster.find(x => String(x.espnId)===String(pid));
      if (p) { ordered.push(p); seen.add(String(pid)); }
    }
  });
  // bench: remaining roster players
  roster.forEach(p => { if (!seen.has(String(p.espnId))) { ordered.push(p); seen.add(String(p.espnId)); } });
  const ranked = ordered;

  const colTotal = years.map(()=>0);
  const bodyRows = ranked.map(p => {
    const c = playerContract(p);
    const arb = isArbPlayer(p);
    const aav = importedAAV(p);
    const rec = salaryDB()[normName(p.name)];
    const age = rec?.age;
    const cells = years.map((yr,idx) => {
      let val = 0, txt = '';
      if (c) {
        val = contractSalaryForYear(c, yr);
        txt = val>0 ? fmtMoney(val) : '';
      } else if (arb) {
        val = SALCFG().arbSalary; txt = fmtMoney(val);
      } else if (idx === 0) {
        val = playerCapHit(p, yr); txt = fmtMoney(val);
      }
      const relief = irRelief(teamId, p, yr);
      if (relief !== 1 && val > 0) { val = Math.round(val * relief); txt = fmtMoney(val); }
      colTotal[idx] += val;
      const color = idx===0 ? 'var(--chalk)' : (arb ? 'var(--sage-dim)' : 'var(--sage)');
      return `<td class="r num" style="font-size:.62rem;color:${val>0?color:'transparent'}">${txt||'·'}</td>`;
    }).join('');

    let termBox;
    if (arb) {
      termBox = `<span class="sub" style="font-size:.56rem">arb</span>`;
    } else if (isMine && !locked) {
      const cur = c ? c.termYears : '';
      termBox = `<input class="input" type="number" min="0" max="${SALCFG().maxTerm}" value="${cur}" placeholder="yr"
        style="width:38px;text-align:center;font-size:.6rem;padding:.15rem"
        onchange="setContractTerm('${p.espnId}',this.value)" title="Contract length in years">`;
    } else {
      termBox = c ? `<span class="sub" style="font-size:.56rem">${c.termYears}yr</span>` : '';
    }

    return `<tr>
      <td style="font-size:.66rem;white-space:nowrap">
        <span class="plink" onclick="showPlayer('${p.espnId}')">${esc(p.name.length>11?p.name.slice(0,10)+'…':p.name)}</span>
        ${c?'<span class="ps-tag" style="display:inline;background:var(--good)">S</span>':''}
        ${isOnIR(p.espnId, teamId)&&irDiscountRate()<1?`<span class="ps-tag" style="display:inline;background:var(--amber)" title="On the IL — counts ${Math.round(irDiscountRate()*100)}% this season">IL</span>`:''}
      </td>
      <td class="r sub" style="font-size:.58rem">${age||'·'}</td>
      <td class="r num" style="font-size:.58rem;color:var(--sage)">${aav!=null?fmtMoney(aav):'·'}</td>
      <td style="text-align:center">${termBox}</td>
      ${cells}
    </tr>`;
  }).join('');

  const dead = (LG().deadCap||{})[teamId] || [];
  const deadByYear = years.map(yr => dead.filter(d=>d.year===yr).reduce((s,d)=>s+d.amount,0));
  deadByYear.forEach((v,i)=>colTotal[i]+=v);
  years.forEach((yr,idx) => {
    (LG().moneyTrades||[]).forEach(mt => {
      const yrs=mt.years||1, start=mt.startYear||startYr;
      if (yr>=start && yr<start+yrs){ const k=yr-start; const per=mt.perYearList?(mt.perYearList[k]||0):(mt.perYear!=null?mt.perYear:Math.round(mt.amount/yrs));
        if(String(mt.to)===String(teamId))colTotal[idx]-=per; if(String(mt.from)===String(teamId))colTotal[idx]+=per; }
    });
  });

  const yearHead = years.map((yr,i) => `<th class="r" style="font-size:.6rem;${i===0?'color:var(--amber)':''}">${yr}</th>`).join('');
  const totalRow = colTotal.map((v,i) => `<td class="r num" style="font-size:.6rem;font-weight:700;${i===0?'color:var(--amber)':''}">${fmtMoney(v)}</td>`).join('');
  const deadRow = deadByYear.some(v=>v>0) ? `<tr><td class="sub" style="font-size:.58rem" colspan="4">dead cap</td>${deadByYear.map(v=>`<td class="r num" style="font-size:.58rem;color:var(--bad)">${v>0?fmtMoney(v):'·'}</td>`).join('')}</tr>` : '';
  const capRow = years.map((yr,i) => {
    const cap = capForYear(yr);
    const space = cap - colTotal[i];
    return `<td class="r num" style="font-size:.6rem;${space<0?'color:var(--bad)':'color:var(--good)'}">${fmtMoney(space)}</td>`;
  }).join('');

  return `
    <div class="divlabel">Contract table · ${esc(teamById(teamId).name)}</div>
    <p class="sub" style="font-size:.64rem;margin-bottom:.4rem">In starter-position order. Type a number in the <b>yr</b> box to sign a player (blank/0 = unsigned). Signed (S) fills every contract year; arb fills at the flat arb rate. <b>AAV</b> = base salary (see your discount). <b>Total</b>/<b>Space</b> = team salary and cap room per year (green = money to spend).</p>
    <div class="card card-tight" style="overflow-x:auto">
      <table class="tbl" style="min-width:600px">
        <thead><tr><th style="font-size:.6rem">Player</th><th class="r" style="font-size:.58rem">Age</th><th class="r" style="font-size:.58rem">AAV</th><th style="font-size:.58rem">Term</th>${yearHead}</tr></thead>
        <tbody>
          ${bodyRows}
          <tr style="border-top:2px solid var(--amber)"><td style="font-size:.6rem;font-weight:700" colspan="4">TOTAL</td>${totalRow}</tr>
          ${deadRow}
          <tr><td class="sub" style="font-size:.6rem" colspan="4">cap space</td>${capRow}</tr>
        </tbody>
      </table>
    </div>
    ${locked ? `<p class="sub mt" style="font-size:.7rem;color:var(--bad)">🔒 Contracts are locked (past the trade deadline / playoffs).</p>`
             : isMine ? `<p class="sub mt" style="font-size:.66rem;text-align:center">Year 1 = ${SALCFG().signingDiscount}× AAV, then +${(SALCFG().escalatorGrowth*100)}%/yr. Locks at trade deadline (week ${LSET().tradeDeadlineWeek||20}). Signed players can't be dropped without a 2× dead-cap hit.</p>`
             : `<p class="sub mt" style="font-size:.66rem;text-align:center">Viewing ${esc(teamById(teamId).name)}'s contracts.</p>`}`;
}
/* set/clear a player's fantasy contract term directly from the table text box */
window.setContractTerm = function(espnId, val) {
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  if (!p) return;
  if (!signingOpen()) { toast('Signing is closed (past trade deadline)', 'err'); renderActive(); return; }
  if (isArbPlayer(p)) { toast('Arb players can\u2019t be signed to a term', 'err'); renderActive(); return; }
  const term = Math.max(0, Math.min(SALCFG().maxTerm, parseInt(val)||0));
  LG().contracts = LG().contracts || {};
  const existing = playerContract(p);
  if (term === 0) {
    delete LG().contracts[String(espnId)];           // unsign
    logTxn('contract', `${teamName(myTeamId())} released ${p.name} from his contract`);
    toast(`${p.name} unsigned`, 'ok');
  } else {
    const aav = existing ? existing.baseAAV : importedAAV(p);   // freeze AAV at first signing
    if (aav == null) { toast(`No AAV on record — add ${SP().proLeague} contract info first`, 'err'); renderActive(); return; }
    LG().contracts[String(espnId)] = {
      baseAAV: aav,
      signedYear: existing ? existing.signedYear : currentSeasonYear(),
      termYears: term,
      teamId: existing ? existing.teamId : myTeamId(),
    };
    logTxn('contract', `${teamName(myTeamId())} signed ${p.name} for ${term}yr at ${fmtMoney(aav)} AAV`);
    toast(`${p.name} signed ${term}yr`, 'ok');
  }
  save();
  syncExtraIfRostered(espnId);
  renderActive();
};

/* 10-year salary lookahead for a team: each future season's committed cap hit. */
function renderSalaryLookahead(teamId) {
  const startYr = currentSeasonYear();
  const cap0 = leagueCap();
  const growth = (SALCFG().capGrowthPct || 0) / 100;
  const roster = teamRoster(teamId);
  let html = `<div class="divlabel mt">10-year salary lookahead</div>
    <div class="card card-tight" style="overflow-x:auto">
      <table class="tbl"><thead><tr><th>Year</th><th class="r">Committed</th><th class="r">Cap</th><th class="r">Space</th></tr></thead><tbody>`;
  for (let i=0; i<10; i++) {
    const yr = startYr + i;
    let committed = 0;
    roster.forEach(p => {
      const c = playerContract(p);
      let v = 0;
      if (c) v = contractSalaryForYear(c, yr);
      else if (isArbPlayer(p)) v = SALCFG().arbSalary;   // arb stays flat, no escalation
      // unsigned non-arb players: no future commitment (must sign to keep beyond now)
      committed += Math.round(v * irRelief(teamId, p, yr));
    });
    // dead cap + money trades for that year
    ((LG().deadCap||{})[teamId]||[]).forEach(d => { if (d.year===yr) committed += d.amount; });
    (LG().moneyTrades||[]).forEach(mt => {
      const yrs=mt.years||1, start=mt.startYear||startYr;
      if (yr>=start && yr<start+yrs){ const idx=yr-start; const per=mt.perYearList?(mt.perYearList[idx]||0):(mt.perYear!=null?mt.perYear:Math.round(mt.amount/yrs));
        if(String(mt.to)===String(teamId))committed-=per; if(String(mt.from)===String(teamId))committed+=per; }
    });
    const cap = capForYear(yr);
    const space = cap - committed;
    html += `<tr><td class="pos">${yr}</td>
      <td class="r num">${fmtMoney(committed)}</td>
      <td class="r num sub">${fmtMoney(cap)}</td>
      <td class="r num ${space<0?'cell-neg':''}" style="${space>=0?'color:var(--good)':''}">${fmtMoney(space)}</td></tr>`;
  }
  html += `</tbody></table></div>
    <p class="sub" style="font-size:.64rem;text-align:center;margin-top:.3rem">Signed contracts escalate; arb players stay flat; unsigned players show no future commitment. Cap grows ${SALCFG().capGrowthPct}%/yr.</p>`;
  return html;
}

/* roster (array of player objects) for a team */
function teamRoster(teamId) {
  return LG().draft.picks
    .filter(pk => String(pk.teamId) === String(teamId))
    .map(pk => { const p = LG().playerPool.find(x => String(x.espnId)===String(pk.playerId));
      return p ? {...p, pick: pk.pick} : null; })
    .filter(Boolean);
}

/* ---- MID-WEEK DROP HOLDOVERS ----
   Dropping a player whose game has already started doesn't erase what they did for
   you: they finish out the locked week in the slot they started in, and the roster
   spot frees up for the following (unlocked) weeks. holdovers[teamId][week] lists the
   players who were dropped mid-week but still count for THAT week only. */
function holdoversFor(teamId, week) {
  return ((LG().holdovers || {})[teamId] || {})[week] || [];
}
function addHoldover(teamId, week, espnId) {
  LG().holdovers = LG().holdovers || {};
  LG().holdovers[teamId] = LG().holdovers[teamId] || {};
  const list = LG().holdovers[teamId][week] = LG().holdovers[teamId][week] || [];
  if (!list.some(x => String(x) === String(espnId))) list.push(String(espnId));
}
/* The roster AS IT COUNTED for a given week: today's roster plus anyone dropped
   mid-week who was locked in. Scoring and the roster view use this; roster-size
   limits deliberately do NOT (a held-over player's spot is already free). */
function rosterForWeek(teamId, week) {
  const roster = teamRoster(teamId);
  const have = new Set(roster.map(p => String(p.espnId)));
  holdoversFor(teamId, week).forEach(pid => {
    if (have.has(String(pid))) return;
    const p = LG().playerPool.find(x => String(x.espnId) === String(pid));
    if (p) roster.push({ ...p, heldOver: true });
  });
  return roster;
}

/* Max roster size = starting slots + bench. IL players don't count. */
function rosterCap() {
  return (activeLineupSlots()||[]).length + rosterBenchCount();
}
/* count of a team's roster excluding IL-stashed players */
function rosterActiveCount(teamId) {
  const ir = LG().irStash?.[teamId] || [];
  return teamRoster(teamId).filter(p => !ir.includes(String(p.espnId))).length;
}
function isOnIR(espnId, teamId) {
  return ((LG().irStash||{})[teamId] || []).includes(String(espnId));
}
function irCount(teamId) { return ((LG().irStash||{})[teamId] || []).length; }

/* ---- INJURED LIST ----
   IL players don't count against the roster cap and can't be started.
   Only injury-flagged players may be stashed (no stashing healthy depth);
   the commissioner can override for unflagged edge cases. */
window.moveToIR = function(espnId) {
  if (!FEAT().ir) { toast(`${SP().label} leagues don't use an IL`, 'err'); return; }
  const tid = myTeamId(); if (!tid) return;
  const p = teamRoster(tid).find(x => String(x.espnId)===String(espnId));
  if (!p) { toast('Not on your roster', 'err'); return; }
  const max = SP().irCount || 0;
  if (irCount(tid) >= max) { toast(`IL is full (${max} slots)`, 'err'); return; }
  if (!p.injured && !(window._masterUnlocked || commishUnlocked())) {
    toast(`${p.name} isn't flagged injured — only the commissioner can IL a healthy player`, 'err'); return;
  }
  LG().irStash = LG().irStash || {};
  LG().irStash[tid] = LG().irStash[tid] || [];
  LG().irStash[tid].push(String(espnId));
  // pull them out of current + future lineups, but never vacate a slot they are
  // already locked into this week (IL must not become a mid-week slot reset)
  clearFromLineups(tid, espnId, { respectLocks: true });
  logTxn('drop', `${teamName(tid)} placed ${p.name} on the IL`);
  save(); closeModal(); toast(`${p.name} → IL`, 'ok'); renderActive();
};
window.activateFromIR = function(espnId) {
  const tid = myTeamId(); if (!tid) return;
  if (!isOnIR(espnId, tid)) return;
  if (rosterActiveCount(tid) >= rosterCap()) {
    toast('No roster room — drop someone before activating', 'err'); return;
  }
  LG().irStash[tid] = LG().irStash[tid].filter(x => String(x)!==String(espnId));
  const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  logTxn('add', `${teamName(tid)} activated ${p?.name||'a player'} from the IL`);
  save(); closeModal(); toast(`${p?.name||'Player'} activated`, 'ok'); renderActive();
};

/* AN IL SPOT IS FOR INJURED PLAYERS.
   ESPN clears a player's injury tag when he comes back, but nothing moved him off
   our IL — so a healthy player kept sitting in an IL slot, out of the roster count
   and at a discounted cap hit. That is a free extra roster spot and, in a salary
   league, free cap room.

   Rather than yanking him out from under the manager mid-week (which would silently
   break a lineup), the roster is simply not legal until they deal with it: no adds,
   no trades, until every player on the IL is actually flagged injured. Lineup
   changes and drops stay open, so there is always a way to get legal. */
function ilOffenders(teamId) {
  if (!FEAT().ir) return [];
  return ((LG().irStash || {})[teamId] || [])
    .map(id => (LG().playerPool || []).find(p => String(p.espnId) === String(id)))
    .filter(p => p && !p.injured);
}
function ilBlockReason(teamId) {
  const bad = ilOffenders(teamId);
  if (!bad.length) return null;
  const names = bad.map(p => p.name).join(', ');
  return `${names} ${bad.length === 1 ? 'is' : 'are'} healthy but still on your IL — activate ${bad.length === 1 ? 'him' : 'them'} first`;
}
/* ACQUISITION LIMITS.
   Real leagues cap how often you can churn the waiver wire, otherwise the manager
   with the most free time simply streams the most games. Counted from the
   transaction log we already keep, so nothing new has to be tracked and an
   undone/reversed move is not counted twice.
   Both limits default to 0 = unlimited, which is what every existing league gets. */
function addsUsed(teamId, scope) {
  const name = teamName(teamId);
  // "this season" starts when the league last advanced a year — without the floor,
  // a season limit counted every add the team had EVER made, so after the first
  // rollover teams would eventually be locked out of adds forever
  const seasonFloor = LG().seasonStartedAt || 0;
  const since = scope === 'week' ? Math.max(weekStartMs(currentWeekNow()), seasonFloor) : seasonFloor;
  return (LG().transactions || []).filter(t =>
    (t.type === 'add' || t.type === 'waiver') && t.ts >= since && t.text.startsWith(name + ' ')).length;
}
function weekStartMs(wk) {
  const days = weekDays(wk);
  return days && days.length ? new Date(ymd(days[0]) + 'T00:00:00').getTime() : 0;
}
/* null = allowed; a string = the reason it isn't */
function addBlockedReason(teamId) {
  const wkMax = Number(LSET().maxAddsPerWeek) || 0;
  const snMax = Number(LSET().maxAddsPerSeason) || 0;
  if (wkMax > 0) {
    const used = addsUsed(teamId, 'week');
    if (used >= wkMax) return `You've used all ${wkMax} adds for week ${currentWeekNow()}`;
  }
  if (snMax > 0) {
    const used = addsUsed(teamId, 'season');
    if (used >= snMax) return `You've used all ${snMax} adds for the season`;
  }
  return null;
}
/* THE drop. Every drop in the app goes through here. There used to be a second one
   behind the Add/Drop screen that skipped waivers and never wrote to the activity
   log, so which button you happened to use changed what actually happened. One
   path now: dead cap, holdover, waivers, log. */
window.confirmDrop = function(espnId) {
  const tid = myTeamId();
  const wp = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
  const dead = (LSET().useSalaryCap && playerContract(wp)) ? dropDeadCap(wp) : 0;  // BEFORE the contract is voided
  const held = doDropPlayer(espnId, tid);   // holdover-aware: locked starters finish the week
  // dropped players sit on waivers before becoming instant-add free agents
  LG().waivers = LG().waivers || {};
  LG().waivers[espnId] = { until: Date.now() + (LSET().waiverDays||1)*86400000, claims: [] };
  logTxn('drop', `${teamName(tid)} dropped ${wp?.name||'a player'}${held?` (stays in week ${currentWeekNow()} — already played)`:''}${dead?` — ${fmtMoney(dead)} dead cap`:''}`);
  save();
  toast(held ? `Dropped — ${wp?.name||'they'} still count for week ${currentWeekNow()}`
       : dead ? `Dropped — ${fmtMoney(dead)} dead cap applied`
       : 'Player dropped — on waivers', 'ok');
  closeModal();
  renderActive();
};

/* starters for team+week — manual lineup, or default to first N if unset */
/* The lineup for team+week: {assignments: {slotIdx: playerId}}.
   Carries forward from the most recent prior week if unset. */
function getLineup(teamId, week) {
  const lu = LG().lineups?.[teamId]?.[week];
  // a lineup the owner has touched is authoritative even if they emptied every slot —
  // otherwise clearing a slot would be silently undone by the default/carry-forward
  if (lu?.userSet && lu.assignments) return lu;
  if (lu?.assignments && Object.keys(lu.assignments).length) return lu;
  // carry forward most recent prior week's lineup — but only players who still count
  // for THIS week. A player dropped mid-week is held over for the week they were
  // locked into; they must not ride the carry-forward into later weeks as well.
  for (let w = week-1; w >= 1; w--) {
    const prev = LG().lineups?.[teamId]?.[w];
    if (prev?.assignments && Object.keys(prev.assignments).length) {
      const eligible = new Set(rosterForWeek(teamId, week).map(p => String(p.espnId)));
      const carried = {};
      Object.keys(prev.assignments).forEach(idx => {
        const pid = prev.assignments[idx];
        carried[idx] = (pid && eligible.has(String(pid))) ? pid : null;
      });
      return { assignments: carried, carried: true };
    }
  }
  // never set → build a sensible default lineup so scoring still works
  return { assignments: defaultLineup(teamId), isDefault: true };
}

/* Auto-build a valid default lineup: greedily fill each slot with the
   best-ADP eligible un-used player. Ensures unset/locked weeks still score. */
function defaultLineup(teamId) {
  const slots = activeLineupSlots() || [];
  const ir = (LG().irStash||{})[teamId] || [];
  const roster = teamRoster(teamId).filter(p => !ir.includes(String(p.espnId)))
    .slice().sort((a,b)=>a.adp-b.adp); // best first, IL players excluded
  const used = new Set();
  const assign = {};
  slots.forEach((s, idx) => {
    const pick = roster.find(r =>
      !used.has(String(r.espnId)) &&
      s.eligible.some(e => (r.eligible||[]).includes(e)));
    if (pick) { assign[idx] = pick.espnId; used.add(String(pick.espnId)); }
  });
  return assign;
}
/* starters = the set of player IDs assigned to any slot */
function getStarters(teamId, week) {
  const lu = getLineup(teamId, week);
  const ir = (LG().irStash||{})[teamId] || [];
  const slots = activeLineupSlots() || [];
  // IL players never score, even via carried-forward lineups (current week on)
  const filterIR = week >= currentWeekNow();
  const out = [];
  Object.keys(lu.assignments || {}).forEach(idx => {
    const pid = lu.assignments[idx];
    if (!pid) return;                                   // null = deliberately empty slot
    if (!slots[idx]) return;                            // stale index after a roster resize
    const s = String(pid);
    if (filterIR && ir.includes(s)) {
      // an IL'd player still holding a slot they were locked into keeps scoring for
      // that week — their games already happened and the slot can't be reused
      const pl = LG().playerPool.find(x => String(x.espnId)===s);
      if (!pl || !playerLockedForWeek(pl, week)) return;
    }
    if (!out.includes(s)) out.push(s);                  // never count one player twice
  });
  return out;
}

window.createMyTeam = function() {
  const n = (LG().teams?.length || 0) + 1;

  // _new marks a slot that exists only because someone is joining right now. It
  // keeps the claim screen from offering "Team 7" as a name you can just accept —

window.confirmMyTeam = function(teamId) {
  const first = $('mb-first')?.value.trim();
  const last = $('mb-last')?.value.trim();
  const tname = ($('mb-team')?.value || '').trim();
  // A name is required, but "Team 3" is a name — nobody is forced to invent a
  // brand before they can join. The join list stays readable anyway, because the
  // owner's real name shows next to every claimed team.
  if (!tname) { toast('Give your team a name', 'err'); return; }
  if (!first || !last) { toast('Enter your first and last name', 'err'); return; }
  // double-check team still unclaimed (race)
  const claimedBy = Object.values(LG().members||{}).find(m => String(m.teamId)===String(teamId));
  if (claimedBy) { toast('That team was just claimed', 'err'); renderActive(); return; }
  const memberId = 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  LG().members = LG().members || {};
  LG().members[memberId] = { name: `${first} ${last}`, teamId, joined: Date.now() };
  // also set the team's owner name (so the generic "Team N" shows the owner)
  const team = LG().teams.find(t => String(t.id)===String(teamId));
  if (team) {
    team.name = tname; team.abbrev = tname.slice(0,3).toUpperCase();
    team.owner = `${first} ${last}`; team.claimed = true;
    delete team._new;                       // it is a real, named team now
  }
  STATE.memberId = memberId;            // this device is now this member (locked)
  saveLocal();                           // persist identity pointer
  save();                                // sync members + teams to league doc
  closeModal(); toast(`Locked in as ${first} ${last}`, 'ok');
  renderActive();
  autoPullStats(true);
};

/* ---- TAP-TO-MOVE LINEUP (from roster page) ----
   Tapping a player's slot badge opens this. Choose a new slot or bench.
   If the chosen slot is occupied, that player is bumped to bench. ---- */
window.pickPosition = function(espnId) {
  const week = activeWeek();
  const tidP = myTeamId();
  const p = teamRoster(tidP).find(x => String(x.espnId)===String(espnId));
  if (!p) return;
  // A player already on the IL isn't in the lineup at all, so the slot picker has
  // nothing to offer him — the only move is back off the IL.
  if (isOnIR(espnId, tidP)) {
    openModal(`<div class="h2">${esc(p.name)}</div>
      <p class="sub mt mb">On the injured list${irDiscountRate()<1?`, counting ${Math.round(irDiscountRate()*100)}% of his salary`:''}.
        ${p.injured ? 'Still flagged injured.' : '<b class="amber">No longer flagged injured</b> — activate him, or he blocks adds and trades.'}</p>
      <button class="btn btn-amber btn-block" onclick="activateFromIR('${espnId}')">🩹 Activate from IL</button>
      <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Cancel</button>`);
    return;
  }
  if (playerLockedForWeek(p, week)) {
    toast(`🔒 ${p.name} is locked — their first game this week has started`, 'err'); return;
  }
  ensureLineupExists(week);
  const lu = LG().lineups[myTeamId()][week];
  const assign = lu.assignments;
  const slots = activeLineupSlots() || [];
  const curSlot = Object.entries(assign).find(([i,pid]) => String(pid)===String(espnId))?.[0];

  // which slots is this player eligible for?
  const eligibleSlotIdxs = slots.map((s,i)=>({s,i}))
    .filter(({s}) => s.eligible.some(e => (p.eligible||[]).includes(e)));

  const slotBtns = eligibleSlotIdxs.map(({s,i}) => {
    const occupant = assign[i] ? teamRoster(myTeamId()).find(r=>String(r.espnId)===String(assign[i])) : null;
    const isCur = String(curSlot)===String(i);
    // a slot held by a locked player can't be taken — their game already started
    const occLocked = occupant && !isCur && playerLockedForWeek(occupant, week);
    return `<button class="btn ${isCur?'btn-amber':'btn-ghost'} btn-block mt" style="text-align:left"
      ${occLocked?'disabled':`onclick="moveToSlot('${espnId}',${i})"`}>
      <b>${esc(s.slot)}</b>${occupant&&!isCur?`<span class="sub"> · ${occLocked?`🔒 ${esc(occupant.name)} locked`:`bumps ${esc(occupant.name)}`}</span>`:''}${isCur?' <span class="sub">· current</span>':''}${!occupant&&!isCur?'<span class="sub"> · empty</span>':''}
    </button>`;
  }).join('');

  openModal(`
    <div class="h2">${esc(p.name)}</div>
    <div class="sub mb">${esc((p.eligible||[]).join('/'))} · locks in <b class="amber">${playerLockCountdown(p, week)}</b> · move to:</div>
    ${slotBtns}
    ${curSlot!=null ? `<button class="btn btn-ghost btn-block mt" onclick="moveToSlot('${espnId}','bench')">Bench (leaves ${esc(slots[curSlot]?.slot||'slot')} empty)</button>` : ''}
    ${(() => {
      // THE IL IS A ROSTER MOVE, so it belongs with the other roster moves. It used
      // to live only on the player's card, which is not where anyone looks when they
      // are setting a lineup. Only offered when this player is actually eligible.
      if (!FEAT().ir) return '';
      const max = SP().irCount || 0;
      if (!max) return '';
      const used = irCount(myTeamId());
      const canCommish = window._masterUnlocked || commishUnlocked();
      if (!p.injured && !canCommish) {
        return `<p class="sub mt" style="font-size:.66rem;text-align:center">Not flagged injured, so he can't go on the IL.</p>`;
      }
      if (used >= max) {
        return `<p class="sub mt" style="font-size:.66rem;text-align:center">IL is full (${used}/${max}).</p>`;
      }
      return `<button class="btn btn-ghost btn-block mt" onclick="moveToIR('${espnId}')">🩹 Move to IL (${used}/${max} used)${p.injured?'':' — not flagged injured'}</button>`;
    })()}
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Cancel</button>
  `);
};

/* Tap "+ Fill" on an empty slot → choose from eligible, unlocked bench players. */
window.fillSlot = function(slotIdx) {
  const week = activeWeek();
  const tid = myTeamId(); if (!tid) return;
  const slots = activeLineupSlots() || [];
  const s = slots[slotIdx]; if (!s) return;
  ensureLineupExists(week);
  const assign = LG().lineups[tid][week].assignments;
  const startersNow = new Set(Object.values(assign).filter(Boolean).map(String));
  const cands = teamRoster(tid).filter(p =>
    !startersNow.has(String(p.espnId)) &&
    !isOnIR(p.espnId, tid) &&
    s.eligible.some(e => (p.eligible||[]).includes(e)));
  const rows = cands.map(p => {
    const lk = playerLockedForWeek(p, week);
    return `<button class="btn ${lk?'btn-ghost':''} btn-block mt" style="text-align:left"
      ${lk?'disabled':`onclick="moveToSlot('${p.espnId}',${slotIdx})"`}>
      ${esc(p.name)} <span class="sub">· ${esc((p.eligible||[]).join('/'))}${lk?' · 🔒 locked':''}</span>
    </button>`;
  }).join('');
  openModal(`
    <div class="h2">Fill ${esc(s.slot)}</div>
    <div class="sub mb">Eligible players not already starting.</div>
    ${rows || '<p class="sub">No eligible bench player for this slot.</p>'}
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Cancel</button>`);
};

/* materialize the current (possibly default/carried) lineup into storage so edits stick */
function ensureLineupExists(week) {
  const tid = myTeamId();
  LG().lineups = LG().lineups || {};
  LG().lineups[tid] = LG().lineups[tid] || {};
  const slot = LG().lineups[tid][week];
  if (slot?.userSet) return;                 // already materialized by the owner
  if (!slot?.assignments || !Object.keys(slot.assignments).length) {
    const cur = getLineup(tid, week);  // default or carried
    LG().lineups[tid][week] = { assignments: {...cur.assignments} };
  }
}

/* ONE TAP TO SET THE WEEK.
   Filling a lineup was slot-by-slot, every week, forever. This fills every empty
   slot and replaces starters who cannot score — someone on the IL, or with no game
   left to play — with the best eligible body on the bench.

   What it will never do: touch a locked player (their game has started), touch a
   held-over player (dropped mid-week, frozen here by rule), or start someone who
   cannot score either. It ranks on the league's OWN currency via ptsFieldFor, so a
   best-of-week league ranks by best-of-week and a total-points league by totals.
   Nothing is destructive — every move is one tap back. */
window.optimizeLineup = function(week) {
  // your own team only — ensureLineupExists() is scoped to myTeamId(), and setting
  // somebody else's lineup is a commissioner power we do not currently grant
  const tid = myTeamId();
  week = week || activeWeek();
  if (!tid) { toast('Claim your team first', 'err'); return; }
  // NO WEEK-LEVEL GATE. isWeekLocked() goes true on the Sunday BEFORE a week
  // starts, so gating on it would hide this for the whole of the current week —
  // precisely when a lineup needs fixing. This app locks per player, at their own
  // first game, and the loop below honours that individually.
  const roster = teamRoster(tid);
  const slots = activeLineupSlots();
  ensureLineupExists(week);
  const assign = LG().lineups[tid][week].assignments;
  const win = activeStatWindow();
  const score = (p) => (p[ptsFieldFor(win, p)] ?? -Infinity);
  const canScore = (p) => !isOnIR(p.espnId, tid) && playerWeekGameCount(p, week).left > 0;
  const frozen = (p) => p.heldOver || playerLockedForWeek(p, week);

  const moves = [];
  // a player is "committed" if they hold a slot we are not allowed to disturb
  const held = new Set();
  slots.forEach((s, idx) => {
    const cur = roster.find(r => String(r.espnId) === String(assign[idx]));
    if (cur && frozen(cur)) held.add(String(cur.espnId));
  });
  slots.forEach((s, idx) => {
    const cur = roster.find(r => String(r.espnId) === String(assign[idx]));
    if (cur && frozen(cur)) return;                       // locked in, leave alone
    if (cur && canScore(cur)) { held.add(String(cur.espnId)); return; }  // fine as is
    // this slot is empty, or its occupant cannot score — find the best replacement
    const best = roster
      .filter(p => !held.has(String(p.espnId)))
      .filter(p => String(p.espnId) !== String(cur?.espnId))
      .filter(p => !frozen(p) && canScore(p) && slotEligible(s.slot, p))
      .sort((a, b) => score(b) - score(a))[0];
    if (!best) return;                                     // nobody better; leave it
    for (const k of Object.keys(assign)) {                 // vacate their old slot
      if (String(assign[k]) === String(best.espnId)) assign[k] = null;
    }
    assign[idx] = best.espnId;
    held.add(String(best.espnId));
    moves.push(cur ? `${best.name} in for ${cur.name}` : `${best.name} → ${s.label || s.slot}`);
  });
  if (!moves.length) { toast('Lineup is already set — nothing to change', 'ok'); return; }
  LG().lineups[tid][week].userSet = true;
  save();
  toast(`${moves.length} change${moves.length!==1?'s':''}: ${moves.slice(0,2).join(', ')}${moves.length>2?'…':''}`, 'ok');
  renderActive();
};
window.moveToSlot = function(espnId, slotIdx) {
  const week = activeWeek();
  const tid = myTeamId();
  const roster = teamRoster(tid);
  const pl = roster.find(r => String(r.espnId)===String(espnId));
  if (!pl) { toast('Not on your roster', 'err'); return; }
  // PER-PLAYER LOCK: you can move a player until their own first game of the week
  if (playerLockedForWeek(pl, week)) {
    toast(`🔒 ${pl.name} is locked — their first game this week has started`, 'err'); return;
  }
  if (isOnIR(espnId, tid)) { toast('Player is on the IL — activate them first', 'err'); return; }
  // eligibility guard — the picker UI only offers valid slots, but enforce here too
  if (slotIdx !== 'bench') {
    const slotDef = (activeLineupSlots()||[])[slotIdx];
    if (!slotDef || !slotDef.eligible.some(e => (pl.eligible||[]).includes(e))) {
      toast('Not eligible for that slot', 'err'); return;
    }
  }
  ensureLineupExists(week);
  const assign = LG().lineups[tid][week].assignments;
  // a LOCKED occupant can't be bumped out of their slot — their game has begun
  if (slotIdx !== 'bench' && assign[slotIdx] && String(assign[slotIdx]) !== String(espnId)) {
    const occ = roster.find(r => String(r.espnId)===String(assign[slotIdx]));
    if (occ && playerLockedForWeek(occ, week)) {
      toast(`🔒 ${occ.name} is locked in that slot — their game has started`, 'err'); return;
    }
  }
  // Vacate the player's current slot by writing an explicit null, NOT by deleting the
  // key: league sync uses setDoc(merge:true), which never removes a field, so a deleted
  // key would be resurrected by the next snapshot (and could leave one player in two
  // slots). null is a real "this slot is empty" value that survives the merge.
  for (const k of Object.keys(assign)) {
    if (String(assign[k])===String(espnId)) assign[k] = null;
  }
  if (slotIdx !== 'bench') {
    assign[slotIdx] = espnId;                    // bumped occupant (if any) is replaced
  }
  // mark this lineup as explicitly set so an emptied lineup is never auto-refilled
  LG().lineups[tid][week].userSet = true;
  save();  // local save (lineups are device-level)
  closeModal();
  renderActive();
};

/* (pullAllStats() lived here — a manual, baseball-only, my-roster-only fetch.
   ensurePoolPoints() does it automatically for both sports and the whole pool.) */
function placeholderView(title, msg) {

/* Players view works in Phase 1 once pool is loaded — proves the data layer */
// avail starts at 'avail': the players page is overwhelmingly used to find someone
// to ADD, and a list led by players who are already on somebody's roster is mostly
// noise. 'all' is one tap away and the summary line always says which you're on.
const playerView = { sort: 'adp', dir: 1, posFilter: 'ALL', search: '', avail: 'avail', ptsWindow: 'season', grpFilter: 'all', minGames: 0, minWeeks: 0, salFilter: 'all' };
/* STAT WINDOWS ARE PER SPORT, NOT MLB-ONLY.
   applyPointFields() computes 7/14/30-day totals and a best-week average from any
   sport's gamelog — basketball's included. Basketball was simply pinned to FP/G
   with the window buttons hidden, so there was no way to ask who is hot right now.
   Its default is still FP/G, because that is how basketball managers think. */
const PTS_FIELDS = { season:'ptsSeason', '7':'pts7', '14':'pts14', '30':'pts30',
                     prev:'prevPts',
                     bestavg:'bestAvg', fpg:'ptsPerGame' };
/* In a best-of-week league every window shows the AVERAGE BEST GAME over that
   window instead of a running total — the same units the league actually scores in.
   A player's own mode is used, not the league's, because MLB leagues can score
   pitchers and hitters differently. */
const PTS_FIELDS_BEST = { season:'bestAvg', '7':'bestAvg7', '14':'bestAvg14',
                          '30':'bestAvg30', bestavg:'bestAvg', fpg:'ptsPerGame',
                          prev:'prevBestAvg' };
/* which of those fields are averages rather than totals — they get a decimal */
const AVG_PTS_FIELDS = new Set(['bestAvg', 'bestAvg7', 'bestAvg14', 'bestAvg30',
                                'ptsPerGame', 'prevBestAvg', 'prevPerGame']);
function ptsFieldFor(win, p) {
  const best = p ? playerScoreMode(p) === 'best' : (LSET().scoringFormat !== 'regular');
  return (best ? PTS_FIELDS_BEST[win] : null) || PTS_FIELDS[win];
}
/* does this league keep only the best game for anybody? */
function leagueUsesBestGame() { return (LSET().scoringFormat || 'bestGame') !== 'regular'; }
function statWindowOptions() {
  // 'bestavg' is a separate lens only in a total-points league. In a best-of-week
  // league it IS the season number, so offering both would be the same column twice.
  const base = leagueUsesBestGame()
    ? [['season','BEST'], ['30','30d'], ['14','14d'], ['7','7d']]
    : [['season','PTS'], ['bestavg','AVG'], ['30','30d'], ['14','14d'], ['7','7d']];
  // last season goes last: it is the one you reach for deliberately, and it is the
  // only column that costs a fetch to fill in
  if (FEAT().gameLogs) base.push(['prev', String(priorStatSeason())]);
  if (!FEAT().perGameScoring) return base;
  // FP/G leads in basketball — except in a best-of-week league, where only one game
  // a week is ever scored. There the week's best leads and FP/G sits beside it.
  return leagueUsesBestGame()
    ? [base[0], ['fpg','FP/G'], ...base.slice(1)]
    : [['fpg','FP/G'], ...base];
}
/* the selected window, snapped to one this sport actually offers — playerView is
   shared across sports, so switching sports must not leave a dangling selection */
function activeStatWindow() {
  const opts = statWindowOptions().map(o => o[0]);
  return opts.includes(playerView.ptsWindow) ? playerView.ptsWindow : opts[0];
}
let teamViewMode = 'lineup';  // 'lineup' (day grid) | 'stats' (all-stats table)

/* THE FILTERS FOLD AWAY.
   Six rows of chips — group, position, sort, salary, stat window, availability,
   minimums — filled the entire first screen of a phone, so you scrolled past
   ~1400px of controls before seeing a single player. They live behind one button
   now. When any are active the button carries a count and a plain-English summary
   sits under it, so a folded filter can never quietly hide players from you. */
const PLAYER_FILTER_DEFAULTS = { posFilter: 'ALL', avail: 'avail', grpFilter: 'all',
                                 minGames: 0, minWeeks: 0, salFilter: 'all' };
let _playerFiltersOpen = false;
function playerFiltersOpen() { return _playerFiltersOpen; }
/* Everything currently narrowing the list, INCLUDING the default availability.
   The summary is there so a folded filter can never quietly hide players from you,
   and that has to hold for the default too — otherwise someone searches for a
   rostered player, finds nothing, and has no idea why. */
function activeFilters() {
  const out = [];
  if (playerView.grpFilter !== 'all') out.push(playerView.grpFilter === 'batters' ? 'batters' : 'pitchers');
  if (playerView.posFilter !== 'ALL') out.push(playerView.posFilter);
  if (playerView.avail === 'avail') out.push('available only');
  if (playerView.avail === 'drafted') out.push('rostered only');
  if (playerView.salFilter && playerView.salFilter !== 'all') out.push(playerView.salFilter);
  if (playerView.minGames > 0) out.push(`${playerView.minGames}+ games`);
  if (playerView.minWeeks > 0) out.push(`${playerView.minWeeks}+ weeks`);
  return out;
}
/* How far you are from the defaults — drives the badge count and whether Reset is
   offered. Distinct from activeFilters() on purpose: sitting on the default
   "available only" is not something you need a Reset button for, but it IS
   something the summary must still tell you about. */
function nonDefaultFilterCount() {
  return Object.keys(PLAYER_FILTER_DEFAULTS)
    .filter(k => playerView[k] !== PLAYER_FILTER_DEFAULTS[k]).length;
}
function activeFilterCount() { return nonDefaultFilterCount(); }
function activeFilterSummary() { return activeFilters().join(' · '); }
window.togglePlayerFilters = function() { _playerFiltersOpen = !_playerFiltersOpen; renderActive(); };
window.resetPlayerFilters = function() { Object.assign(playerView, PLAYER_FILTER_DEFAULTS); renderActive(); };

function viewPlayersReal() {
  if (!LG().playerPool.length) {
    return `<div class="h1">Players</div>
      <div class="empty"><div class="big">◎</div>

  }
  const mappedCount = LG().playerPool.filter(p => p.mlbId).length;
  const draftedIds = new Set(LG().draft.picks.map(pk => String(pk.playerId)));
  const allPos = SP().posFilters;

  let list = LG().playerPool.filter(p => {
    if (playerView.search && !normName(p.name).includes(normName(playerView.search))) return false;
    // batter/pitcher group filter (baseball)
    if (playerView.grpFilter !== 'all') {
      const elig = (p.eligible||[]).join(' ');
      const isPitcher = /\bSP\b|\bRP\b/.test(elig) && !/\bC\b|1B|2B|3B|SS|\bOF\b|\bDH\b/.test(elig);
      if (playerView.grpFilter === 'pitchers' && !isPitcher) return false;
      if (playerView.grpFilter === 'batters' && isPitcher) return false;
    }
    if (playerView.posFilter !== 'ALL') {
      const elig = (p.eligible||[]).join(' ') + ' ' + (p.pos||'');
      if (!elig.includes(playerView.posFilter)) return false;
    }
    if (playerView.avail === 'avail' && draftedIds.has(String(p.espnId))) return false;
    if (playerView.avail === 'drafted' && !draftedIds.has(String(p.espnId))) return false;
    if (playerView.minGames > 0 && (p.gamesPlayed ?? 0) < playerView.minGames) return false;
    if (playerView.minWeeks > 0 && (p.weeksPlayed ?? 0) < playerView.minWeeks) return false;
    return true;

  // which points field is active based on the window toggle. Resolved PER PLAYER,
  // since a best-of-week league shows an average best game while a total-points
  // league shows a running total — and an MLB league can do both at once.
  const win = activeStatWindow();

  const useSal = LSET().useSalaryCap;
  const s = playerView.sort, dir = playerView.dir;

    if (s === 'salary') return dir * ((playerCapHit(a) ?? 0) - (playerCapHit(b) ?? 0));
    return dir * ((a[s] ?? 0) - (b[s] ?? 0));
  });
  // salary sub-filter (all / signed / arb / unsigned)
  if (useSal && playerView.salFilter && playerView.salFilter !== 'all') {
    const yr = currentSeasonYear();

      if (playerView.salFilter === 'signed') return !!playerContract(p);
      if (playerView.salFilter === 'arb') return isArbPlayer(p);
      if (playerView.salFilter === 'unsigned') return !playerContract(p) && importedAAV(p)!=null;
      if (playerView.salFilter === 'expiring') {
        // rostered + signed contract whose FINAL year is the current season = about to
        // hit free agency at the next rollover.
        const c = playerContract(p);
        if (!c) return false;
        const lastYear = c.signedYear + c.termYears - 1;
        return lastYear === yr;
      }
      return true;
    });
  }

  // NBA stats aren't wired yet, so points never compute for it — don't show a
  // perpetual "loading points" spinner for sports whose stats provider isn't live.
  const statsLive = !!FEAT().gameLogs;   // sport has a real per-game stats provider

  const shown = list.slice(0, 150);
  const rows = shown.map(p => {
    const drafted = draftedIds.has(String(p.espnId));

    const ownerTeam = pk ? teamById(pk.teamId).abbrev : '';
    const adpTxt = p.adp < 9999 ? p.adp.toFixed(0) : '—';
    const ptsVal = ptsOf(p);
    // An average needs a decimal — 6.6 and 6.4 are a real gap between two players
    // and both round to "6". A running total does not.
    const ptsTxt = (ptsVal != null) ? ptsVal.toFixed(AVG_PTS_FIELDS.has(ptsFieldFor(win, p)) ? 1 : 0) : '—';
    return `<tr style="${drafted?'opacity:.45':''}">
      <td style="max-width:0"><span class="row" style="gap:.4rem;align-items:center;flex-wrap:nowrap">
        ${headshotImg(p, 26)}
        <span style="min-width:0">
