<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The League</title>

<!-- Home-screen / browser icons. The mark: a home-plate-shaped basketball key,
     three-point line and pitcher's mound in one — baseball and basketball as
     one shape. See assets/icons/logo-source.png for the source art. -->
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The League">
<style>
/* ============================================================
   The League — Design System
   Subject: competitive fantasy baseball; hook = best single game/week
   Palette: stadium-at-night
   ============================================================ */
:root {
  --field:    #0d1510;  /* deep field green-black (bg) */
  --field-2:  #131e16;  /* raised surface */
  --field-3:  #1a2a1f;  /* card */
  --line:     #2a3d30;  /* chalk line / border */
  --chalk:    #f5f3ed;  /* primary text */
  --sage:     #7a8a7a;  /* secondary text */
  --sage-dim: #56635a;  /* tertiary */
  --clay:     #d4763a;  /* basepath clay accent */
  --amber:    #f0b429;  /* scoreboard amber = BEST GAME */
  --amber-bg: rgba(240,180,41,.12);
  --good:     #5fae6a;
  --bad:      #d9555a;

  --display: 'Oswald', 'Bebas Neue', system-ui, sans-serif; /* condensed scoreboard */
  --body:    'Inter', system-ui, -apple-system, sans-serif;
  --mono:    'JetBrains Mono', 'SF Mono', ui-monospace, monospace;

  --r: 10px;
  --r-sm: 6px;
}

@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--body);
  background: var(--field);
  color: var(--chalk);
  line-height: 1.5;
  font-size: 15px;
  overflow-x: hidden;
  padding-bottom: 80px;
}

/* numbers everywhere read as scoreboard */
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.display { font-family: var(--display); letter-spacing: .5px; }

/* ---- top bar ---- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,21,16,.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: .65rem 1rem;
  display: flex; align-items: center; justify-content: space-between;
}
.brand {
  font-family: var(--display); font-weight: 700; font-size: 1.4rem;
  letter-spacing: 1px; color: var(--chalk); cursor: pointer;
  display: flex; align-items: baseline; gap: .4rem;
  flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden;
}
/* On a phone the league you're in matters more than the app's own name, which is
   already on the tab and the home screen icon. Let the wordmark shrink so the
   league chip can show a real name instead of "The …". */
@media (max-width: 460px) { .brand { font-size: 1.05rem; letter-spacing: 0; } }
.brand .ver { font-size: .55rem; color: var(--sage-dim); letter-spacing: 1px; }
.brand .mark { color: var(--amber); }
.topbar-right { display: flex; align-items: center; gap: .75rem; min-width: 0; }
.week-pill {
  font-family: var(--mono); font-size: .72rem; color: var(--sage);
  border: 1px solid var(--line); border-radius: 999px;
  padding: .25rem .7rem;
  /* never let 'WK 19' break onto two lines when the header is tight */
  white-space: nowrap; flex: none;
}
.week-pill b { color: var(--amber); }
.league-chip {
  font-family: var(--body); font-size: .68rem; font-weight: 600; color: var(--chalk);
  background: var(--field-3); border: 1px solid var(--line); border-radius: 999px;
  /* shrinks first when the header is tight, so the wordmark never gets clipped */
  padding: .25rem .65rem; cursor: pointer; max-width: 46vw; min-width: 0; flex: 1 1 auto; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; transition: border-color .15s;
}
.league-chip:hover { border-color: var(--amber); }
.league-chip:empty { display: none; }
.icon-btn {
  background: none; border: none; color: var(--sage); cursor: pointer;
  font-size: 1.2rem; padding: .25rem; line-height: 1;
}

/* ---- bottom nav (mobile-first) ---- */
.botnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(13,21,16,.96);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-around;
  padding: .55rem .25rem calc(.55rem + env(safe-area-inset-bottom));
}
.botnav button {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: .25rem;
  color: var(--sage-dim); font-size: .72rem; font-weight: 600;
  padding: .5rem .65rem; border-radius: var(--r-sm);
  transition: color .15s, background .15s;
  font-family: var(--body); min-width: 60px;
}
.botnav button .ic { font-size: 1.5rem; line-height: 1; }
.botnav button.active { color: var(--amber); }
.botnav button.active .ic { transform: scale(1.05); }

/* daily scoring grid */
.daygrid { display: grid; gap: 2px; font-family: var(--mono); }
.daygrid .dcell {
  text-align: center; padding: .35rem .2rem; border-radius: 4px;
  background: var(--field-2); font-size: .8rem; cursor: pointer;
  border: 1px solid transparent;
}
.daygrid .dcell.best { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); font-weight: 700; }
.daygrid .dcell.dnf { color: var(--sage-dim); opacity: .5; }
.daygrid .dcell.upcoming { background: var(--field); border: 1px dashed var(--line);
  display: flex; flex-direction: column; justify-content: center; padding: .2rem 0; }
.daygrid .dcell.neg { color: var(--bad); }
.daygrid .dhead { text-align: center; font-size: .58rem; color: var(--sage-dim);
  text-transform: uppercase; padding: .2rem 0; }
.pcard { background: var(--field-3); border: 1px solid var(--line);
  border-radius: var(--r); padding: .75rem; margin-bottom: .6rem; }
.pcard.bench { opacity: .72; border-style: dashed; }
.pcard.empty-slot { border-style: dashed; opacity: .6; padding: .55rem .75rem; }
/* player headshots — object-fit keeps ESPN's transparent PNGs from stretching */
.headshot { border-radius: 50%; object-fit: cover; object-position: top center;
  background: var(--field); border: 1px solid var(--line); flex: none; vertical-align: middle; }
.headshot.ph { display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: .62rem; font-weight: 700; color: var(--sage-dim); }
.starter-badge { font-size: .55rem; font-family: var(--mono); letter-spacing: 1px;
  padding: .1rem .4rem; border-radius: 3px; text-transform: uppercase; }
.starter-badge.s { background: var(--amber); color: #1a1305; }
.starter-badge.b { background: var(--field); color: var(--sage); border: 1px solid var(--line); }
.il-badge { font-size: .55rem; font-family: var(--mono); letter-spacing: 1px;
  padding: .1rem .35rem; border-radius: 3px; background: var(--bad); color: #fff;
  font-weight: 700; margin-left: .3rem; }
.ps-tag { font-size: .5rem; font-family: var(--mono); color: var(--good);
  font-weight: 700; display: block; margin-top: 1px; }
.opp-tag { font-size: .5rem; color: var(--sage-dim); display: block; }

/* ---- draft room ---- */
.draft-timer { font-family: var(--mono); font-size: 2.6rem; font-weight: 800; color: var(--chalk); letter-spacing: 1px; }
.draft-timer.urgent { color: var(--bad); animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.on-clock-mine { border-color: var(--amber) !important; box-shadow: 0 0 0 1px var(--amber); }
.draft-order-strip { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .5rem; }
.draft-team { flex: 0 0 auto; min-width: 88px; background: var(--field-2); border: 1px solid var(--line);
  border-radius: 8px; padding: .4rem .5rem; text-align: center; position: relative; }
.draft-team.now { border-color: var(--amber); background: var(--amber-bg); }
.draft-team.next { border-color: var(--sage); }
.draft-team .dt-pos { font-family: var(--mono); font-size: .6rem; color: var(--sage-dim); display: block; }
.draft-team .dt-name { font-size: .72rem; font-weight: 600; color: var(--chalk); display: block;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
.draft-team .dt-tag { font-size: .52rem; font-family: var(--mono); color: var(--amber); text-transform: uppercase; letter-spacing: 1px; }
.draft-team .dt-tag.next { color: var(--sage); }
.draft-pick-row .btn { flex: 0 0 auto; }

/* ---- page container ---- */
.page { padding: 1rem; max-width: 980px; margin: 0 auto; display: none; }
.page.active { display: block; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px);} to {opacity:1; transform:none;} }

/* ---- section headers ---- */
.eyebrow {
  font-family: var(--mono); font-size: .65rem; letter-spacing: 2px;
  text-transform: uppercase; color: var(--clay); margin-bottom: .4rem;
}
.h1 { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1.05; }
.h2 { font-family: var(--display); font-size: 1.35rem; font-weight: 600; margin-bottom: .5rem; }
.sub { color: var(--sage); font-size: .85rem; }

/* ---- cards ---- */
.card {
  background: var(--field-3);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 1rem;
  margin-bottom: 1rem;
}
.card-tight { padding: .75rem; }

/* ---- buttons ---- */
.btn {
  font-family: var(--body); font-weight: 600; font-size: .9rem;
  background: var(--clay); color: #1a0f08; border: none;
  border-radius: var(--r-sm); padding: .6rem 1.1rem; cursor: pointer;
  transition: filter .15s, transform .05s;
}
.btn:active { transform: scale(.98); }
.btn:hover { filter: brightness(1.08); }
.btn-ghost {
  background: transparent; color: var(--chalk);
  border: 1px solid var(--line);
}
.btn-ghost:hover { border-color: var(--clay); color: var(--clay); }
.btn-amber { background: var(--amber); color: #1a1305; }
.btn-sm { padding: .4rem .75rem; font-size: .8rem; }
.btn-block { display: block; width: 100%; }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---- stat chips ---- */
.statrow { display: grid; grid-template-columns: repeat(3,1fr); gap: .6rem; }
.stat {
  background: var(--field-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: .7rem .5rem; text-align: center;
}
.stat .lbl { font-family: var(--mono); font-size: .58rem; letter-spacing: 1px;
  text-transform: uppercase; color: var(--sage-dim); }
.stat .val { font-family: var(--display); font-size: 1.6rem; color: var(--chalk); line-height: 1.1; }
.stat .val.amber { color: var(--amber); }
.stat .foot { font-size: .6rem; color: var(--sage-dim); }

/* ---- empty state ---- */
.empty {
  text-align: center; padding: 2.5rem 1rem; color: var(--sage);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; opacity: .5; }
.empty .msg { font-size: .9rem; margin-bottom: 1rem; }

/* ---- loading ---- */
.spinner {
  width: 28px; height: 28px; border: 3px solid var(--line);
  border-top-color: var(--clay); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 1rem auto;
}
@keyframes spin { to { transform: rotate(360deg);} }
.spinner-inline {
  display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
  border-top-color: var(--amber); border-radius: 50%; vertical-align: middle;
  animation: spin .7s linear infinite; margin-right: .4rem;
}

/* ---- log output ---- */
.log {
  background: var(--field); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: .6rem .8rem;
  font-family: var(--mono); font-size: .7rem; line-height: 1.6;
  max-height: 220px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
}
.log-step { display: flex; gap: .5rem; }
.log-ic { flex-shrink: 0; }

/* ---- toast ---- */
.toast-wrap { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  z-index: 200; display: flex; flex-direction: column; gap: .4rem; align-items: center; }
.toast {
  background: var(--field-3); border: 1px solid var(--line);
  border-left: 3px solid var(--clay);
  border-radius: var(--r-sm); padding: .6rem 1rem; font-size: .82rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: toastIn .25s ease;
  max-width: 90vw;
}
.toast.err { border-left-color: var(--bad); }
.toast.ok { border-left-color: var(--good); }
@keyframes toastIn { from { opacity:0; transform: translateY(8px);} to {opacity:1;transform:none;} }

/* ---- modal ---- */
.modal-bg {
  position: fixed; inset: 0; z-index: 300; display: none;
  background: rgba(5,8,6,.7); backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }

/* blocking gate — sits above everything, app can't be used until passed */
.gate {
  position: fixed; inset: 0; z-index: 500;
  background: var(--field); display: flex;
  align-items: center; justify-content: center; padding: 1.5rem;
}
.gate-inner {
  width: 100%; max-width: 440px;
}
.gate .brand-big {
  font-family: var(--display); font-weight: 800;
  text-align: center; color: var(--chalk); margin-bottom: .25rem;
  display: flex; flex-direction: column; align-items: center; line-height: 1;
}
/* two-line lockup: small wide-tracked THE sitting over the big LEAGUE. */
.gate .brand-big .bl-the  { font-size: 1.05rem; letter-spacing: .42em;
  text-indent: .42em; color: var(--sage); font-weight: 600; }
.gate .brand-big .bl-name { font-size: 3rem; letter-spacing: -1px; margin-top: .12rem; }
@media (max-width: 360px) { .gate .brand-big .bl-name { font-size: 2.5rem; } }
/* very narrow phones: tighten the header so the wordmark, league chip, week
   pill and settings gear all fit on one row without horizontal scroll */
@media (max-width: 360px) {
  .topbar { padding: .65rem .75rem; }
  .topbar-right { gap: .5rem; }
  /* scale the wordmark back a touch so the league chip keeps readable text
     rather than collapsing to just its sport icon */
  .brand { font-size: 1.12rem; }
  .league-chip { max-width: 116px; }
}
.gate .brand-big .mark { color: var(--amber); }
.gate .tagline { text-align: center; color: var(--sage-dim); font-size: .8rem; margin-bottom: 2rem; }
.gate .step-label { text-transform: uppercase; letter-spacing: 2px; font-size: .65rem;
  color: var(--amber); text-align: center; margin-bottom: 1rem; font-family: var(--mono); }
.gate .sport-pick { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.gate .sport-card {
  background: var(--field-2); border: 2px solid var(--line); border-radius: var(--r);
  padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all .15s;
}
.gate .sport-card:hover, .gate .sport-card:active { border-color: var(--amber); background: var(--field-3); }
.gate .sport-card .ic { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
.gate .sport-card .nm { font-family: var(--display); font-size: 1.1rem; font-weight: 700; color: var(--chalk); }
.modal {
  background: var(--field-2); border: 1px solid var(--line);
  border-radius: var(--r) var(--r) 0 0; width: 100%; max-width: 560px;
  max-height: 88vh; overflow-y: auto; padding: 1.25rem;
  animation: sheetUp .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes sheetUp { from { transform: translateY(100%);} to {transform:none;} }
@media (min-width: 600px) {
  .modal-bg { align-items: center; }
  .modal { border-radius: var(--r); }
}

/* ---- forms ---- */
.field { margin-bottom: .9rem; }
.field label { display: block; font-family: var(--mono); font-size: .62rem;
  letter-spacing: 1px; text-transform: uppercase; color: var(--sage); margin-bottom: .3rem; }
.input, .select {
  width: 100%; background: var(--field); color: var(--chalk);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: .55rem .7rem; font-family: var(--body); font-size: .9rem;
}
.input:focus, .select:focus { outline: none; border-color: var(--clay); }

/* ---- tables ---- */
.tbl { width: 100%; border-collapse: collapse; font-size: .82rem; }
.tbl th { font-family: var(--mono); font-size: .58rem; letter-spacing: 1px;
  text-transform: uppercase; color: var(--sage-dim); text-align: left;
  padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl td { padding: .45rem .5rem; border-bottom: 1px solid rgba(42,61,48,.4); }
.tbl tr:last-child td { border-bottom: none; }
.tbl .pos { font-family: var(--mono); font-size: .68rem; color: var(--sage); width: 38px; }
.cell-best { color: var(--amber); font-weight: 700; }
.cell-zero { color: var(--sage-dim); }
.cell-neg { color: var(--bad); }

/* player link */
.plink { color: inherit; cursor: pointer; border-bottom: 1px dashed var(--sage-dim); }
.plink:hover { color: var(--amber); border-color: var(--amber); }

/* divider label */
.divlabel { font-family: var(--mono); font-size: .6rem; letter-spacing: 1px;
  text-transform: uppercase; color: var(--sage-dim); text-align: center;
  margin: .75rem 0 .5rem; }

.hide { display: none !important; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.mt { margin-top: 1rem; } .mb { margin-bottom: 1rem; }
.amber { color: var(--amber); } .clay { color: var(--clay); } .sage { color: var(--sage); }
/* ============================================================
   USABILITY LAYER (v10.1) — bigger text, bigger touch targets,
   stronger contrast. Pure CSS: zero functionality changed.
   Appended last so it wins the cascade (and beats inline sizes
   via !important where tiny text was hard-coded).
   ============================================================ */
:root {
  --sage:     #a3b3a3;   /* secondary text — lightened for contrast */
  --sage-dim: #82927f;   /* tertiary — was too dim to read */
}
body { font-size: 17px; line-height: 1.5; }
/* minimum readable size for all secondary text (overrides inline .6-.72rem) */
.sub { font-size: .82rem !important; line-height: 1.45; }
.eyebrow { font-size: .8rem; }
.h1 { line-height: 1.15; }
.h2 { font-size: 1.15rem; }
/* touch targets: Apple HIG minimum 44pt, we go a bit past */
.btn { min-height: 48px; font-size: 1rem; padding: .65rem 1.2rem; }
.btn-sm { min-height: 40px; font-size: .88rem !important; padding: .45rem .8rem; }
.btn-block { margin-top: .55rem; }
/* 16px inputs stop iOS Safari's zoom-jump on focus — big elderly win */
input.input, select, textarea {
  font-size: 16px !important; min-height: 48px; padding: .6rem .7rem;
}
/* tables: roomier rows, readable numbers */
.tbl td, .tbl th { font-size: .84rem !important; padding: .55rem .45rem; }
/* bottom nav: bigger labels + icons, taller bar */
.botnav button { font-size: .8rem; min-width: 62px; padding: .3rem .2rem; }
.botnav button .ic { font-size: 1.65rem; }
.botnav { padding: .65rem .25rem calc(.65rem + env(safe-area-inset-bottom)); }
/* settings toggle rows: comfortable height, never cramped */
.row-between { min-height: 44px; align-items: center; gap: .6rem; }
/* ...but a row that is only a label and a number is not a tap target, and forcing
   44px on those turns a three-line info card into 150px of mostly empty space.
   Opt out explicitly so touch targets stay honest and read-only rows stay compact. */
.row-between.info { min-height: 0; }
/* cards breathe a little more */
.card { padding: 1rem .95rem; }
/* home-page task tiles: the big obvious buttons */
.tilegrid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-top: .8rem; }
.tile {
  background: var(--field-3); border: 1px solid var(--line); border-radius: var(--r);
  padding: 1.1rem .6rem; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: .45rem;
  min-height: 96px; justify-content: center;
  transition: filter .15s, transform .05s;
}
.tile:active { transform: scale(.98); filter: brightness(1.15); }
.tile .tic { font-size: 2rem; line-height: 1; }
.tile .tlb { font-weight: 700; font-size: 1rem; color: var(--chalk); }
.tile .tsb { font-size: .72rem; color: var(--sage); }
.tile.amber { border-color: var(--amber); background: var(--amber-bg); }
/* keyboard/switch-control users get a clear focus ring */
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<div class="topbar">
  <div class="brand" onclick="go('home')">
    <span>THE LEAGUE<span class="mark">.</span></span>
  </div>
  <div class="topbar-right">
    <button class="league-chip" id="league-chip" onclick="openLeagueSwitcher()" title="Change league or sport"></button>
    <button class="icon-btn" id="trade-bell" onclick="openTradeCenter()" title="Trade offers waiting on you" style="display:none"></button>
    <span class="week-pill">WK <b id="wk-label">—</b></span>
    <button class="icon-btn" onclick="go('settings')" title="Settings">⚙</button>
  </div>
</div>

<!-- ============ PAGES ============ -->
<div id="page-home" class="page active"></div>
<div id="page-draft" class="page"></div>

/* ============================================================
   FIREBASE
   ============================================================ */
/* ============================================================
   STORAGE ARCHITECTURE
   - MASTER settings (shared Firebase doc 'master/<sportleague>'):
     player pool, ID mapping, scoring, schedule. Commissioner-level,
     PIN-protected to edit. Everyone reads these.
   - LOCAL settings (this device, localStorage): teams, draft, my team,
     lineups, view state, and any local overrides.
   ============================================================ */
const MASTER_KEYS = ['playerPool', 'idMapping', 'customScoring', 'schedule', 'masterMeta'];
const MASTER_DOC = 'master';        // firestore: leagues/master
const LOCAL_LS_KEY = 'bgl_local_v1';

function masterPayload() {
  // master holds only GLOBAL data shared across all leagues: the player pool
  // and ID overrides. Scoring + schedule are per-league (in leaguePayload).
  const out = {};
  for (const sk of Object.keys(STATE.leagues)) {
    const lg = STATE.leagues[sk];
    // gather every rostered playerId (main draft + rookie draft) so we know which
    // locally-loaded "extra" players actually need to be synced.
    const rostered = new Set();
    (lg.draft?.picks || []).forEach(pk => rostered.add(String(pk.playerId)));
    (lg.rookieDraft?.picks || []).forEach(pk => rostered.add(String(pk.playerId)));
    // sync the top-300 pool PLUS any extra player who is on a roster. Unrostered
    // extras (just browsed) stay local-only so the doc stays under 1 MB.
    const pool = (lg.playerPool || []).filter(p => !p.extra || rostered.has(String(p.espnId)));
    out[sk] = { playerPool: pool };
  }
  out.idOverrides = STATE.idOverrides;
  out.poolMeta = STATE.poolMeta || {};     // synced, so ONE device's pull satisfies everyone
  out.approvals = STATE.approvals || {};   // commissioner approval list
  out.salaryDB = STATE.salaryDB || {};     // salary database, 1 per sport
  out.salaryConfig = STATE.salaryConfig || {};  // master salary rules
  out.attention = STATE.attention || {};        // game issues awaiting master resolution
  out.scoreOverrides = STATE.scoreOverrides || {};  // manual per-player-week points
  return out;
}

function applyMaster(master) {
  if (!master) return;
  if (master.approvals) STATE.approvals = master.approvals;
  if (master.salaryDB) STATE.salaryDB = master.salaryDB;
  if (master.salaryConfig) STATE.salaryConfig = { ...STATE.salaryConfig, ...master.salaryConfig };
  if (master.attention) STATE.attention = master.attention;
  if (master.scoreOverrides) STATE.scoreOverrides = master.scoreOverrides;
  if (master.poolMeta) STATE.poolMeta = master.poolMeta;
  // SELF-HEAL sport: now that approvals are loaded, make sure the active sport matches
  // the active league's approval (fixes a cross-wired sport from earlier).
  if (STATE.activeLeagueDoc && STATE.approvals) {
    const ap = Object.entries(STATE.approvals).find(([k,a]) => (a.leagueDocId||('league_'+k))===STATE.activeLeagueDoc);
    if (ap) {
      // one resolver for both routes — see sportForApproval()
      const apSport = sportForApproval(ap[0]);
      if (SPORTS[apSport] && STATE.sport !== apSport) {
        STATE.sport = apSport;
        saveLocal();
      }
    }
  }
  for (const sk of Object.keys(master)) {
    if (sk === 'idOverrides') { STATE.idOverrides = master.idOverrides || {}; continue; }
    if (sk === 'approvals') continue;
    if (!STATE.leagues[sk]) continue;
    const m = master[sk];
    if (m.playerPool) {
      // Preserve this device's LOCAL-ONLY extras (unrostered players loaded via
      // search) that aren't in the synced pool — merge them back in after applying.
      const incoming = m.playerPool;
      const incomingIds = new Set(incoming.map(p => String(p.espnId)));
      const localExtras = (STATE.leagues[sk].playerPool || [])
        .filter(p => p.extra && !incomingIds.has(String(p.espnId)));
      STATE.leagues[sk].playerPool = incoming.concat(localExtras);
      // self-heal: recompute eligibility from raw slots if it drifted from rules.
      autoCorrectEligibility(sk);
    }
  }
  // ENFORCE APPROVAL ("loaned" league IDs): pausing a league blocks everyone in it,
  // live, until it's re-approved. Runs last so state is fully applied first.
  enforceLeagueApproval();
}

/* If the master pauses a league, anyone inside it is blocked until it's re-approved —
   fires live via the master snapshot and again when switching leagues. The master
   (unlocked on this device) is exempt so the admin can't lock themselves out. */
function enforceLeagueApproval() {
  if (!STATE.activeLeagueDoc || window._masterUnlocked) return;
  const apE = Object.entries(STATE.approvals||{}).find(([k,a]) => (a.leagueDocId||('league_'+k))===STATE.activeLeagueDoc);
  const a = apE && apE[1];
  const inApp = $('gate') && $('gate').style.display === 'none';
  if (a && a.approved === false && (inApp || window._pausedFor === STATE.activeLeagueDoc)) {
    window._pausedFor = STATE.activeLeagueDoc;
    $('gate-inner').innerHTML = `
      <div class="brand-big"><span class="bl-the">THE</span><span class="bl-name">LEAGUE<span class="mark">.</span></span></div>
      <div class="step-label" style="color:var(--bad)">Access paused</div>
      <p class="sub" style="text-align:center;margin-bottom:1rem">
        <b>${esc(a.leagueName||'This league')}</b> is currently paused by the site admin.<br>
        You'll get back in automatically when it's re-approved.</p>
      <button class="btn btn-ghost btn-block" onclick="goToHub()">← Back to hub</button>`;
    $('gate').style.display = 'flex';
  } else if (a && a.approved !== false && window._pausedFor === STATE.activeLeagueDoc) {
    window._pausedFor = null;
    hideGate();
    renderActive();
    toast('Access restored — welcome back', 'ok');
  }
}

/* recompute eligibility for a sport's pool from stored raw slots if it drifted
   from what the current rules produce. Silent; no save (master is read-only here). */
function autoCorrectEligibility(sk) {
  const sp = SPORTS[sk];
  const pool = STATE.leagues[sk]?.playerPool || [];
  pool.forEach(p => {
    if (!p.eligSlots) return;                 // no raw slots → can't re-derive
    const fresh = deriveEligibility(p.eligSlots, p.defPosId, sk);   // explicit sport
    if ((p.eligible||[]).join('/') !== fresh.join('/')) p.eligible = fresh;
    // also fix the primary position if it was stored using the wrong sport's posMap
    if (sp && p.defPosId != null) {
      const correctPos = (sp.posMap||{})[p.defPosId];
      if (correctPos && p.pos !== correctPos) p.pos = correctPos;
    }
  });
}

/* Local storage now holds ONLY identity pointers — which league this device
   joined and which member it is. All actual league data lives in Firebase. */
/* WHAT THIS DEVICE KEEPS WHEN THERE IS NO FIREBASE.
   Two blobs under two keys, deliberately. Identity is tiny and must never be lost,
   so it is written first and on its own. The league snapshot is orders of magnitude
   bigger and is the thing that can blow the ~5MB localStorage quota — giving it its
   own key means a quota failure there can never take identity down with it.
   (LOCAL_LS_KEY itself is a storage identifier and must not be renamed.) */
const LOCAL_DATA_KEY = LOCAL_LS_KEY + '_data';
/* The derived caches are left out on purpose: they refetch themselves, and they are
   exactly what blows the quota — 300 players times a season of game logs runs to
   megabytes. `slim` additionally drops the player pool, as a last resort before
   giving up entirely. */
function localDataSnapshot(opts = {}) {
  const SKIP = new Set(['gameLogs', 'gameLogsPrev', 'scheduleCache']);
  const out = { v: 1, ts: Date.now(),
                leagues: {},
                poolMeta: STATE.poolMeta || {},
                salaryDB: STATE.salaryDB || {},
                salaryConfig: STATE.salaryConfig || {},
                idOverrides: STATE.idOverrides || {},
                scoreOverrides: STATE.scoreOverrides || {} };
  for (const sk of Object.keys(STATE.leagues || {})) {
    const lg = STATE.leagues[sk];
    if (!lg) continue;
    const copy = {};
    for (const k of Object.keys(lg)) {
      if (SKIP.has(k)) continue;
      if (opts.slim && k === 'playerPool') continue;
      copy[k] = lg[k];
    }
    out.leagues[sk] = copy;
  }
  return out;
}
function saveLocal() {
  // remember the active league + identity PER SPORT, so switching sports restores the
  // right league. leaguesBySport[sport] = { activeLeagueDoc, memberId, leagueName }.
  STATE.leaguesBySport = STATE.leaguesBySport || {};
  if (STATE.activeLeagueDoc) {
    STATE.leaguesBySport[STATE.sport] = {
      activeLeagueDoc: STATE.activeLeagueDoc,
      memberId: STATE.memberId || null,
      leagueName: LG().leagueName || '',
    };
  } else {
    // not in a league for this sport → clear its entry
    delete STATE.leaguesBySport[STATE.sport];
  }
  // ALSO remember identity PER LEAGUE DOC (not just per sport) so navigating
  // between league URLs keeps each league's claimed team.
  STATE.memberByLeague = STATE.memberByLeague || {};
  if (STATE.activeLeagueDoc && STATE.memberId) {
    STATE.memberByLeague[STATE.activeLeagueDoc] = STATE.memberId;
  }
  const identity = {
    sport: STATE.sport,
    activeLeagueDoc: STATE.activeLeagueDoc || null,
    memberId: STATE.memberId || null,
    leaguesBySport: STATE.leaguesBySport,
    memberByLeague: STATE.memberByLeague,
    sportByDoc: STATE.sportByDoc || {},
    seasonOverride: STATE.seasonOverride || {},
    // cached league directory: lets a name-based #slug resolve on boot (and offline)
    // before the master doc arrives. Firebase overwrites this whenever it syncs.
    approvals: STATE.approvals || {},
  };
  try {
    localStorage.setItem(LOCAL_LS_KEY, JSON.stringify(identity));
    const check = localStorage.getItem(LOCAL_LS_KEY);
    if (!check) throw new Error('write did not persist');
  } catch(e) {
    window.__bglIdentity = identity;
    try {
      document.cookie = `${LOCAL_LS_KEY}=${encodeURIComponent(JSON.stringify(identity))};path=/;max-age=31536000;SameSite=Lax`;
    } catch(e2) {}
  }
  // THE LEAGUE ITSELF — teams, draft, rosters, contracts, settings, the salary DB.
  // None of this was ever written anywhere on this device: saveLeague() would return
  // early whenever Firebase was not ready and toast "Saved locally" having saved
  // nothing at all. On any browser where Firebase does not load — a privacy setting,
  // an extension, a blocked CDN, or simply offline — every league vanished on reload
  // behind a reassuring green tick.
  let stored = false;
  for (const slim of [false, true]) {
    try {
      localStorage.setItem(LOCAL_DATA_KEY, JSON.stringify(localDataSnapshot({ slim })));
      stored = true;
      break;
    } catch (e) { /* over quota — retry without the player pool, then give up */ }
  }
  if (!stored) { try { localStorage.removeItem(LOCAL_DATA_KEY); } catch (e) {} }
  STATE._localSaveOk = stored;
  window.__bglData = stored ? null : localDataSnapshot({ slim: true });   // at least survive this tab
}

function loadLocal() {
  let id = null;
  try {
    const raw = localStorage.getItem(LOCAL_LS_KEY);
    if (raw) id = JSON.parse(raw);
  } catch(e) {}
  if (!id && window.__bglIdentity) id = window.__bglIdentity;
  if (!id) {
    try {
      const match = document.cookie.match(new RegExp('(?:^|; )' + LOCAL_LS_KEY + '=([^;]*)'));
      if (match) id = JSON.parse(decodeURIComponent(match[1]));
    } catch(e) {}
  }
  // The league snapshot. Firebase overwrites this the moment it syncs; when there is
  // no Firebase it is the only copy that exists, so it is restored before anything
  // else touches STATE.leagues. Merging over blankLeague() means a snapshot written
  // by an older version still gains any fields added since.
  try {
    const rawD = localStorage.getItem(LOCAL_DATA_KEY);
    const d = rawD ? JSON.parse(rawD) : window.__bglData;
    if (d) {
      for (const sk of Object.keys(d.leagues || {})) {
        const saved = d.leagues[sk];
        if (!saved) continue;
        STATE.leagues[sk] = { ...blankLeague(saved.leagueName || ''), ...saved };
      }
      if (d.poolMeta) STATE.poolMeta = d.poolMeta;
      if (d.salaryDB) STATE.salaryDB = d.salaryDB;
      if (d.salaryConfig) STATE.salaryConfig = { ...STATE.salaryConfig, ...d.salaryConfig };
      if (d.idOverrides) STATE.idOverrides = d.idOverrides;
      if (d.scoreOverrides) STATE.scoreOverrides = d.scoreOverrides;
    }
  } catch (e) {}
  if (!id) return;
  STATE.leaguesBySport = id.leaguesBySport || {};
  STATE.memberByLeague = id.memberByLeague || {};
  STATE.sportByDoc = id.sportByDoc || {};
  STATE.seasonOverride = id.seasonOverride || {};
  // restore the cached league directory (master overwrites it on sync)
  if (id.approvals && !Object.keys(STATE.approvals || {}).length) STATE.approvals = id.approvals;
  if (id.sport) STATE.sport = id.sport;
  // prefer the per-sport entry for the active sport
  const entry = STATE.leaguesBySport[STATE.sport];
  if (entry) {
    STATE.activeLeagueDoc = entry.activeLeagueDoc;
    STATE.memberId = entry.memberId;
  } else {
    if (id.activeLeagueDoc) STATE.activeLeagueDoc = id.activeLeagueDoc;
    if (id.memberId) STATE.memberId = id.memberId;
  }
  // SELF-HEAL: if the active league has an approval whose sport disagrees with the
  // restored sport, trust the approval (fixes a doc/state that got cross-wired).
  if (STATE.activeLeagueDoc) {
    const ap = Object.entries(STATE.approvals||{}).find(([k,a]) => (a.leagueDocId||('league_'+k))===STATE.activeLeagueDoc);
    const apSport = ap?.[1]?.sport;
    if (apSport && SPORTS[apSport] && STATE.sport !== apSport) STATE.sport = apSport;
  }
}

async function initFirebase() {
  loadLocal();  // device data first, instant
  if (FB_CONFIG.apiKey.startsWith('REPLACE')) { fbErr = 'Firebase not configured'; return; }
  const loaded = await _fbLoad;
  if (!loaded) { fbErr = 'offline (Firebase SDK unreachable)'; renderActive(); return; }
  try {
    const app = initializeApp(FB_CONFIG);
    db = getFirestore(app);
    fbReady = true;
    // live sync of MASTER settings (player pool, scoring, schedule, approvals)
    onSnapshot(doc(db, 'leagues', MASTER_DOC), (snap) => {
      if (snap.exists() && snap.data().master) {
        applyMaster(snap.data().master);
        STATE._loaded = true;
        // a shared league link (id OR name-slug) may be waiting on approvals — try it now
        if ((window._pendingDeepLink || window._pendingSlug) && typeof tryDeepLinkJoin === 'function') tryDeepLinkJoin();
        renderActive();
        // the landing gate's "Your leagues" list depends on approvals — refresh it in
        // place if that's what's currently showing (renderActive() doesn't touch the gate)
        if (typeof refreshGateIfLanding === 'function') refreshGateIfLanding();
        // pool likely just arrived from master — compute points if needed, and if
        // no pool arrived at all, fetch one: the pool feeds itself now
        if (typeof ensureFreshPool === 'function') ensureFreshPool();
        if (typeof ensurePoolPoints === 'function') ensurePoolPoints();
      }
    }, (e) => { fbErr = e.message; });
    // if this device previously joined a league, resubscribe to its shared doc
    if (STATE.activeLeagueDoc) subscribeLeague(STATE.activeLeagueDoc);
  } catch(e) { fbErr = e.message; }
}

/* live-sync a per-league doc (shared teams/draft). Personal data stays local. */
let _leagueUnsub = null;
function subscribeLeague(docId) {
  if (!fbReady || !docId) return;
  if (_leagueUnsub) { try { _leagueUnsub(); } catch(e){} _leagueUnsub = null; }
  let firstSnap = true;
  _leagueUnsub = onSnapshot(doc(db, 'leagues', docId), (snap) => {
    if (snap.exists() && snap.data().league) {
      const incoming = snap.data().league;
      // The league's TRUE sport comes from its approval (set at creation, authoritative),
      // NOT the league payload (which can carry a stale/wrong sport if it was ever saved
      // while the wrong sport was active). Only fall back to payload sport if no approval.
      const apprEntry = Object.entries(STATE.approvals||{}).find(([k,a]) => (a.leagueDocId||('league_'+k))===docId);
      const trueSport = apprEntry?.[1]?.sport;
      if (trueSport && SPORTS[trueSport] && STATE.sport !== trueSport) {
        STATE.sport = trueSport;
      }
      applyLeague(incoming);
      saveLocal();
      renderActive();
      if (typeof ensureFreshPool === 'function') ensureFreshPool();
      if (typeof ensurePoolPoints === 'function') ensurePoolPoints();
    } else if (firstSnap) {
      const haveLocal = (LG().teams && LG().teams.length) || (LG().draft && LG().draft.picks && LG().draft.picks.length);
      if (!haveLocal) {
        toast('Joined, but this league has no data yet — the commissioner needs to sync from their device.', 'err');
      }
    }
    firstSnap = false;
  }, (e) => { console.error('subscribeLeague snapshot error:', e?.code, e); });
}

/* save LOCAL always; save MASTER only when unlocked (commissioner) */
async function save(opts = {}) {
  saveLocal();  // always persist device state (my team, lineups, caches)
  if (opts.master) {
    await saveMaster();
  } else if (STATE.activeLeagueDoc) {
    await saveLeague(opts);   // joined an approved league → sync shared data
  } else if (!opts.silent) {
    reportLocalSave();
  }
}
/* Tell the truth about the local write. A device with storage full or blocked is one
   reload away from losing the league, and it should hear that while it can still act
   on it — not discover it afterwards. */
function reportLocalSave() {
  if (STATE._localSaveOk === false) {
    toast('⚠ Could NOT save on this device — storage is full or blocked', 'err');
  } else {
    toast('💾 Saved on this device', 'ok');
  }
}

/* The slice of a league that is SHARED across all members (not device-specific).
   Teams + draft + league meta are shared; my team/lineups/caches stay local. */
/* The ENTIRE league now lives in one shared doc — no local data.
   Lineups are keyed by teamId so everyone sees everyone's. Members maps
   a locked identity (name) to a team. gameLogs/schedule cached here too. */
function leaguePayload() {
  const lg = LG();
  // sport stored on the doc = the approval's sport (authoritative), so the doc can
  // self-heal if it was ever saved with a wrong sport. Fall back to active sport.
  const apprEntry = Object.entries(STATE.approvals||{}).find(([k,a]) => (a.leagueDocId||('league_'+k))===STATE.activeLeagueDoc);
  const docSport = apprEntry?.[1]?.sport || STATE.sport || 'flb';
  return {
    sport: docSport,
    leagueName: lg.leagueName || 'League',
    currentWeek: lg.currentWeek ?? 1,
    teams: lg.teams || [],
    draft: lg.draft || { started:false, complete:false, order:[], picks:[], currentPick:0 },
    schedule: lg.schedule || {},
    customScoring: lg.customScoring || {},
    rosterOverride: lg.rosterOverride || null,
    settings: lg.settings || {},
    draftPicks: lg.draftPicks || {},
    removedPicks: lg.removedPicks || {},
    contracts: lg.contracts || {},
    deadCap: lg.deadCap || {},
    moneyTrades: lg.moneyTrades || [],
    seasonApplied: lg.seasonApplied || null,
    seasonYear: lg.seasonYear || null,
    // an explicit null, never a missing key: Firestore merge writes can't delete a
    // field, so a dropped key would leave a consumed snapshot undoable forever
    rollbackSnapshot: lg.rollbackSnapshot || null,
    rulesDoc: lg.rulesDoc || null,
    injuriesCheckedAt: lg.injuriesCheckedAt || 0,
    tradeBlock: lg.tradeBlock || {},
    watchLists: lg.watchLists || {},
    rookieDraft: lg.rookieDraft || {},
    trades: lg.trades || [],
    lineups: lg.lineups || {},
    members: lg.members || {},
    irStash: lg.irStash || {},
    holdovers: lg.holdovers || {},
    transactions: lg.transactions || [],
    waivers: lg.waivers || {},
    waiverPriority: lg.waiverPriority || [],
    faabSpent: lg.faabSpent || {},
    keeperCosts: lg.keeperCosts || {},
    keepers: lg.keepers || {},
    seasonStartedAt: lg.seasonStartedAt || 0,
    // NOTE: gameLogs and scheduleCache are intentionally NOT synced. They're large,
    // derived caches that every device fetches itself from the MLB API (free + fast).
    // Syncing them blew past Firestore's 1 MB per-document limit. They live locally only.
    ts: Date.now(),
  };
}

/* Firebase rejects any `undefined` anywhere in the document. Deep-strip them so
   one stray undefined (e.g. in a player object or trade) can't fail the whole write. */
function stripUndefined(v) {
  if (Array.isArray(v)) return v.map(stripUndefined).filter(x => x !== undefined);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) {
      const cleaned = stripUndefined(v[k]);
      if (cleaned !== undefined) out[k] = cleaned;
    }
    return out;
  }
  return v === undefined ? undefined : v;
}

async function saveLeague(opts = {}) {
  if (!fbReady || !STATE.activeLeagueDoc) {
    // saveLocal() has already run (see save()) — report what it actually managed,
    // rather than a green tick over a write that never happened
    if (!opts.silent) reportLocalSave();
    return;
  }
  const payload = stripUndefined(leaguePayload());
  // SAFETY (wipe guard): never overwrite a populated doc with empty state. If this
  // device's league has no teams AND no draft picks AND no members, treat it as
  // "not loaded yet" and refuse to write. Prevents a blank LG() (after a sport
  // switch or mid-render glitch) from wiping everyone's Firebase data.
  const looksEmpty = (!payload.teams || payload.teams.length === 0)
                  && (!payload.draft?.picks || payload.draft.picks.length === 0)
                  && (!payload.members || Object.keys(payload.members).length === 0);
  if (looksEmpty && !opts.allowEmpty) {
    console.warn('saveLeague: refused empty payload (wipe guard)');
    if (!opts.silent) toast('Not synced — data not loaded yet. Try again shortly.', 'err');
    return;
  }
  try {
    // FULL WRITE, NOT MERGE. The payload is always the complete shared league, and
    // Firestore's merge is deep: a key deleted from a map (an expired contract, a
    // claimed waiver, dead cap that aged out, a cleared keeper board) would survive
    // on the server and resurrect on the next snapshot — which is exactly how a
    // league slowly rots across seasons. The master doc has always done a full
    // write for the same reason. The wipe guard above still refuses empty payloads.
    await setDoc(doc(db, 'leagues', STATE.activeLeagueDoc), { league: payload });
    if (!opts.silent) toast(`☁️ Synced to league: ${LG().leagueName}`, 'ok');
  } catch(e) {
    const code = e?.code || '';
    if (code === 'permission-denied') {
      toast('Sync denied by security rule. Check the Firestore rule is published.', 'err');
    } else {
      toast('League sync failed: ' + (e?.message || code || 'unknown'), 'err');
    }
    console.error('saveLeague error:', code, e);
  }
}

/* Apply shared league data pulled from the per-league doc (without clobbering
   this device's personal choices like myTeamId / lineups). */
/* Apply the full shared league doc. Everything is shared now, including
   all members' lineups (you view all, edit only your own). */
function applyLeague(league) {
  if (!league) return;
  // Use the CURRENT active sport (set authoritatively from the approval before this
  // runs), not league.sport — a stale payload sport would write data into the wrong
  // sport's slot and break things. Only use payload sport if STATE.sport is somehow unset.
  const sk = STATE.sport || league.sport || 'flb';
  if (!STATE.leagues[sk]) return;
  const lg = STATE.leagues[sk];
  if (league.leagueName) lg.leagueName = league.leagueName;
  if (league.currentWeek != null) lg.currentWeek = league.currentWeek;
  if (league.teams) lg.teams = league.teams;
  if (league.draft) lg.draft = league.draft;
  if (league.schedule) lg.schedule = league.schedule;
  if (league.customScoring) lg.customScoring = league.customScoring;
  if (league.rosterOverride !== undefined) lg.rosterOverride = league.rosterOverride;
  if (league.settings) lg.settings = { ...lg.settings, ...league.settings };
  if (league.draftPicks) lg.draftPicks = league.draftPicks;
  if (league.removedPicks) lg.removedPicks = league.removedPicks;
  if (league.contracts) lg.contracts = league.contracts;
  if (league.deadCap) lg.deadCap = league.deadCap;
  if (league.moneyTrades) lg.moneyTrades = league.moneyTrades;
  if (league.seasonApplied !== undefined) lg.seasonApplied = league.seasonApplied;
  if (league.seasonYear !== undefined) lg.seasonYear = league.seasonYear;
  if (league.rollbackSnapshot !== undefined) lg.rollbackSnapshot = league.rollbackSnapshot;
  if (league.rulesDoc !== undefined) lg.rulesDoc = league.rulesDoc;
  if (league.injuriesCheckedAt !== undefined) lg.injuriesCheckedAt = league.injuriesCheckedAt;
  if (league.tradeBlock) lg.tradeBlock = league.tradeBlock;
  if (league.watchLists) lg.watchLists = league.watchLists;
  if (league.rookieDraft) lg.rookieDraft = { ...lg.rookieDraft, ...league.rookieDraft };
  if (league.trades) lg.trades = league.trades;
  if (league.lineups) lg.lineups = league.lineups;
  if (league.members) lg.members = league.members;
  if (league.gameLogs) lg.gameLogs = league.gameLogs;
  if (league.scheduleCache) lg.scheduleCache = league.scheduleCache;
  if (league.irStash) lg.irStash = league.irStash;
  if (league.holdovers) lg.holdovers = league.holdovers;
  if (league.transactions) lg.transactions = league.transactions;
  if (league.waivers) lg.waivers = league.waivers;
  if (league.waiverPriority) lg.waiverPriority = league.waiverPriority;
  if (league.faabSpent) lg.faabSpent = league.faabSpent;
  if (league.keeperCosts) lg.keeperCosts = league.keeperCosts;
  if (league.keepers) lg.keepers = league.keepers;
  if (league.seasonStartedAt !== undefined) lg.seasonStartedAt = league.seasonStartedAt;
  // MIGRATION: contracts signed while the year bug returned 2027 have signedYear in the
  // future. Pull any contract whose signedYear is later than the current season back so
  // year 1 of the deal lands on the current season (where it belongs).
  const csy = (lg.seasonYear || new Date().getFullYear());
  if (lg.contracts) {
    Object.values(lg.contracts).forEach(c => {
      if (c && c.signedYear && c.signedYear > csy) c.signedYear = csy;
    });
  }
}

async function saveMaster() {
  if (!fbReady) { toast('⚠ Master not saved — Firebase offline', 'err'); return; }
  try {
    // Full write (NOT merge) so removing an approval actually deletes it. The master
    // doc is small and always fully populated, so a full overwrite is safe here.
    // Still strip undefined so a stray undefined can't fail the write.
    const master = stripUndefined(masterPayload());
    await setDoc(doc(db, 'leagues', MASTER_DOC), { master, ts: Date.now() });
    toast(`☁️ Saved to Firebase: ${FB_CONFIG.projectId}`, 'ok');
  } catch(e) { toast('Master save failed: ' + (e?.message || e?.code || 'unknown'), 'err'); console.error('saveMaster:', e); }
}

/* ============================================================
   UTILITIES
   ============================================================ */
/* ============================================================
   PLAYER HEADSHOTS
   ESPN serves headshots off a plain image CDN keyed by the SAME espnId we already
   store — no API, no key, no CORS (it's an <img> load). We request them through
   ESPN's resizing combiner so a roster page pulls ~8 KB/player instead of ~200 KB.
   Unknown players 404, so every image falls back: ESPN → (MLB only) MLB's own CDN
   keyed by mlbId → an initials chip. Nothing here can break the page offline.
   ============================================================ */
/* IDs are forced numeric — they land inside a URL, so nothing else may pass through */
function numId(v) { return /^\d+$/.test(String(v)) ? String(v) : null; }
function headshotUrl(p, size) {
  const id = p && numId(p.espnId);
  if (!id) return null;
  const game = SPORTS[STATE.sport]?.espnGame === 'fba' ? 'nba' : 'mlb';
  const w = size || 96;
  return `https://a.espncdn.com/combiner/i?img=/i/headshots/${game}/players/full/${id}.png`
       + `&w=${w}&h=${Math.round(w*0.73)}&scale=crop&cquality=40`;
}
function headshotFallbackUrl(p) {
  // baseball has a second source keyed by MLB's own id
  const id = p && numId(p.mlbId);
  if (SPORTS[STATE.sport]?.statsApi === 'mlb' && id) {
    return `https://midfield.mlbstatic.com/v1/people/${id}/spots/120`;
  }
  return null;
}
function playerInitials(name) {
  // letters/digits only — a name with markup characters must never leak into the DOM
  const parts = String(name||'').replace(/[^A-Za-z0-9\s]/g,'').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  const first = parts[0][0] || '';
  const last = parts.length > 1 ? (parts[parts.length-1][0] || '') : '';
  return (first + last).toUpperCase() || '?';
}
/* The fallback runs through this handler rather than an inline HTML-building string:
   the chip is built with textContent, so no player name can ever become markup. */
window.headshotFail = function(img) {
  if (!img) return;
  const fb = img.dataset.fb;
  if (fb && !img.dataset.tried) { img.dataset.tried = '1'; img.src = fb; return; }
  const span = document.createElement('span');
  span.className = 'headshot ph';
  span.style.width = img.style.width || '40px';
  span.style.height = img.style.height || '40px';
  span.textContent = img.dataset.ini || '?';
  img.replaceWith(span);
};
/* <img> with a chained fallback; ends as an initials chip if every source 404s.
   ESPN's id-keyed CDN is tried first, but "extra" players (added via MLB search
   outside the top-300 pool) carry a synthetic non-numeric espnId like 'mlb_660271' —
   headshotUrl() returns null for those, so the MLB-id fallback must be checked
   BEFORE giving up, not only as an onerror step after a successful ESPN request. */
function headshotImg(p, size) {
  const px = size || 40;
  const url = headshotUrl(p, px*2);          // 2x for retina
  const initials = esc(playerInitials(p && p.name));
  const fb = headshotFallbackUrl(p);
  const primary = url || fb;
  if (!primary) return `<span class="headshot ph" style="width:${px}px;height:${px}px">${initials}</span>`;
  const secondary = url ? fb : null;          // already-tried source is never reused
  return `<img class="headshot" loading="lazy" width="${px}" height="${px}" alt=""
    src="${esc(primary)}" data-ini="${initials}"${secondary?` data-fb="${esc(secondary)}"`:''}
    style="width:${px}px;height:${px}px" onerror="headshotFail(this)">`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function $(id) { return document.getElementById(id); }
function teamById(id) { return LG().teams.find(t => String(t.id) === String(id)) || {name:'?', abbrev:'?'}; }

/* TOASTS COLLAPSE.
   A draft, a rollover or a batch of saves fires dozens of these — unbounded, they
   stack into a wall that covers the entire screen and hides the very thing you
   just changed. So: repeats of the same message collapse into one with a counter,
   and no more than three are on screen at once. */
const TOAST_MAX = 3;
function toast(msg, kind='') {
  const wrap = $('toasts');
  if (!wrap) return;
  const last = wrap.lastElementChild;
  if (last && last.dataset.msg === msg && last.dataset.kind === kind) {
    const n = (parseInt(last.dataset.n) || 1) + 1;
    last.dataset.n = n;
    last.textContent = `${msg} ×${n}`;
    clearTimeout(Number(last.dataset.timer));
    last.dataset.timer = setTimeout(() => last.remove(), 3500);
    return;
  }
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  el.dataset.msg = msg; el.dataset.kind = kind; el.dataset.n = 1;
  wrap.appendChild(el);
  while (wrap.children.length > TOAST_MAX) wrap.firstElementChild.remove();
  el.dataset.timer = setTimeout(() => el.remove(), 3500);
}

function openModal(html) { $('modal-body').innerHTML = html; $('modal').classList.add('open'); }
window.closeModal = () => $('modal').classList.remove('open');

/* normalize a player name for matching: lowercase, strip accents, punctuation, suffixes */
function normName(name) {
  return String(name || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // strip accents
    .toLowerCase()
    .replace(/\b(jr|sr|ii|iii|iv)\b\.?/g, '')            // strip suffixes
    .replace(/[^a-z0-9\s]/g, '')                          // strip punctuation (keep digits)
    .replace(/\s+/g, ' ').trim();
}

/* ============================================================
   SALARY DATABASE — parse pasted contract data (tolerant of missing lines).
   Each block: name, position, [team], age, startYr, endYr, [years], $total, $aav.
   The two $ lines anchor the end of each block. AAV (2nd $) counts vs the cap.
   ============================================================ */
const SALARY_POS = new Set(['C','1B','2B','3B','SS','OF','LF','CF','RF','DH','SP','RP','P','UTIL','PG','SG','SF','PF','G','F']);
/* Positions that belong to ONE sport only — 'C' is a catcher and a center, so it
   tells you nothing. Used to notice a paste that has landed in the wrong sport's
   database, which is silent and destructive: the write replaces the whole DB. */
const SPORT_ONLY_POS = {
  flb: new Set(['1B','2B','3B','SS','OF','LF','CF','RF','DH','SP','RP','P']),
  fba: new Set(['PG','SG','SF','PF','G','F']),
};
/* of two contract rows for the same player, which one is his current deal? */
function betterContractRow(a, b, year) {
  if (!a) return b;
  if (!b) return a;
  const covers = (r) => r.start != null && r.end != null && year >= r.start && year <= r.end;
  if (covers(a) !== covers(b)) return covers(a) ? a : b;
  return (b.start ?? -Infinity) > (a.start ?? -Infinity) ? b : a;
}
function salaryPasteSport(parsed) {
  let flb = 0, fba = 0;
  (parsed || []).forEach(p => {
    const v = String(p.pos || '').toUpperCase();
    if (SPORT_ONLY_POS.flb.has(v)) flb++;
    else if (SPORT_ONLY_POS.fba.has(v)) fba++;
  });
  if (flb && flb > fba * 2) return 'flb';
  if (fba && fba > flb * 2) return 'fba';
  return null;   // nothing decisive — say nothing rather than guess
}
function parseMoney(s) { const m = String(s).replace(/[^0-9]/g, ''); return m ? parseInt(m) : null; }
function parseSalaryPaste(text) {
  const rawLines = String(text||'').split('\n');
  // Detect ROW format: a line split by tabs (or 2+ spaces) yields many fields with
  // two $ amounts. Spreadsheet/table pastes look like this. Else use newline mode.
  const splitRow = (ln) => ln.indexOf('\t') >= 0 ? ln.split('\t') : ln.split(/\s{2,}/);
  const isRowish = (l) => {
    const f = splitRow(l).filter(x => x.trim());
    return f.length >= 5 && f.filter(x => x.trim().startsWith('$')).length >= 2;
  };
  // Decide by scanning the WHOLE paste, never a sample. These tables arrive with a
  // multi-line header (PLAYER / CURRENTLY WITH / AGE AT SIGNING / START / END ...),
  // and sampling just the first six lines saw only the header — no $ anywhere — so
  // the parser fell into newline mode, where the embedded $ amounts are never found
  // at a line start. The entire paste collapsed into one bogus "player" and the
  // toast said "1 salary saved".
  const looksRow = rawLines.filter(l => l.trim() && isRowish(l)).length;

  if (looksRow >= 1) {
    // ROW MODE: one player per line. Fields: name, pos, [team], age, start, end, [years], $total, $aav
    const players = [];
    rawLines.forEach(line => {
      if (!line.trim()) return;
      const f = splitRow(line).map(x => x.trim()).filter(x => x !== '');
      if (f.length < 3) return;
      const moneys = f.filter(x => x.startsWith('$')).map(parseMoney);
      // a contract row carries money — a line without any $ is the header or a
      // stray label, and turning it into a player named "PLAYER" helps nobody
      if (!moneys.length) return;
      const nonMoney = f.filter(x => !x.startsWith('$'));
      const name = (nonMoney[0] || '').replace(/\s+[a-z]$/, '').trim();
      let pos = '', team = '', age = null, start = null, end = null, years = null;
      for (let k = 1; k < nonMoney.length; k++) {
        const v = nonMoney[k];
        if (!pos && SALARY_POS.has(v.toUpperCase())) { pos = v.toUpperCase(); continue; }
        if (/^(19|20)\d\d$/.test(v)) { if (start === null) start = parseInt(v); else if (end === null) end = parseInt(v); continue; }
        if (/^\d{1,2}$/.test(v)) { if (age === null) age = parseInt(v); else if (years === null) years = parseInt(v); continue; }
        if (/[A-Za-z]/.test(v) && !team) { team = v.replace(/^[^A-Za-z]+/, '').trim(); continue; }
      }
      if (name) players.push({ name, pos, team, age, start, end, years, total: moneys[0] ?? null, aav: moneys[1] ?? null });
    });
    return players;
  }

  // NEWLINE MODE: each field on its own line; two $ lines anchor each block.
  const lines = rawLines.map(l => l.trim());
  const players = [];
  let i = 0;
  while (i < lines.length) {
    if (!lines[i]) { i++; continue; }
    const name = lines[i].replace(/\s+[a-z]$/, '').trim();
    i++;
    const blk = { pos:'', team:'', age:null, start:null, end:null, years:null, total:null, aav:null };
    const moneys = [];
    while (i < lines.length) {
      if (moneys.length >= 2) break;
      const ln = lines[i];
      if (ln === '') { i++; continue; }
      if (ln.startsWith('$')) { moneys.push(parseMoney(ln)); i++; continue; }
      if (SALARY_POS.has(ln)) { if (!blk.pos) blk.pos = ln; i++; continue; }
      if (/^(19|20)\d\d$/.test(ln)) {
        if (blk.start === null) blk.start = parseInt(ln);
        else if (blk.end === null) blk.end = parseInt(ln);
        i++; continue;
      }
      if (/^\d{1,2}$/.test(ln)) {
        if (blk.age === null) blk.age = parseInt(ln);
        else if (blk.years === null) blk.years = parseInt(ln);
        i++; continue;
      }
      if (/[A-Za-z]/.test(ln)) {
        const team = ln.replace(/^[^A-Za-z]+/, '').trim();
        if (!blk.team) blk.team = team;
        i++; continue;
      }
      i++;
    }
    blk.total = moneys[0] ?? null;
    blk.aav = moneys[1] ?? null;
    if (name) players.push({ name, ...blk });
  }
  return players;
}
/* current sport's salary DB (normName -> record) */
function salaryDB(sportKey) { return (STATE.salaryDB && STATE.salaryDB[sportKey || STATE.sport]) || {}; }

    defaultCap: 260000000,        // ~luxury-tax scale
    arbSalary: 5000000,           // placeholder for a player with no imported deal
    maxTerm: 10,                  // MLB routinely signs 10+ year contracts
    capGrowthPct: 5,
    signingDiscount: 0.875, escalatorGrowth: 0.125, escalatorPct: 5,
    penaltyTiers: PENALTY_TIERS_DEFAULT,
    dropPenalty: 2,               // dropping a signed player costs this x his current salary
    irDiscount: 0.5,              // a player parked on the IL counts this share of his salary
    // the multiplier in the cap formula, by league type. 1 = the cap IS the average
    // team payroll, so about half the league starts over it.
    headroom: { dynasty: 1, keeper: 1, redraft: 1 },

  fba: {                          // NBA: hard-ish cap, shorter deals, lower minimums
    // Anchored to the real NBA cap, but note a FANTASY team is not a real team: a
    // 10-team league splits ~30 NBA rosters between 10 owners, so each holds several
    // real teams' worth of salary. The per-league suggestion (capBasis) accounts for
    // that; this flat number is only a fallback when nothing has been suggested yet.

    arbSalary: 2000000,           // ~veteran minimum
    maxTerm: 5,                   // NBA maximum contract length
    capGrowthPct: 5,
    signingDiscount: 0.875, escalatorGrowth: 0.125, escalatorPct: 5,
    penaltyTiers: PENALTY_TIERS_DEFAULT,
    dropPenalty: 2,
    irDiscount: 0.5,
    headroom: { dynasty: 1, keeper: 1, redraft: 1 },

/* Older saves stored ONE flat salaryConfig shared by both sports (baseball was the

   existing leagues keep the rules they had. */

  const sc = STATE.salaryConfig;
  if (!sc || typeof sc !== 'object') { STATE.salaryConfig = {}; return STATE.salaryConfig; }
  const isLegacyFlat = Object.keys(sc).some(k => k !== 'flb' && k !== 'fba');
  if (isLegacyFlat) {
    const { flb, fba, ...legacy } = sc;

/* this league's cap (league override or master default) */
/* ============================================================

     cost   = the real AAV of the top `spots` players   <- what they cost
     perTeam= cost / teams                              <- an even split of talent
     cap    = perTeam x headroom                        <- room to be unbalanced

   escalating multi-year deals, a keeper carries a few, a redraft none.
   Players with no imported salary count at the minimum rate, so this still returns
   a sane number before (or without) a salary database.

   THE MULTIPLIER IS DELIBERATELY TIGHT. It was 1.25, and mock drafts showed that
   was the same slack a snake draft naturally produces — the greediest price-blind

   anyone and roster construction wasn't a decision. At 1.03-1.08 the same careless

/* A neutral league to quote site-wide numbers against. Master settings configures

}
/* the pieces behind the suggestion, so the UI can show its work.

/* THE DEFAULT CAP FORMULA.

     cap = (sum of every drafted player's salary) / (number of teams) x multiplier

   an average team spent. With the multiplier at 1 that means roughly half the
   league is over the moment the draft ends, which is the point: the cap has to be

    seen.add(id);
    const p = (LG().playerPool || []).find(x => String(x.espnId) === id);

function capFromDraft(leagueType) {
  const teams = Math.max(1, (LG().teams || []).length);

  return { perTeam: Math.round(perTeam), teams, mult,

/* Set the league's cap once, when the draft finishes. After this it is a stored

function setCapFromDraft(opts = {}) {
  if (!LSET().useSalaryCap) return null;
  ensureSettings();
  if (LG().settings.capSetFrom && !opts.force) return null;   // already fixed
  const r = capFromDraft();
  LG().settings.salaryCapDollars = r.cap;
  LG().settings.capSetFrom = { at: Date.now(), perTeam: r.perTeam, mult: r.mult,
                               total: draftedSalaryTotal(), teams: r.teams };
  logTxn('season', `Salary cap set to ${fmtMoney(r.cap)} from the draft (${fmtMoney(r.perTeam)} average payroll × ${r.mult})`);
  return r.cap;

window.recomputeCapFromDraft = function() {
  if (!(window._masterUnlocked || commishUnlocked())) { toast('Commissioner only', 'err'); return; }
  if (!LG().draft?.complete) { toast('The draft has to finish first', 'err'); return; }
  const cap = setCapFromDraft({ force: true });
  save();
  toast(cap ? `Cap re-set to ${fmtMoney(cap)}` : 'Salaries are off for this league', cap ? 'ok' : 'err');
  closeModal(); renderActive();
};
function capBasis(shape) {
  const sh = shape || {};
  const teams = Math.max(2, sh.teams || (LG().teams || []).length || 10);
  const spots = Math.max(1, sh.spots || rosterCap());
  const need  = teams * spots;
  const arb   = SALCFG().arbSalary;

  // ONCE THE DRAFT IS DONE, USE WHAT TEAMS ACTUALLY BOUGHT.
  // Before a draft all we can do is guess which players will be rostered, so we
  // price the top `need` salaries in the pool. After it, guessing is silly — the
  // rosters exist. Real rosters are cheaper than the theoretical top N (drafters
  // take needs and sleepers, not a pure salary list), so this also stops the cap
  // being set off a roster nobody actually built.
  const drafted = !shape && LG().draft?.complete && (LG().teams || []).length >= 1;
  let priced, fromRosters = false;
  if (drafted && draftedSalaryTotal() > 0) {
    const r = capFromDraft(sh.leagueType);
    return { teams, spots, need, perTeam: r.perTeam, headroom: r.mult, cap: r.cap,
             minSalary: arb, minDerived: !!SALCFG().arbSalaryDerived,
             fromRosters: true, drafted: (LG().draft.picks || []).length,
             draftedTotal: draftedSalaryTotal(),
             priced: (LG().draft.picks || []).length, fromDb: (LG().draft.picks || []).length,
             usingRealSalaries: Object.keys(salaryDB()).length > 0 };

  priced = (LG().playerPool || [])
    .map(p => { const a = importedAAV(p); return a == null ? arb : a; })
    .sort((a, b) => b - a)
    .slice(0, need);

  const total = priced.reduce((a, b) => a + b, 0) + Math.max(0, need - priced.length) * arb;
  const perTeam = total / teams;
  const headroom = capHeadroom(sh.leagueType);
  // round to a clean $5M so the number reads as a decision, not a calculation
  const cap = Math.max(arb * spots, Math.round((perTeam * headroom) / 5000000) * 5000000);
  return { teams, spots, need, perTeam: Math.round(perTeam), headroom, cap,
           minSalary: arb, minDerived: !!SALCFG().arbSalaryDerived,

           fromDb: priced.filter(v => v !== arb).length,
           priced: priced.length, usingRealSalaries: Object.keys(salaryDB()).length > 0 };
}
function suggestedCap() { return capBasis().cap; }

function leagueCap() {
  // league can override the master default. The override may be stored in millions
  // (e.g. 260) or full dollars (e.g. 260000000); normalize small values to millions.
  const ov = LSET().salaryCapDollars;          // explicit full-dollar override
  if (ov && ov > 0) return ov;
  return SALCFG().defaultCap;

  // compound forward from there

function currentSeasonYear() {

  // its schedule opener and its contracts run on. It is NOT the wall clock: an NBA
  // season spans two calendar years and ESPN labels it by the ENDING year, so a
  // league in the 2025-26 NBA season is simply "2026" everywhere in here. Advancing
  // the season moves this by one, and everything derived from it moves together.
  const lg = LG();

  if (!contract) return 0;
  const n = (year - contract.signedYear) + 1;          // 1-based contract year
  if (n < 1 || n > contract.termYears) return 0;        // outside the term
  const c = SALCFG();

    const yearsLeft = last - currentSeasonYear() + 1;
    return { text: `FA ${last + 1}`, tone: yearsLeft <= 1 ? 'amber' : 'good',

   point of the slot, and without it stashing an injured star is pure downside.
