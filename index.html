/* generate a 5-digit league id not already in use */
function genLeagueId() {
  const used = new Set(Object.keys(STATE.approvals || {}));
  let id;
  do { id = String(Math.floor(10000 + Math.random() * 90000)); } while (used.has(id));
  return id;
}
/* Give an OLD name-based league a 5-digit ID. The new approval points at the SAME
   existing data doc (e.g. league_jarens-league), so no data moves — members can now
   join with the 5-digit ID and reach the commissioner's existing teams/draft. */
window.migrateLeagueId = function(oldKey) {
  const old = STATE.approvals?.[oldKey];
  if (!old) return;
  const newId = genLeagueId();
  STATE.approvals[newId] = {
    ...old,
    leagueId: newId,
    // KEEP the original data doc so existing data is reachable via the new ID
    leagueDocId: old.leagueDocId || ('league_' + oldKey),
    migratedFrom: oldKey,
    approved: true,
  };
  // If THIS device is the commissioner currently bound to the old doc, keep it bound
  // (the doc didn't change) and just remember the new ID for sharing.
  save({ master:true });
  openModal(`<div class="h2">5-digit ID created 🎉</div>
    <p class="sub mb">Share this ID with your members. It points to your existing league data — nothing was moved.</p>
    <div style="text-align:center;padding:1rem;background:var(--field-2);border-radius:8px;margin-bottom:1rem">
      <div class="sub" style="font-size:.65rem;letter-spacing:2px">LEAGUE ID</div>
      <div class="display amber" style="font-size:2.5rem;letter-spacing:6px">${newId}</div>
      <div class="sub" style="font-size:.7rem">${esc(old.leagueName||'')}</div>
    </div>
    <p class="sub" style="font-size:.66rem">The old text key still works too. You can remove it later once everyone has joined with the new ID.</p>
    <button class="btn btn-block" onclick="openCommishLog()">Done</button>`);
};
window.saveApproval = function() {
  const commish = $('ap-commish')?.value.trim() || '';
  const leagueName = $('ap-league')?.value.trim() || '';   // optional
  const pin = ($('ap-pin')?.value || '').trim();
  const id = genLeagueId();                          // 5-digit key (the required identifier)
  const sport = window._newLeagueSport || STATE.sport;
  const salaryAllowed = !!window._newLeagueSalary;
  STATE.approvals = STATE.approvals || {};
  STATE.approvals[id] = {
    commish,
    leagueName: leagueName || ('League ' + id),      // default name from ID if blank
    approved: true,
    leagueId: id,
    leagueDocId: 'league_' + id,
    sport,                                            // which sport this league belongs to
    salaryAllowed,                                    // did commissioner approve salary cap?
    pin: pin || '0000',                              // per-league commissioner PIN (editable later)
    created: Date.now(),
  };
  // clear the form's stashed PIN so it doesn't leak to the next create
  window._apPin = '';
  // switch to the chosen sport so the league is created under it
  STATE.sport = sport;
  save({master:true});
  // CRITICAL: the commissioner must JOIN the league they just created, so that all
  // their setup (teams, draft, settings) syncs to the league doc in Firebase. Without
  // this, activeLeagueDoc stays null and every save goes local-only — other devices
  // would join and see nothing.
  STATE.activeLeagueDoc = 'league_' + id;
  LG().leagueName = STATE.approvals[id].leagueName;
  // apply the approved salary setting to this league
  if (salaryAllowed) { ensureSettings(); LG().settings.useSalaryCap = true; }
  saveLocal();
  subscribeLeague('league_' + id);
  // If the commissioner already set up teams/draft locally before creating the ID,
  // push that data up NOW so members who join immediately see it.
  if ((LG().teams && LG().teams.length) || (LG().draft?.picks?.length)) {
    saveLeague({ silent:true });
  }
  const shownName = leagueName || ('League ' + id);
  openModal(`<div class="h2">League created 🎉</div>
    <p class="sub mb">Your league now has its own link. Share it with members — or open it yourself.</p>
    <div style="text-align:center;padding:1rem;background:var(--field-2);border-radius:8px;margin-bottom:1rem">
      <div class="sub" style="font-size:.65rem;letter-spacing:2px">LEAGUE ID</div>
      <div class="display amber" style="font-size:2.5rem;letter-spacing:6px">${id}</div>
      <div class="sub" style="font-size:.7rem">${esc(shownName)}</div>
    </div>
    <button class="btn btn-block" onclick="copyShareLink('${id}')">🔗 Copy invite link</button>
    <button class="btn btn-amber btn-block mt" onclick="openCreatedLeague('${id}')">Open this league →</button>
    <button class="btn btn-ghost btn-block mt" onclick="closeModal();openCommishLog()">Back to master hub</button>`);
};

/* ---- LAUNCH: league-name gate ----
   After choosing a sport, the user enters their league name. If it's
   on the approved list (and toggled on), their data syncs to that
   league's own doc. Otherwise they're denied. The commissioner (you)
   bypasses this — your master PIN unlocks everything. ---- */
/* ============================================================
   BLOCKING GATE — sport selection → league name. The app is hidden
   behind this until the user picks a sport and joins an approved
   league. No skip path. Commissioners join their own league too.
   ============================================================ */
function gateNeeded() {
  // need both a chosen sport (always set) AND a joined league
  return !STATE.activeLeagueDoc;
}
function showGate(step) {
  const gate = $('gate');
  gate.style.display = 'flex';
  window._gateStep = step || 'landing';
  if (step === 'league') renderGateLeague();
  else renderGateLanding();
}
function hideGate() {
  $('gate').style.display = 'none';
  window._gateStep = null;
}
/* Re-render the landing gate IN PLACE if it's the one currently showing — used after
   approvals arrive/update asynchronously (Firebase master snapshot), since renderActive()
   only touches in-app pages, never the gate overlay. Cheap no-op otherwise. */
function refreshGateIfLanding() {
  if (window._gateStep === 'landing' && $('gate')?.style.display === 'flex') renderGateLanding();
}
/* All leagues THIS DEVICE has ever joined (claimed a team in), across every sport —
   built from memberByLeague (leagueDocId -> memberId, set the moment a team is claimed
   and never cleared by "leave league") cross-referenced with approvals for the name/
   sport/current-id needed to quick-join. Two approval keys can alias the same data doc
   (a league migrated from a text key to a 5-digit id) — dedupe to one row, preferring
   the numeric id as the canonical join target. */
function joinedLeaguesList() {
  const mbl = STATE.memberByLeague || {};
  const appr = STATE.approvals || {};
  const byDoc = {};
  Object.keys(appr).forEach(id => {
    const a = appr[id];
    const docId = a.leagueDocId || ('league_' + id);
    if (!mbl[docId]) return;                          // only leagues we've actually joined
    const cur = byDoc[docId];
    if (!cur || (!/^\d{5}$/.test(cur.id) && /^\d{5}$/.test(id))) {
      byDoc[docId] = { id, leagueDocId: docId, leagueName: a.leagueName || ('League ' + id),
        sport: (a.sport && SPORTS[a.sport]) ? a.sport : 'flb', approved: a.approved !== false };
    }
  });
  return Object.values(byDoc).sort((a,b) => (a.leagueName||'').localeCompare(b.leagueName||''));
}
/* LANDING — the main entry. Quick-join any previously-joined league, open Master
   settings (admin, PIN), or join/open a new league by ID. Members normally arrive via

  $('gate-inner').innerHTML = `

      style="text-align:center;font-size:1.6rem;letter-spacing:6px" onkeydown="if(event.key==='Enter')gateJoinLeague()">

    <p class="sub" style="text-align:center;font-size:.62rem;margin-top:1.1rem;color:var(--sage-dim)">
      The League · ${esc(APP_VERSION)}</p>`;
}

/* Core join logic, shared by the manual gate, the URL deep-link, and the switcher.
   Returns true if joined, false if not (with a toast/UI explaining why). */
function joinLeagueById(id, opts = {}) {
  // Accept a 5-digit ID, or ANY key that actually exists in approvals — a name-based
  // league URL can resolve to a legacy text key, which is still a real league.
  const known = !!(STATE.approvals && STATE.approvals[id]);
  if (!known && !/^\d{5}$/.test(String(id))) {
    if (!opts.silent) toast('Invalid League ID', 'err'); return false;
  }
  const appr = STATE.approvals?.[id];
  if (!appr) {
    if (!opts.silent) toast('League ID not found. Double-check it with your commissioner.', 'err');
    return false;
  }
  if (!appr.approved) {
    $('gate-inner').innerHTML = `
      <div class="brand-big"><span class="bl-the">THE</span><span class="bl-name">LEAGUE<span class="mark">.</span></span></div>
      <div class="step-label" style="color:var(--bad)">Access paused</div>
      <p class="sub" style="text-align:center;margin-bottom:1rem">
        This league's access is currently turned off. Please contact the site admin.</p>
      <button class="btn btn-ghost btn-block" onclick="showGate('landing')">← Back</button>`;
    $('gate').style.display = 'flex';   // show as-is — do NOT re-render another gate step over it
    return false;
  }
  // approved → adopt the league's sport, bind device, sync, drop the gate
  if (appr.sport && SPORTS[appr.sport] && appr.sport !== STATE.sport) {
    STATE.sport = appr.sport;   // this league belongs to a specific sport
  }
  LG().leagueName = appr.leagueName;
  // leagueDocFor(): a migrated/legacy approval may not carry an explicit leagueDocId
  const docId = leagueDocFor(id);
  STATE.activeLeagueDoc = docId;
  // restore this device's identity in THIS league if it was here before (so switching
  // between league URLs doesn't lose which team you claimed); otherwise start fresh.
  STATE.memberId = (STATE.memberByLeague || {})[docId] || null;
  window._settingsScope = 'league';   // Settings now configures THIS league
  saveLocal();
  // make this league's URL its own address: #league=<id> (bookmarkable, survives refresh)
  setLeagueHash(id);
  subscribeLeague(docId);
  hideGate();
  if (!opts.silent) toast(`Opened ${appr.leagueName}`, 'ok');
  go('home');
  return true;
}
/* Write / clear the URL hash so each league is its own address. Guarded so it
   doesn't retrigger the hashchange auto-join loop. */
/* Go to the hub: clear the URL to bare AND show the landing, so URL and view stay
   in sync. Use this everywhere a "back to hub" action happens in-app. */
function goToHub() {
  setLeagueHash(null);   // bare URL (pushes a hub history entry if the URL changes)
  window._pausedFor = null;
  showGate('landing');
}
/* Write the URL so each league is its own address AND a real browser-history entry,
   so Safari's back button steps league → hub naturally.
   - setLeagueHash(id): PUSH a new entry '#league=<id>' (so back returns to whatever
     was showing before — normally the hub).
   - setLeagueHash(null): return to the bare hub URL as its own entry. */
function setLeagueHash(id) {
  window._suppressHash = true;
  try {
    // never mint a name-slug before approvals exist — it wouldn't resolve on reload.
    // Fall back to the always-resolvable legacy form until the name is known.
    const frag = id ? (STATE.approvals?.[id] ? ('#' + leagueSlug(id)) : ('#league=' + id)) : '';
    const target = id ? (location.pathname + location.search + frag)
                      : (location.pathname + location.search);
    const current = location.pathname + location.search + location.hash;
    // only push a new history entry if the URL is actually changing — prevents
    // double entries when the boot deep-link already put us at this league URL.
    if (target !== current) history.pushState({ league: id || null }, '', target);
  } catch(e) {
    try {
      if (id) location.hash = STATE.approvals?.[id] ? leagueSlug(id) : ('league=' + id);
      else location.hash = '';
    } catch(e2) {}
  }
  setTimeout(() => { window._suppressHash = false; }, 50);
}
/* Seed a hub entry UNDER the current one at boot, so that when someone opens a
   league link directly (no prior hub view), pressing back still lands on the hub
   instead of leaving the site. Called once during boot when we start in a league. */
function seedHubHistory() {
  try {
    const here = location.pathname + location.search + location.hash;
    // replace current with a clean hub entry, then push the league back on top
    const leagueHash = location.hash;
    history.replaceState({ hub: true }, '', location.pathname + location.search);
    if (leagueHash) history.pushState({ league: true }, '', here);
  } catch(e) {}
}

window.doPullPool = async function() {
  try {
    const raw = await fetchPlayerPool(slog);
    LG().playerPool = raw.map(pp => {
      const pl = pp.player || pp;
      const eligible = deriveEligibility(pl.eligibleSlots, pl.defaultPositionId);
      const defPos = posName(pl.defaultPositionId);
      // ADP: prefer ESPN's averageDraftPosition; when that's empty (e.g. offseason or
      // a sport with no live drafts) fall back to the player's draft rank, then to the
      // ownership %. This keeps stars at the top instead of dumping everyone to 9999.
      let adp = pl.ownership?.averageDraftPosition || 0;
      if (!(adp > 0)) {
        const ranks = pl.draftRanksByRankType || {};
        const r = ranks.STANDARD || ranks.PPR || ranks.STANDARDDRAFT || Object.values(ranks)[0];
        if (r && r.rank > 0) adp = r.rank;
      }
      if (!(adp > 0)) {
        // last resort: order by ownership % (more-owned = earlier). Map 100%→1, 0%→9999.
        const own = pl.ownership?.percentOwned || 0;
        adp = own > 0 ? Math.max(1, Math.round(1000 - own * 9)) : 9999;
      }
      // points: MLB uses ESPN's applied total (placeholder until game logs pull);
      // NBA computes from raw ESPN stats using the league's scoring right here.
      let seasonPts = 0, ptsPerGame = null, gamesPlayed = null;
      if (SP().statsApi === 'nba') {
        const np = nbaPointsFromEspn(pl);
        seasonPts = np.seasonPts;
        ptsPerGame = np.perGame;
        gamesPlayed = np.games;
      } else {
        seasonPts = seasonPointsFromEspn(pl);
      }
      return {
        espnId: pl.id,
        name: pl.fullName || `${pl.firstName||''} ${pl.lastName||''}`.trim(),
        pos: defPos,
        defPosId: pl.defaultPositionId,
        eligible,
        proTeam: proTeamAbbr(pl.proTeamId),
        eligSlots: pl.eligibleSlots || [],   // raw, for re-deriving eligibility later
        adp: Math.round(adp * 10) / 10,
        seasonPts,
        ptsPerGame, gamesPlayed,             // NBA per-game rate (null for MLB)
        ptsSeason: SP().statsApi === 'nba' ? seasonPts : null,  // mark NBA as "has points"
        owned: Math.round((pl.ownership?.percentOwned || 0) * 10) / 10,
        injured: !!pl.injured || (pl.injuryStatus && pl.injuryStatus !== 'ACTIVE' && pl.injuryStatus !== 'NORMAL' && pl.injuryStatus !== 'INJURY_STATUS_NORMAL'),
        injuryStatus: pl.injuryStatus || null,
        mlbId: null,
      };
    }).filter(p => p.name);

    // sort by ADP (best first), then trim to the top 300. Keeping the pool small
    // and fixed keeps the synced Firebase doc well under the 1 MB limit. Players
    // outside the top 300 can be loaded individually to local storage on demand.
    LG().playerPool.sort((a,b) => a.adp - b.adp);
    LG().playerPool = LG().playerPool.slice(0, 300);
    const ranked = LG().playerPool.filter(p => p.adp < 9999).length;
    slog(`Stored top ${LG().playerPool.length} players (${ranked} with real ADP)`, 'ok');
    await save({master:true});
    toast('Player pool loaded (top 300)', 'ok');
    renderActive();
  } catch(e) { slog('Pool fetch failed: ' + e.message, 'err'); toast(e.message, 'err'); }
};

/* compute atomic eligibility from raw ESPN slots + default position id.
   Shared by the pool pull and the re-derive button so they never diverge. */
function deriveEligibility(eligSlots, defaultPositionId, sportKey) {
  const sp = SPORTS[sportKey] || SP();   // use the EXPLICIT sport when given
  const isMLB = sp.key === 'flb';
  // position sort order differs by sport
  const order = isMLB
    ? ['C','1B','2B','3B','SS','OF','DH','SP','RP']
    : ['PG','SG','SF','PF','C','G','F'];   // NBA
  const eligMap = sp.eligMap || {};
  const atomic = new Set();
  (eligSlots||[]).forEach(slotId => (eligMap[slotId]||[]).forEach(pos => atomic.add(pos)));
  const defPos = (sp.posMap||{})[defaultPositionId] || posName(defaultPositionId);
  if (defPos && defPos !== '?') atomic.add(defPos);
  if (isMLB) {
    // pitcher/hitter separation is baseball-specific
    const isPitcher = defaultPositionId === 1 || defaultPositionId === 11;
    if (isPitcher) {
      ['C','1B','2B','3B','SS','OF','DH'].forEach(h => atomic.delete(h));
      if (!atomic.has('SP') && !atomic.has('RP')) atomic.add(defPos);
    } else {
      atomic.delete('SP'); atomic.delete('RP');
    }
  }
  const eligible = [...atomic].sort((a,b) => order.indexOf(a) - order.indexOf(b));
  return eligible.length ? eligible : [defPos];
}

/* re-derive eligibility for the WHOLE pool from stored raw slots — no ESPN re-pull.
   Use after changing eligMap rules. */
window.reDeriveEligibility = function() {
  let changed = 0;
  LG().playerPool.forEach(p => {
    const before = (p.eligible||[]).join('/');
    p.eligible = deriveEligibility(p.eligSlots, p.defPosId);
    if ((p.eligible||[]).join('/') !== before) changed++;
  });
  save({master:true});
  toast(`Eligibility re-derived · ${changed} players updated`, 'ok');
  renderActive();
};

/* All salary-rule edits write into the ACTIVE sport's slot, never a shared object,
   so editing basketball's rules can never move baseball's. */
function salCfgSlot() {
  normalizeSalaryConfig();
  const sk = STATE.sport || 'flb';
  // arbSalaryDerived is a computed marker, not a setting — persisting it would make
  // an auto minimum look hand-set the next time it's read back.
  const { arbSalaryDerived, ...cfg } = SALCFG(sk);
  if (arbSalaryDerived) delete cfg.arbSalary;   // keep letting the data decide
  STATE.salaryConfig[sk] = cfg;
  return STATE.salaryConfig[sk];
}

window.openSeasonRollover = function() {
  if (!LSET().useSalaryCap) { toast('Salaries are off for this league', 'err'); return; }

  const penHtml = overTeams.length ? overTeams.map(x =>

    </div>`).join('') : '<p class="sub" style="font-size:.75rem">No teams are over the cap. No pick penalties.</p>';
  const newCap = Math.round(leagueCap() * (1 + (SALCFG().capGrowthPct||0)/100));
  openModal(`<div class="h2">Advance to ${yr+1} season</div>
    <div class="card card-tight mt mb" style="border-color:var(--bad)">

    <p class="sub" style="font-size:.72rem">Every signed contract advances one year. Contracts in their final year will expire and those players become free.</p>
    <button class="btn btn-block mt" style="background:var(--bad);color:#fff" onclick="confirmSeasonRollover()">Apply & advance to ${yr+1}</button>
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Cancel</button>`);

/* SEASON ROLLOVER IS DESTRUCTIVE — so it is reversible.
   Advancing deletes expired contracts, releases those players off rosters, strips
   penalty picks and rewrites the cap. A commissioner who runs it a week early, or
   before a disputed contract is fixed, has no other way back. We snapshot exactly
   the pieces the rollover touches (not the whole league — scores and schedules keep
   running) and restore them on undo. */
const ROLLOVER_KEYS = ['contracts', 'deadCap', 'moneyTrades', 'draftPicks', 'lineups', 'irStash'];
function snapshotForRollover() {
  const lg = LG();
  const snap = { fromYear: currentSeasonYear(), at: Date.now(),
                 cap: LSET().salaryCapDollars || null,
                 picks: JSON.parse(JSON.stringify(lg.draft?.picks || [])) };
  ROLLOVER_KEYS.forEach(k => { snap[k] = JSON.parse(JSON.stringify(lg[k] || (Array.isArray(lg[k]) ? [] : {}))); });
  return snap;
}
window.undoSeasonRollover = function() {
  const lg = LG();
  const snap = lg.rollbackSnapshot;
  if (!snap) { toast('Nothing to undo', 'err'); return; }
  ROLLOVER_KEYS.forEach(k => { lg[k] = snap[k]; });
  lg.draft = lg.draft || {};
  lg.draft.picks = snap.picks;                       // rosters live in draft.picks
  ensureSettings();
  lg.settings.salaryCapDollars = snap.cap;
  lg.seasonYear = snap.fromYear;
  lg.seasonApplied = null;
  lg.rollbackSnapshot = null;                        // one undo, not a time machine
  logTxn('season', `Season advance undone — back to ${snap.fromYear}`);
  save();
  toast(`Reverted to ${snap.fromYear}`, 'ok');
  closeModal(); renderActive();
};
window.confirmSeasonRollover = function() {
  const yr = currentSeasonYear();
  LG().rollbackSnapshot = snapshotForRollover();
  const logs = [];
  const log = (m) => logs.push(m);
  // 1) PENALTIES — remove picks for each over-cap team (cascade-aware)
  LG().teams.forEach(t => {
    const pen = teamCapPenalty(t.id, yr);
    for (let k = 0; k < pen.picks; k++) {
      // remove from round 1 first, then round 2, etc. (one pick per round, escalating)
      removeOnePick(t.id, k + 1, yr + 1, log);
    }
  });
  // 2) CAP GROWTH — bake next season's cap into this league's setting. capForYear
  //    honours an explicit pin for that year before falling back to growth %.
  ensureSettings();
  LG().settings.salaryCapDollars = capForYear(yr + 1);
  // 3) CONTRACT AGING — advance signedYear bookkeeping by expiring finished deals.
  //    Contracts are stored by signedYear+term; "aging" = drop any whose last year was yr.
  const contracts = LG().contracts || {};
  let expired = 0;
  const expiredPids = [];
  Object.keys(contracts).forEach(pid => {
    const c = contracts[pid];
    const lastYear = c.signedYear + c.termYears - 1;
    if (lastYear <= yr) {
      delete contracts[pid];
      expiredPids.push(pid);
      expired++;
      const pl = LG().playerPool.find(x=>String(x.espnId)===String(pid));
      log(`Contract expired — ${pl?.name||pid} becomes a free agent`);
    }
  });
  // 3b) AUTO-KICK expired players off rosters — their fantasy contract is up, so they
  //     leave the team and return to the free-agent pool for the new season.
  if (expiredPids.length) {
    const expSet = new Set(expiredPids.map(String));
    LG().draft.picks = (LG().draft.picks||[]).filter(pk => !expSet.has(String(pk.playerId)));
    // also clear them from any lineup assignments
    Object.values(LG().lineups||{}).forEach(weeks => Object.values(weeks||{}).forEach(wk => {
      if (wk?.assignments) for (const k of Object.keys(wk.assignments)) {
        if (expSet.has(String(wk.assignments[k]))) wk.assignments[k] = null;
      }
    }));
  }
  // 4) DEAD-CAP EXPIRY — clear hits dated this season or earlier
  const dc = LG().deadCap || {};
  Object.keys(dc).forEach(tid => {
    dc[tid] = (dc[tid] || []).filter(d => d.year > yr);
    if (!dc[tid].length) delete dc[tid];
  });
  // money trades that have fully elapsed
  LG().moneyTrades = (LG().moneyTrades || []).filter(mt => (mt.startYear + (mt.years||1) - 1) > yr);
  // record advance + set the new explicit season year
  LG().seasonApplied = yr;
  LG().seasonYear = yr + 1;
  logTxn('season', `Season advanced ${yr} → ${yr+1}: ${expired} contract${expired!==1?'s':''} expired, cap now ${fmtMoney(leagueCap())}`);
  save();
  openModal(`<div class="h2">✓ Advanced to ${yr+1}</div>
    <p class="sub mb">${expired} contract${expired!==1?'s':''} expired — those players were released to free agency. Cap is now ${fmtMoney(leagueCap())}.</p>
    ${logs.length?`<div class="card card-tight" style="max-height:40vh;overflow-y:auto"><div class="sub" style="font-size:.7rem;line-height:1.6">${logs.map(esc).join('<br>')}</div></div>`:''}
    <button class="btn btn-block mt" onclick="closeModal();renderActive()">Done</button>
    <button class="btn btn-ghost btn-block mt" onclick="undoSeasonRollover()">↩ Undo — put ${yr} back</button>`);
};

  openModal(`<div class="h2">Raw player inspect</div><div class="spinner"></div>
    <p class="sub" style="text-align:center">Fetching from ESPN…</p>`);

    const raw = await fetchPlayerPool();

    const pl = (entry?.player) || entry;
    if (!pl) { $('modal-body').innerHTML = '<p>No players returned at all.</p>'; return; }

    const withStats = raw.filter(pp => ((pp.player||pp).stats||[]).length > 0).length;

    // full raw JSON of this one player (trimmed of huge sub-objects)
    const slim = JSON.parse(JSON.stringify(pl));
    if (slim.draftRanksByRankType) slim.draftRanksByRankType = '…';
    const fullJson = JSON.stringify(slim, null, 1);

window.scoringDiag = async function() {
  const mapped = LG().playerPool.filter(p => p.mlbId);
  if (!mapped.length) { toast('Map players to MLB first (step 2)', 'err'); return; }
  const pick = mapped.slice().sort((a,b)=>a.adp-b.adp)[0];

  openModal(`<div class="h2">Scoring test</div><div class="spinner"></div>
    <p class="sub" style="text-align:center">Pulling ${esc(pick.name)}'s MLB game log…</p>`);

  try {
    const isPitcher = /SP|RP|P/.test((pick.eligible||[]).join('')) && !/1B|2B|3B|SS|OF|C|DH/.test((pick.eligible||[]).join(''));
    const group = isPitcher ? 'pitching' : 'hitting';
    const log = await mlbGameLog(pick.mlbId, group);
    const recent = log.slice(-10).reverse();

    const logRows = recent.map(g => {
      const pts = gamePoints(g.stat, group);
      const key = group === 'hitting'
        ? `${g.stat.hits||0}H ${g.stat.homeRuns||0}HR ${g.stat.rbi||0}RBI ${g.stat.runs||0}R`
        : `${g.stat.inningsPitched||0}IP ${g.stat.strikeOuts||0}K ${g.stat.earnedRuns||0}ER`;

        <td style="font-size:.72rem">${esc(key)}</td>
        <td class="r num cell-best">${pts}</td></tr>`;
    }).join('');

    const seasonTotal = log.reduce((s,g)=>s+gamePoints(g.stat,group),0);
    const bestGame = log.reduce((m,g)=>Math.max(m,gamePoints(g.stat,group)),0);

    openModal(`

      <div class="sub mb">${group} · ${log.length} games in ${statSeasonNow()}</div>
      <div class="statrow mb">

        <div class="stat"><div class="lbl">Best game</div><div class="val amber">${bestGame.toFixed(1)}</div></div>
        <div class="stat"><div class="lbl">Games</div><div class="val">${log.length}</div></div>

      <div class="divlabel">Last 10 games — your scoring applied</div>
      <div class="card card-tight" style="max-height:280px;overflow-y:auto">

        <tbody>${logRows || '<tr><td colspan="4" class="sub">No games found</td></tr>'}</tbody></table>

      <p class="sub mt" style="font-size:.72rem">Points off? Edit values in Settings → Scoring system.</p>
      <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Close</button>

  } catch(e) {
    openModal(`

function ensureSettings() { if (!LG().settings) LG().settings = {}; }
/* CHANGING LEAGUE TYPE AFTER THE DRAFT.
   Normally the format locks when the draft starts, because switching mid-season
   changes what a roster even means. But a commissioner testing the app needs to
   flip between formats without rebuilding a league, so the lock is a confirmation
   rather than a wall.

   Nothing is deleted on the way through. Contracts, traded picks, keeper choices
   and dead cap all stay exactly where they are — they just stop being SHOWN by
   formats that have no use for them, and come straight back if you switch back.
   That is deliberate: a destructive switch would make the test one-way. */
function leagueTypeSideEffects(t) {
  const cur = LSET().leagueType || 'redraft';
  const out = [];
  if (t === cur) return out;
  if (cur === 'dynasty' && t !== 'dynasty') {
    const picks = Object.keys(LG().draftPicks || {}).length;
    if (picks) out.push(`Traded draft picks stop showing (${picks} year${picks!==1?'s':''} tracked). They are kept, not deleted.`);
    if (RD().enabled) out.push('The rookie draft is a dynasty feature and will be hidden.');
  }
  if (t === 'dynasty' && cur !== 'dynasty') out.push('Draft-pick trading and the rookie draft become available.');
  if (t === 'keeper') out.push(`Keeper selection turns on (${LSET().keeperCount || 3} per team).`);
  if (cur === 'keeper' && t !== 'keeper' && Object.keys(LG().keeperCosts || {}).length) {
    out.push('Keeper selections are kept but stop applying.');
  }
  if (LSET().useSalaryCap) {
    const from = capHeadroom(cur), to = capHeadroom(t);
    if (from !== to) out.push(`The suggested cap multiplier changes from ×${from} to ×${to}. Your league's own cap (${fmtMoney(leagueCap())}) is not touched.`);
    out.push('Salaries, contracts and dead cap all stay on and unchanged.');
  }
  return out;
}

/* rookie draft sequence: uses its own order (or team order if none) + rounds.
   Snake honored. In dynasty leagues each slot consults pick ownership for the
   current season year: penalty-removed picks are SKIPPED and traded picks are
   made by their new owner — so cap penalties and pick trades actually bite. */
function rookieSequence() {
  const order = RD().order?.length ? RD().order : LG().teams.map(t=>t.id);
  const rounds = RD().rounds || 4;
  const year = currentSeasonYear();
  const seq = [];
  for (let r = 0; r < rounds; r++) {
    const ro = (RD().snake && r % 2 === 1) ? [...order].reverse() : order;
    ro.forEach(tid => {
      if (!isDynasty()) { seq.push(tid); return; }
      const round = r + 1;
      if (pickRemoved(year, round, tid)) return;        // lost to an over-cap penalty
      seq.push(pickOwner(year, round, tid));            // traded pick → new owner picks
    });
  }
  return seq;
}
function rookiePickIndex() { return (RD().picks || []).length; }
function rookieCurrentTeam() {
  const seq = rookieSequence(); const idx = rookiePickIndex();
  return idx < seq.length ? seq[idx] : null;
}
function rookieDone() { return rookiePickIndex() >= rookieSequence().length; }
/* pick label: exact "round.slot" if order set, else generic "Pick N" */
function rookiePickLabel(idx) {
  const teams = (RD().order?.length ? RD().order.length : LG().teams.length) || 1;
  const round = Math.floor(idx / teams) + 1;
  const slot = (idx % teams) + 1;
  if (RD().order?.length) return `${round}.${slot}`;        // exact
  return `Pick ${idx + 1}`;                                  // generic
}

let _rookieTimer = null;
let _rookieGuard = -1;
function rookieSecondsLeft() {
  const d = RD();
  if (d.paused || !d.pickStartedAt) return d.secPerPick;
  const elapsed = Math.floor((Date.now() - d.pickStartedAt)/1000);
  return Math.max(0, d.secPerPick - elapsed);
}
window.makeRookiePick = function(espnId, force) {
  if (!RD().live) { toast('Rookie draft is not live', 'err'); return; }
  const team = rookieCurrentTeam();
  if (!team) { finishRookieDraft(); return; }
  const mine = String(team) === String(myTeamId());
  if (!mine && !force) { toast("Not your pick — it's " + (teamById(team).name||'another team') + "'s turn", 'err'); return; }
  commitRookiePick(espnId, team);
};
function commitRookiePick(espnId, team) {
  ensureRD();
  if (!team) return;
  const taken = new Set((RD().picks||[]).map(p => String(p.playerId)));
  const rostered = new Set((LG().draft.picks||[]).map(p => String(p.playerId)));
  if (taken.has(String(espnId)) || rostered.has(String(espnId))) return;
  const idx = rookiePickIndex();
  LG().rookieDraft.picks.push({ pick: idx+1, label: rookiePickLabel(idx), teamId: team, playerId: espnId, rookie: true });
  // rosters derive from draft.picks — add the rookie there too so they actually
  // join the team (and can't be re-drafted or added as a free agent)
  const maxPick = (LG().draft.picks||[]).reduce((m,pk)=>Math.max(m,pk.pick||0), 0);
  LG().draft.picks.push({ teamId: team, playerId: espnId, pick: maxPick+1, rookie: true, addedFA: true });
  LG().rookieDraft.pickStartedAt = Date.now();
  _rookieGuard = -1;
  if (rookieDone()) { finishRookieDraft(); return; }
  save();
  syncExtraIfRostered(espnId);
  renderActive();
}
function autoRookiePick() {
  const team = rookieCurrentTeam();
  if (!team) { if (RD().live) finishRookieDraft(); return; }
  const taken = new Set((RD().picks||[]).map(p => String(p.playerId)));
  (LG().draft.picks||[]).forEach(p => taken.add(String(p.playerId)));  // already rostered
  // rookie pool = players flagged rookie if available, else best available by ADP
  const pool = [...LG().playerPool].sort((a,b)=>a.adp-b.adp);
  let pick = pool.find(p => p.isRookie && !taken.has(String(p.espnId)))
          || pool.find(p => !taken.has(String(p.espnId)));
  if (pick) commitRookiePick(pick.espnId, team);
}

/* ============================================================
   LIVE DRAFT ENGINE — snake/linear, timer, auto-pick fills empty slots
   ============================================================ */

/* total rounds = starting slots + bench (everyone fills a full roster) */
function draftRounds() {
  return (activeLineupSlots()?.length || 0) + rosterBenchCount();
}
/* the full pick order across all rounds, honoring snake setting.
   returns an array of teamIds, length = rounds * teams. */
function draftSequence() {
  const order = LG().draft.order || [];
  const rounds = draftRounds();
  const seq = [];
  for (let r = 0; r < rounds; r++) {
    const roundOrder = (LSET().snake && r % 2 === 1) ? [...order].reverse() : order;
    roundOrder.forEach(tid => seq.push(tid));
  }
  return seq;
}
/* whose pick is it right now? index into the sequence = picks already made */
function currentPickIndex() { return LG().draft.picks.length; }
function currentPickTeam() {
  const seq = draftSequence();
  const idx = currentPickIndex();
  return idx < seq.length ? seq[idx] : null;
}
function pickRoundAndSlot(idx) {
  const teams = (LG().draft.order||[]).length || 1;
  return { round: Math.floor(idx / teams) + 1, slotInRound: (idx % teams) + 1 };
}
/* is the draft fully done? */
function draftDone() { return currentPickIndex() >= draftSequence().length; }

window.startLiveDraft = function() {
  if (!(LG().draft.order?.length) || LG().teams.length < 2) { toast('Set the draft order first', 'err'); return; }
  if (LG().draft.complete) { toast('Draft already complete', 'err'); return; }
  LG().draft.started = true;
  LG().draft.live = true;
  LG().draft.paused = false;
  LG().draft.pickStartedAt = Date.now();
  if (!LG().draft.picks) LG().draft.picks = [];
  save();
  toast('Draft room is live', 'ok');
  go('draft');
};

/* make a pick (manual click). enforces turn order. */
window.makeDraftPick = function(espnId, force) {
  if (!LG().draft.live) { toast('Draft is not live', 'err'); return; }
  const team = currentPickTeam();
  if (!team) { finishDraft(); return; }
  const mine = String(team) === String(myTeamId());
  // Turn order is enforced for EVERYONE, including the commissioner. The only way
  // to pick for another team is the explicit "Force pick" button (force === true).
  if (!mine && !force) { toast("Not your pick — it's " + (teamById(team).name||'another team') + "'s turn", 'err'); return; }
  commitPick(espnId, team);
};

/* commit a pick for a team — shared by manual + auto. No turn check here. */
function commitPick(espnId, team) {
  if (!team) return;
  const taken = new Set(LG().draft.picks.map(p => String(p.playerId)));
  if (taken.has(String(espnId))) { return; }   // already drafted (sync race) — ignore
  const { round } = pickRoundAndSlot(currentPickIndex());
  LG().draft.picks.push({ pick: currentPickIndex()+1, round, teamId: team, playerId: espnId });
  LG().draft.pickStartedAt = Date.now();   // reset clock for next picker
  _autoPickGuard = -1;                      // allow auto-pick for the new pick index
  if (draftDone()) { finishDraft(); return; }
  save();
  syncExtraIfRostered(espnId);
  renderActive();
}

/* auto-pick: best available that fills an empty roster slot for the team on clock.
   Forced (bypasses turn check) — used on timer expiry for ANY team. */
function autoPickForCurrent() {
  const team = currentPickTeam();
  if (!team) { if (LG().draft.live) finishDraft(); return; }
  const taken = new Set(LG().draft.picks.map(p => String(p.playerId)));
  const myPicks = LG().draft.picks.filter(p => String(p.teamId)===String(team));
  const slots = activeLineupSlots();
  const needPos = {};
  slots.forEach(s => { needPos[s.slot] = (needPos[s.slot]||0)+1; });
  myPicks.forEach(pk => {
    const pl = LG().playerPool.find(x=>String(x.espnId)===String(pk.playerId));
    if (!pl) return;
    const hit = Object.keys(needPos).find(slot => needPos[slot]>0 && slotEligible(slot, pl));
    if (hit) needPos[hit]--;
  });
  const stillNeed = Object.keys(needPos).filter(s => needPos[s] > 0);
  const pool = [...LG().playerPool].sort((a,b)=>a.adp-b.adp);
  let pick = null;
  if (stillNeed.length) {
    pick = pool.find(p => !taken.has(String(p.espnId)) && stillNeed.some(slot => slotEligible(slot, p)));
  }
  if (!pick) pick = pool.find(p => !taken.has(String(p.espnId)));  // fallback: best available
  if (pick) commitPick(pick.espnId, team);
}
/* does a player satisfy a given lineup slot name? */
function slotEligible(slotName, player) {
  const def = activeLineupSlots().find(s => s.slot === slotName);
  const elig = def?.eligible || [slotName];
  return (player.eligible||[]).some(pos => elig.includes(pos));
}

function finishDraft() {
  // KEEPER SAFETY SWEEP: if a keeper's cost round never came up (short draft),
  // they still belong to their team — add them now so no keeper is ever lost.
  const ks = LG().keepers || {};
  for (const tid of Object.keys(ks)) {
    for (const k of ks[tid]) {
      if (!LG().draft.picks.some(p => String(p.playerId)===String(k.espnId))) {
        const maxPick = LG().draft.picks.reduce((m,pk)=>Math.max(m,pk.pick||0), 0);
        LG().draft.picks.push({ teamId: tid, playerId: k.espnId, pick: maxPick+1, keeper: true, addedFA: true });
        logTxn('keeper', `${teamName(tid)} keeper slotted post-draft: ${k.name}`);
      }
    }
  }
  LG().draft.live = false;
  LG().draft.complete = true;
  LG().draft.currentPick = LG().draft.picks.length;
  // THE CAP IS FIXED HERE, once, and then left alone. It is not a live figure that
  // follows rosters around — a cap that moves when you sign someone isn't a cap.
  const setCap = setCapFromDraft();
  save();
  toast('Draft complete!', 'ok');
  if (setCap) toast(`Salary cap set to ${fmtMoney(setCap)}`, 'ok');
  go('teams');
}
window.pauseDraft = function() {
  LG().draft.paused = !LG().draft.paused;

};

/* render a single trade as a card with context-appropriate actions */
function tradeCard(t, mode) {
  const fromT = teamById(t.from), toT = teamById(t.to);
  const fromMoney = (t.money||[]).filter(m=>m.dir==='fromTo');
  const toMoney = (t.money||[]).filter(m=>m.dir==='toFrom');
  const fromAssets = describeAssets(t.fromPlayers, t.fromPicks, fromMoney);
  const toAssets = describeAssets(t.toPlayers, t.toPicks, toMoney);
  let actions = '';
  if (mode === 'incoming') {
    actions = `<div class="row" style="gap:.4rem;margin-top:.5rem">
      <button class="btn btn-sm btn-amber" onclick="acceptTrade('${t.id}')">Accept</button>
      <button class="btn btn-sm btn-ghost" onclick="counterTrade('${t.id}')">Counter</button>
      <button class="btn btn-sm btn-ghost" onclick="rejectTrade('${t.id}')">Reject</button>
    </div>`;
  } else if (mode === 'outgoing') {
    actions = `<button class="btn btn-sm btn-ghost mt" onclick="cancelTrade('${t.id}')">Cancel offer</button>`;
  } else if (mode === 'review') {
    const me = myTeamId();
    const inIt = String(t.from)===String(me) || String(t.to)===String(me);
    const n = Object.keys(t.vetoes || {}).length;
    const mine = !!(t.vetoes || {})[me];
    const commish = window._masterUnlocked || commishUnlocked();
    actions = `
      <div class="sub" style="font-size:.66rem;margin-top:.4rem">
        ${n}/${vetoesNeeded()} objections · processes ${new Date(reviewEndsAt(t)).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}
      </div>
      <div class="row" style="gap:.4rem;margin-top:.4rem;flex-wrap:wrap">
        ${inIt ? '<span class="sub" style="font-size:.66rem">You are in this trade.</span>'
               : `<button class="btn btn-sm ${mine?'btn-amber':'btn-ghost'}" onclick="vetoTrade('${t.id}')">${mine?'✓ Objected':'Object'}</button>`}
        ${commish ? `<button class="btn btn-sm btn-ghost" onclick="forceTradeNow('${t.id}')">Approve now</button>
                     <button class="btn btn-sm btn-ghost" onclick="killTradeNow('${t.id}')">Veto now</button>` : ''}
      </div>`;
  }
  const statusTag = mode==='history'
      ? `<span class="sub" style="font-size:.6rem">${t.status==='vetoed'?'✕ vetoed':'✓ completed'}</span>`
    : mode==='review' ? `<span class="sub amber" style="font-size:.6rem">under review</span>`
    : t.counterOf ? `<span class="sub amber" style="font-size:.6rem">counter</span>` : '';
  return `<div class="card card-tight" style="margin-bottom:.5rem">
    <div class="row-between"><b style="font-size:.82rem">${esc(fromT.name)} ⇄ ${esc(toT.name)}</b>${statusTag}</div>
    <div class="sub" style="font-size:.72rem;margin-top:.3rem">
      <b>${esc(fromT.abbrev||fromT.name)}</b> sends: ${fromAssets || '—'}<br>
      <b>${esc(toT.abbrev||toT.name)}</b> sends: ${toAssets || '—'}
    </div>
    ${actions}
  </div>`;
}
/* human-readable list of players + picks + cash */
function describeAssets(playerIds, picks, money) {
  const parts = [];
  (playerIds||[]).forEach(id => {
    const p = LG().playerPool.find(x => String(x.espnId)===String(id));
    if (p) parts.push(esc(p.name));
  });
  (picks||[]).forEach(pk => parts.push(`${pk.year} R${pk.round} pick`));
  (money||[]).forEach(m => parts.push(`${fmtMoney(m.amount)}${m.years>1?` over ${m.years}yr`:''} cash`));
  return parts.join(', ');
}

/* COUNTER-OFFER.
   A counter is just a new proposal seeded from the one you're answering, with the
   sides swapped — you become the proposer, so what they were sending becomes what
   you're asking for. The original is marked 'countered' when the counter is sent,
   not now, so backing out of the builder leaves the offer live. */
window.counterTrade = function(id) {
  const t = (LG().trades||[]).find(x => x.id===id);
  if (!t || t.status!=='pending') { toast('Trade no longer available', 'err'); return; }
  if (!tradesOpen()) { toast(`Trades are closed (deadline was week ${LSET().tradeDeadlineWeek||20})`, 'err'); return; }
  if (String(t.to)!==String(myTeamId())) { toast('Only the receiving team can counter', 'err'); return; }
  window._trade = {
    to: t.from,
    fromPlayers: (t.toPlayers||[]).slice(),      // what they asked me for, now what I offer
    toPlayers: (t.fromPlayers||[]).slice(),      // what they offered, now what I ask for
    fromPicks: (t.toPicks||[]).slice(),
    toPicks: (t.fromPicks||[]).slice(),
    // cash direction is relative to proposer, and the proposer just changed
    money: (t.money||[]).map(m => ({ ...m, dir: m.dir==='fromTo' ? 'toFrom' : 'fromTo' })),
    counterOf: t.id,
  };
  window._moneyDraft = { dir:'fromTo', years:1, split:[0] };
  renderTradeBuilder();
};

/* THE WHOLE SEASON, NOT JUST THIS WEEK.
   You could step through matchups one week at a time, which is useless for the
   question people actually ask: who do I still have to play, and when is my bye?
   This lays out every week for one team at a glance. */
window.openSeasonSchedule = function(teamId) {
  const tid = teamId || STATE.viewingTeamId || myTeamId() || (LG().teams[0]||{}).id;
  if (!tid) { toast('No teams yet', 'err'); return; }
  const sched = matchupSchedule();
  const rounds = Object.keys(sched).length;
  if (!rounds) { toast('No schedule yet', 'err'); return; }
  const lastWk = Math.max(rounds, (LSET().playoffStartWeek || 23) - 1);
  const now = currentWeekNow();
  let w = 0, l = 0, t = 0;
  const rows = [];
  for (let wk = 1; wk <= lastWk; wk++) {
    const pairs = sched[((wk - 1) % rounds) + 1] || [];
    const pair = pairs.find(([a, b]) => String(a)===String(tid) || String(b)===String(tid));
    if (!pair) continue;
    const oppId = String(pair[0])===String(tid) ? pair[1] : pair[0];
    const bye = oppId === '__BYE__';
    const played = wk < now;
    const mine = teamWeekTotal(tid, wk), theirs = bye ? 0 : teamWeekTotal(oppId, wk);
    let result = '';
    if (played && !bye) {
      if (mine > theirs) { w++; result = '<span style="color:var(--good)">W</span>'; }
      else if (mine < theirs) { l++; result = '<span class="cell-neg">L</span>'; }
      else { t++; result = '<span class="sub">T</span>'; }
    }
    rows.push(`<tr style="${wk===now?'background:var(--amber-bg)':''}">
      <td class="r num" style="font-size:.7rem">${wk}${wk===now?' <span class="sub" style="font-size:.55rem">now</span>':''}</td>
      <td style="font-size:.76rem">${bye ? '<span class="sub">bye week</span>' : esc(teamById(oppId).name)}</td>
      <td class="r num" style="font-size:.72rem">${played && !bye ? `${mine.toFixed(0)}–${theirs.toFixed(0)}` : '<span class="sub">—</span>'}</td>
      <td class="r" style="font-size:.72rem;font-weight:700">${result}</td>
    </tr>`);
  }
  const playoffWk = LSET().playoffStartWeek || 23;
  openModal(`<div class="h2">${esc(teamById(tid).name)} · full schedule</div>
    <p class="sub mb" style="font-size:.7rem">Regular season through week ${playoffWk - 1}. Record so far: <b>${w}-${l}${t?'-'+t:''}</b>.</p>
    <div class="card card-tight" style="max-height:55vh;overflow-y:auto">
      <table class="tbl"><thead><tr><th class="r">Wk</th><th>Opponent</th><th class="r">Score</th><th class="r"></th></tr></thead>
      <tbody>${rows.join('')}</tbody></table>
    </div>
    ${LG().teams.length > 1 ? `<div class="field mt"><label>Another team</label>
      <select class="select" style="width:100%" onchange="openSeasonSchedule(this.value)">
        ${LG().teams.map(x => `<option value="${x.id}" ${String(x.id)===String(tid)?'selected':''}>${esc(x.name)}</option>`).join('')}
      </select></div>` : ''}
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Close</button>`);
};

window.newTradeProposal = function() {

function renderTradeBuilder() {
  const mine = myTeamId();
  const tr = window._trade;
  const others = LG().teams.filter(t => String(t.id)!==String(mine));
  const partnerOpts = others.map(t =>
    `<option value="${t.id}" ${String(tr.to)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('');

  const myRoster = teamRoster(mine);
  const partnerRoster = tr.to ? teamRoster(tr.to) : [];

  const myPlayerRows = myRoster.map(p => {
    const on = tr.fromPlayers.includes(String(p.espnId));
    return `<div class="row-between" style="padding:.25rem 0">
      <span style="font-size:.8rem">${esc(p.name)} <span class="sub" style="font-size:.62rem">${esc((p.eligible||[]).join('/'))}</span></span>
      <button class="btn btn-sm ${on?'btn-amber':'btn-ghost'}" onclick="toggleTradeAsset('from','${p.espnId}')">${on?'✓':'+'}</button>
    </div>`;

/* ---- respond to a trade ---- */
/* TRADE REVIEW.
   We used to move the players the instant the other manager tapped Accept, which
   is how you end up with a lopsided deal that the league only finds out about
   after it's done. ESPN holds an accepted trade for a review window first: anyone
   can object, and enough objections kill it. Set the window to 0 days for a league
   that trusts each other and behaviour goes back to instant.
   Vetoes are counted, never guessed at — a trade needs a real majority of the
   OTHER teams to object, so two annoyed rivals can't undo a fair deal. */
function tradeReviewHours() {
  // Default OFF. ESPN ships a review period on, but turning it on by default here
  // would mean a league already mid-season suddenly finds its trades sitting for a
  // day with no warning. Commissioners switch it on deliberately, and the rulebook
  // states whichever way it is set.
  const d = LSET().tradeReviewDays;
  return Math.max(0, Number(d) || 0) * 24;
}
function vetoesNeeded() {
  const others = Math.max(0, (LG().teams || []).length - 2);   // both traders excluded
  return others > 0 ? Math.floor(others / 2) + 1 : 0;
}
function reviewEndsAt(t) { return (t.acceptedAt || 0) + tradeReviewHours() * 3600 * 1000; }
function reviewOver(t) { return Date.now() >= reviewEndsAt(t); }
function tradesInReview() { return (LG().trades || []).filter(t => t.status === 'review'); }
/* Run any review that has timed out. Called on render, so the queue drains itself
   without anyone having to press a button. */
function settleTradeReviews() {
  let changed = false;
  tradesInReview().forEach(t => {
    if (!reviewOver(t)) return;
    const vetoes = Object.keys(t.vetoes || {}).length;
    if (vetoes >= vetoesNeeded() && vetoesNeeded() > 0) {
      t.status = 'vetoed'; t.resolved = Date.now();
      logTxn('trade', `Trade vetoed by the league: ${teamName(t.from)} ⇄ ${teamName(t.to)} (${vetoes} objections)`);
    } else if (executeTrade(t)) {
      t.status = 'accepted'; t.resolved = Date.now();
      logTxn('trade', `Trade: ${teamName(t.from)} ⇄ ${teamName(t.to)}`);
    } else {
      t.status = 'failed'; t.resolved = Date.now();
      logTxn('trade', `Trade could not be applied: ${teamName(t.from)} ⇄ ${teamName(t.to)}`);
    }
    changed = true;
  });
  if (changed) save();
  return changed;
}
window.vetoTrade = function(id) {
  const t = (LG().trades||[]).find(x => x.id===id);
  const me = myTeamId();
  if (!t || t.status !== 'review') { toast('Not under review', 'err'); return; }
  if (String(t.from)===String(me) || String(t.to)===String(me)) {
    toast('You are in this trade — you cannot object to it', 'err'); return;
  }
  t.vetoes = t.vetoes || {};
  if (t.vetoes[me]) delete t.vetoes[me]; else t.vetoes[me] = Date.now();
  save();
  toast(t.vetoes[me] ? `Objection recorded (${Object.keys(t.vetoes).length}/${vetoesNeeded()})` : 'Objection withdrawn', 'ok');
  openTradeCenter();
};
/* commissioner overrides: push it through now, or kill it now */

  const t = (LG().trades||[]).find(x => x.id===id);

};
window.killTradeNow = function(id) {
  if (!(window._masterUnlocked || commishUnlocked())) { toast('Commissioner only', 'err'); return; }
  const t = (LG().trades||[]).find(x => x.id===id);
  if (!t || t.status !== 'review') return;
  t.status = 'vetoed'; t.resolved = Date.now(); t.forced = true;

  save(); toast('Trade vetoed', 'ok'); openTradeCenter(); renderActive();
};
window.acceptTrade = function(id) {
  const t = (LG().trades||[]).find(x => x.id===id);
  if (!t || t.status!=='pending') { toast('Trade no longer available', 'err'); return; }
  if (!tradesOpen()) { toast(`Trades are closed (deadline was week ${LSET().tradeDeadlineWeek||20})`, 'err'); return; }
  if (String(t.to)!==String(myTeamId())) { toast('Only the receiving team can accept', 'err'); return; }
  t.acceptedAt = Date.now();
  t.vetoes = {};
  if (tradeReviewHours() > 0 && vetoesNeeded() > 0) {
    t.status = 'review';
    logTxn('trade', `Trade accepted, under league review: ${teamName(t.from)} ⇄ ${teamName(t.to)}`);
    save();
    toast(`Accepted — under review until ${new Date(reviewEndsAt(t)).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}`, 'ok');
    openTradeCenter(); renderActive();
    return;
  }
  const ok = executeTrade(t);
  if (!ok) { toast('Trade could not be applied — nothing changed', 'err'); return; }
  t.status = 'accepted'; t.resolved = Date.now();
  logTxn('trade', `Trade: ${teamName(t.from)} ⇄ ${teamName(t.to)}`);
  save();
  toast('Trade accepted!', 'ok');
  openTradeCenter();
  renderActive();
};
window.rejectTrade = function(id) {

window.cancelTrade = function(id) {

  toast('Offer cancelled', 'ok');
  openTradeCenter();
};

/* move players + picks between the two teams. Defensive: validates refs and
   applies atomically; never leaves state half-changed. */
function executeTrade(t) {
  if (!t || !t.from || !t.to) return false;
  const picks = (LG().draft && LG().draft.picks) ? LG().draft.picks : null;
  if (!picks) { console.error('executeTrade: no draft picks array'); return false; }
  // STALE-TRADE GUARD: every offered player must still be on the offering team
  // (they may have been dropped or traded elsewhere since the proposal was sent).
  const owns = (pid, tid) => picks.some(x => String(x.playerId)===String(pid) && String(x.teamId)===String(tid));
  if ((t.fromPlayers||[]).some(pid => !owns(pid, t.from))) return false;
  if ((t.toPlayers||[]).some(pid => !owns(pid, t.to))) return false;
  // ROSTER GUARD: an uneven trade can't push either team over the roster cap
  const nFrom = (t.fromPlayers||[]).length, nTo = (t.toPlayers||[]).length;
  if (rosterActiveCount(t.from) - nFrom + nTo > rosterCap()) return false;
  if (rosterActiveCount(t.to) - nTo + nFrom > rosterCap()) return false;
  // CASH GUARD: every cash consideration must be a positive amount with positive
  // per-year values — negative "cash" would silently shift cap the wrong way
  for (const m of (t.money||[])) {
    if (!(m.amount > 0) || (m.years||1) < 1) return false;
    if (m.perYearList && m.perYearList.some(v => !(v >= 0))) return false;
  }
  // PLAYERS: reassign draft-pick ownership (rosters derive from draft.picks.teamId)
  const reassign = (playerIds, newTeam) => {
    (playerIds||[]).forEach(pid => {
      const pk = picks.find(x => String(x.playerId)===String(pid));
      if (pk) pk.teamId = newTeam;
      // contract (and its future cap hits) follows the player to the new team
      const c = (LG().contracts||{})[String(pid)];
      if (c) c.teamId = newTeam;
      // clear from every team's CURRENT+FUTURE lineups; past weeks keep their record
      Object.keys(LG().lineups || {}).forEach(tid => clearFromLineups(tid, pid));
    });
  };
  try {
    reassign(t.fromPlayers, t.to);
    reassign(t.toPlayers, t.from);
    // PICKS: record ownership transfer per ORIGINAL team:
    // draftPicks[year][round][origTeam] = newOwner (a "from" pick is the sender's own pick)
    LG().draftPicks = LG().draftPicks || {};
    const movePick = (pks, newOwner, origTeam) => {
      (pks||[]).forEach(pk => {
        if (!pk || pk.year==null || pk.round==null) return;
        const dp = LG().draftPicks;
        dp[pk.year] = dp[pk.year] || {};
        if (typeof dp[pk.year][pk.round] !== 'object' || dp[pk.year][pk.round] == null) dp[pk.year][pk.round] = {};
        dp[pk.year][pk.round][String(origTeam)] = newOwner;
      });
    };
    movePick(t.fromPicks, t.to, t.from);
    movePick(t.toPicks, t.from, t.to);
    // MONEY: record each cash consideration. dir 'fromTo' = proposer(t.from) sends to t.to;
    // 'toFrom' = t.to sends to t.from. Store normalized {from,to,amount,years,startYear}.
    if (t.money && t.money.length) {
      LG().moneyTrades = LG().moneyTrades || [];
      t.money.forEach(m => {
        const sender = m.dir === 'fromTo' ? t.from : t.to;
        const receiver = m.dir === 'fromTo' ? t.to : t.from;
        LG().moneyTrades.push({
          from: sender, to: receiver,
          amount: m.amount, years: m.years || 1,
          perYearList: m.perYearList || null,         // uneven split, dollars per year
          startYear: currentSeasonYear(),
        });
      });
    }
    return true;
  } catch(e) {
    console.error('executeTrade failed:', e);
    return false;
  }
}

/* ---- AUTODRAFT — snake, best available by ADP ---- */
window.autodraft = function() {
  if (LG().teams.length < 2) { toast('Need at least 2 teams', 'err'); return; }
  if (!LG().playerPool.length) { toast('No player pool', 'err'); return; }
  const ROUNDS = SP().rosterSize;
  const teamIds = LG().teams.map(t => t.id);
  const picks = [], taken = new Set();
  const pool = [...LG().playerPool].sort((a,b) => a.adp - b.adp); // best ADP first
  let pickNum = 1;
  for (let round = 0; round < ROUNDS; round++) {
    const order = round % 2 === 0 ? teamIds : [...teamIds].reverse();
    for (const teamId of order) {
      const next = pool.find(p => !taken.has(String(p.espnId)));
      if (!next) break;
      taken.add(String(next.espnId));
      picks.push({ pick: pickNum++, round: round+1, teamId, playerId: next.espnId });
    }
  }
  LG().draft = { started:true, complete:true, order:teamIds, picks, currentPick:picks.length, rounds:ROUNDS, type:'auto' };
  save(); toast(`Autodraft complete — ${picks.length} picks`, 'ok'); go('teams');
};

window.wipeDraft = function() {
  LG().draft = { started:false, complete:false, order:[], picks:[], currentPick:0 };
  LG().weekly = {};
  save(); toast('Draft wiped', 'ok'); renderActive();
};

/* ---- SPORT SWITCHER ---- */
window.switchSport = function(key) {
  if (!SPORTS[key]) return;
  // remember the league we're leaving for the CURRENT sport before switching
  STATE.leaguesBySport = STATE.leaguesBySport || {};
  if (STATE.activeLeagueDoc) {
    STATE.leaguesBySport[STATE.sport] = {
      activeLeagueDoc: STATE.activeLeagueDoc,
      memberId: STATE.memberId || null,
      leagueName: LG().leagueName || '',
    };
  }
  STATE.sport = key;
  // each sport has its own idea of the default stat to show — FP/G in basketball,
  // season points in baseball — so don't carry the last sport's choice across
  playerView.ptsWindow = statWindowOptions()[0][0];
  // restore the new sport's league binding (separate league/ID per sport)
  const entry = STATE.leaguesBySport[key];
  if (entry) {
    STATE.activeLeagueDoc = entry.activeLeagueDoc;
    STATE.memberId = entry.memberId;
    if (fbReady) subscribeLeague(STATE.activeLeagueDoc);
  } else {
    STATE.activeLeagueDoc = null;
    STATE.memberId = null;
    if (_leagueUnsub) { try { _leagueUnsub(); } catch(e){} _leagueUnsub = null; }
  }
  playerView.search = ''; playerView.posFilter = 'ALL'; playerView.sort = 'seasonPts'; playerView.dir = -1;
  saveLocal();
  toast(`Switched to ${SPORTS[key].label}`, 'ok');
  go('home');
};

   GLOBAL HANDLER EXPOSURE
   This file runs as <script type="module">, so its top-level functions are
   module-scoped, NOT global. Inline HTML handlers (onclick="foo()") are
   evaluated against the GLOBAL scope, so any function reached from markup
   must be published on window or the click silently throws ReferenceError
   and the button does nothing.
   Most handlers are declared as `window.foo = function` already; these are
   plain declarations that are also referenced from markup, so they are
   published here. tests/ audits this automatically — see the inline-handler
   check in tests/sim.js.
   ============================================================ */

   ============================================================ */
/* Read a shared league link like  ...#league=68261  so opening the link
   auto-joins that league. Approvals load from Firebase a moment after boot,
   so we stash the requested ID and the master-load handler completes the join. */
/* ============================================================
   LEAGUE URLs — every league lives at its own name-based page:
     #my-dynasty-league            ← the league's name, slugified
     #my-dynasty-league-12345      ← disambiguated when two leagues share a name
     #league=12345                 ← legacy ID links, still honored forever
   Resolution is by slug against the approvals list; the 5-digit ID remains the
   real identity, so a slug is only ever a friendly alias for one.
   ============================================================ */
/* the Firestore doc a league id actually points at (migrated leagues keep their
   original doc, so never assume 'league_'+id) */
function leagueDocFor(id) {
  return (STATE.approvals || {})[id]?.leagueDocId || ('league_' + id);
}
function leagueSlug(id) {
  const a = (STATE.approvals || {})[id];
  const base = normLeague(a?.leagueName || '') || ('league-' + id);
  // if another approved league slugifies the same way, suffix with the ID
  // aliases of the same underlying league (e.g. a migrated text key + its new 5-digit
  // id) are the SAME league, not a name collision
  const myDoc = leagueDocFor(id);
  const clash = Object.keys(STATE.approvals || {}).some(other =>
    String(other) !== String(id) &&
    leagueDocFor(other) !== myDoc &&
    (normLeague(STATE.approvals[other]?.leagueName || '') || ('league-' + other)) === base);
  return clash ? `${base}-${id}` : base;
}
/* slug (or raw id) -> league id, or null. Accepts a trailing -12345 disambiguator. */
function leagueIdFromHash(h) {
  if (!h) return null;
  const params = new URLSearchParams(h);
  const legacy = params.get('league');                 // #league=12345
  if (legacy && /^\d{5}$/.test(legacy)) return legacy;
  const raw = String(h).replace(/^#/, '').trim();
  if (!raw || raw.includes('=')) return null;
  const appr = STATE.approvals || {};
  if (/^\d{5}$/.test(raw) && appr[raw]) return raw;    // #12345 (only if it exists,
                                                       // so a league NAMED "12345" still resolves below)
  // exact slug match on current names
  for (const id of Object.keys(appr)) {
    if (leagueSlug(id) === raw) return id;
  }
  // A "<slug>-<id>" form whose ID exists. This is what keeps a shared link alive after
  // a rename, and it is safe because exact-slug matching above already took precedence:
  // we only fall back to the embedded id when no league currently claims this slug.
  const m = raw.match(/^(.*)-(\d{5})$/);
  if (m && appr[m[2]]) return m[2];
  if (/^\d{5}$/.test(raw)) return raw;                 // unknown 5-digit id → let the join path report it
  // bare name match ignoring any disambiguator, when unambiguous
  const hits = Object.keys(appr).filter(id => normLeague(appr[id]?.leagueName || '') === raw);
  if (hits.length === 1) return hits[0];
  return null;
}
function readDeepLink() {
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    const id = leagueIdFromHash(h);
    if (id) { window._pendingDeepLink = id; return; }
    // approvals may not have loaded yet — remember the raw slug and retry after sync
    window._pendingSlug = h;
  } catch(e) {}
}
/* Try to complete a pending deep-link join (called after approvals arrive). */
function tryDeepLinkJoin() {
  // a slug link parked before approvals loaded → resolve it now that they have
  if (!window._pendingDeepLink && window._pendingSlug) {
    const resolved = leagueIdFromHash(window._pendingSlug);
    if (resolved) { window._pendingDeepLink = resolved; window._pendingSlug = null; }
    else if (STATE._loaded) {
      window._pendingSlug = null;
      setLeagueHash(null);
      toast('League not found — check the invite link', 'err');
      showGate('landing');
      return;
    } else return;   // still waiting on master
  }
  const id = window._pendingDeepLink;
  if (!id) return;
  if (!STATE.approvals || !STATE.approvals[id]) {
    // approvals may simply not have loaded yet — but if the master HAS loaded and
    // the ID still isn't there, this link points at a league that doesn't exist.
    if (STATE._loaded) {
      window._pendingDeepLink = null;
      setLeagueHash(null);
      toast(`League ${id} not found — check the invite link`, 'err');
      showGate('landing');
    }
    return;
  }
  window._pendingDeepLink = null;
  // already in this exact league? just clear the gate.
  if (STATE.activeLeagueDoc === leagueDocFor(id)) { hideGate(); return; }
  joinLeagueById(id, { silent: false });
}
// initFirebase() runs loadLocal() synchronously before its first await, so the cached
// league directory is in place; reading the deep link AFTER it lets a name-based #slug
// resolve immediately (and offline) instead of parking until the master doc arrives.
initFirebase();
readDeepLink();
go('home');
if (!fbReady) setTimeout(() => { if (!STATE._loaded) renderActive(); }, 300);

/* background league ops: waiver processing + game-issue audit (throttled).
   Runs on whichever device is open — idempotent, safe to run everywhere. */
setInterval(() => {
  if (!STATE.activeLeagueDoc) return;
  try { processWaivers(); } catch(e) {}
  const _n = Date.now();
  if (!window._lastAudit || _n - window._lastAudit > 5*60*1000) {
    window._lastAudit = _n;
    try { auditGameIssues(); } catch(e) {}
  }
}, 60*1000);
setTimeout(() => { if (STATE.activeLeagueDoc) { try { processWaivers(); auditGameIssues(); } catch(e) {} } }, 4000);

/* URL IS THE SOURCE OF TRUTH.
   - #league=<id>  → open that league (auto-join, hash persists on refresh)
   - bare URL      → the master hub / landing (create & manage leagues)
   A previously-joined league in localStorage does NOT override the URL: if the
   URL is bare, we show the hub even if this device joined a league before. */
if (window._pendingDeepLink || window._pendingSlug) {
  // A league URL — seed a hub entry underneath so the back button returns to the
  // hub even when someone opens the league link cold (no prior hub view).
  seedHubHistory();
  const wantDoc = window._pendingDeepLink ? leagueDocFor(window._pendingDeepLink) : null;
  if (!wantDoc || STATE.activeLeagueDoc !== wantDoc) {
    // not already in it — clear any other league binding and join fresh
    showGate('landing');
    setTimeout(tryDeepLinkJoin, 300);
    setTimeout(tryDeepLinkJoin, 900);
    setTimeout(tryDeepLinkJoin, 2000);
    setTimeout(tryDeepLinkJoin, 3500);
  } else {
    // already in this league (refresh case) — just show it, keep the hash
    window._pendingDeepLink = null;
    hideGate();
  }
} else {
  // BARE URL → master hub. Do not auto-open a previously joined league.
  // Mark this history entry as the hub so back/forward routing is unambiguous.
  try { history.replaceState({ hub: true }, '', location.pathname + location.search); } catch(e) {}
  showGate('landing');
}

/* Safety re-check: if we ended up with no league and the gate isn't up (and master
   isn't unlocked), show the hub. */
setTimeout(() => {
  if (!window._pendingDeepLink && !window._pendingSlug && gateNeeded() && !window._masterUnlocked
      && $('gate')?.style.display === 'none') {
    showGate('landing');
  }
}, 500);

/* Keep the URL in sync when the user navigates between leagues via the app
   (switcher, leave, join). Writing the hash makes each league bookmarkable. */
/* Central URL→view router. Reads the current hash and shows the right thing:
   a league (if #league=<id>) or the hub (bare URL). Used by both the back/forward
   buttons (popstate) and manual hash edits (hashchange). */
function routeFromUrl() {
  if (window._suppressHash) return;   // we changed the URL ourselves; ignore the echo
  const h = (location.hash || '').replace(/^#/, '');
  const id = leagueIdFromHash(h);
  if (!id && h) {
    // a slug we can't resolve yet (approvals still syncing) — wait for master
    if (!STATE._loaded) { window._pendingSlug = h; return; }
    window._pendingSlug = null;
    toast('League not found — check the invite link', 'err');
    showGate('landing');
    return;
  }
  if (id) {
    // going to a league URL
    const wantDoc = leagueDocFor(id);
    if (STATE.activeLeagueDoc === wantDoc) {
      hideGate();                    // already in it (e.g. forward button) → just show it
    } else {
      window._pendingDeepLink = id;
      tryDeepLinkJoin();             // switch/join into that league
    }
  } else {
    // bare URL → the hub. This is the BACK-from-a-league case. Always show the
    // landing hub, even if this device is bound to a league.
    window._pendingDeepLink = null;
    window._pendingSlug = null;
    window._pausedFor = null;
    showGate('landing');
  }
}
window.addEventListener('popstate', routeFromUrl);   // Safari/Chrome back & forward buttons
window.addEventListener('hashchange', routeFromUrl); // manual URL edits

/* Auto-pull MLB stats on load (once per ~6h) and when a team is chosen.
   Runs silently in the background; refreshes the view when done. */
async function autoPullStats(force) {
  if (!myTeamId()) return;                 // only if user has a team
  const last = LG().lastStatPull || 0;
  const sixHrs = 6*60*60*1000;
  if (!force && (Date.now() - last) < sixHrs) return;  // recently pulled
  const roster = teamRoster(myTeamId()).filter(p => p.mlbId);
  if (!roster.length) return;
  LG().gameLogs = LG().gameLogs || {};
  for (const p of roster) {
    try {
      const isPitcher = /SP|RP/.test((p.eligible||[]).join('')) && !/1B|2B|3B|SS|OF|C|DH/.test((p.eligible||[]).join(''));
      const grp = isPitcher ? 'pitching' : 'hitting';
      const log = await mlbGameLog(p.mlbId, grp);
      const mapped = log.map(g => ({...g, group: grp}));
      LG().gameLogs[p.mlbId] = mapped;
      applyPointFields(p, mapped);  // compute point fields (incl. bestAvg)
    } catch(e) {}
    await new Promise(r=>setTimeout(r,50));
  }
  LG().lastStatPull = Date.now();
  if (STATE.activeLeagueDoc) saveLeague({silent:true}); else saveLocal();
  renderActive();
  // background: resolve team ids + injuries + schedule (non-blocking for the grid)
  refreshTeamMeta();
  // also compute points for the rest of the pool (top players + free agents) in the
  // background, so the Players page is populated without a manual "Load points" tap.
  computePoolPoints(false).then(() => renderActive()).catch(()=>{});
}

/* resolve each rostered player's MLB team id + current injury status, then
   fetch this week's schedule so the lookahead can show opponents/probables.
   Injury status here is the LIVE source (updates when a player returns). */
async function refreshTeamMeta() {
  if (!myTeamId()) return;
  const roster = teamRoster(myTeamId()).filter(p => p.mlbId);
  // batch people lookup for team id + injury status
  if (roster.length) {
    try {
      const ids = roster.map(p => p.mlbId).join(',');
      const res = await fetch(`${MLB}/people?personIds=${ids}&hydrate=currentTeam`);
      if (res.ok) {
        const data = await res.json();
        const byId = {}; (data.people||[]).forEach(person => byId[person.id] = person);
        LG().playerPool.forEach(pl => {
          const person = byId[pl.mlbId];
          if (person) {
            pl.mlbTeamId = person.currentTeam?.id || pl.mlbTeamId;
            // NOTE: do NOT clear pl.injured here. MLB's person.active means "not retired",
            // not "healthy" — injured players are still active, so this would wrongly wipe
            // the IL tag from nearly everyone. Injury status comes from the ESPN pool pull.
          }
        });
      }
    } catch(e) {}
  }
  // fetch schedule for the viewed week (so opponents/probables show)
  try { await getWeekSchedule(activeWeek()); } catch(e) {}
  if (STATE.activeLeagueDoc) saveLeague({silent:true}); else saveLocal();
  renderActive();
}
// kick off shortly after load
setTimeout(() => autoPullStats(false), 800);
// ALWAYS resolve team meta + schedule on load (independent of the stat-pull 6h guard),
// so upcoming opponents and probable starters appear even when stats are already cached.
setTimeout(() => { if (myTeamId()) refreshTeamMeta(); }, 1200);
// ALWAYS compute pool points on load, independent of autoPullStats' guards, so the
// Players page is populated automatically. Reuses cached logs so it's cheap on refresh.
setTimeout(() => {
  if (LG().playerPool.some(p => p.mlbId)) {
    computePoolPoints(false).then(() => renderActive()).catch(()=>{});
  }
}, 1500);
// re-run when the league doc first syncs in (pool may arrive after boot)
let _pooledOnce = false;
function ensurePoolPoints() {
  if (_pooledOnce) return;
  if (LG().playerPool.some(p => p.mlbId) && !LG().playerPool.some(p => p.ptsSeason != null)) {
    _pooledOnce = true;
    computePoolPoints(false).then(() => renderActive()).catch(()=>{ _pooledOnce = false; });
  }
}
</script>
