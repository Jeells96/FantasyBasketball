   2031, so projecting it forward would understate real future commitments. */
/* The injury badge, in one place. IL means an actual IL/DL/Out status; day-to-day
   gets a quieter tag because those players are usually still in the lineup. */
function injuryBadge(p) {
  if (p && p.injured) {
    return `<span class="il-badge" title="${esc(p.injuryStatus || 'On the injured list')}${p.injuryDetail?` — ${esc(p.injuryDetail)}`:''}">IL</span>`;
  }
  if (p && p.dtd) {
    return `<span class="il-badge" style="background:var(--field-3);color:var(--sage-dim)" title="${esc(p.injuryStatus || 'Day to day')}${p.injuryDetail?` — ${esc(p.injuryDetail)}`:''}">DTD</span>`;
  }
  return '';
}
function irDiscountRate() {
  const d = Number(SALCFG().irDiscount);
  return (d >= 0 && d <= 1) ? d : 1;
}
function irRelief(teamId, p, year) {
  if (year !== currentSeasonYear()) return 1;
  if (!teamId || !isOnIR(p.espnId, teamId)) return 1;
  return irDiscountRate();
}
/* a player's cap hit AS CHARGED TO A TEAM (IL relief applied) */
function teamPlayerCapHit(teamId, p, year) {
  year = year || currentSeasonYear();
  return Math.round((playerCapHit(p, year) || 0) * irRelief(teamId, p, year));
}

/* sum a team's cap hit for a season year, including dead-cap + money-trade effects */
function teamSalaryTotal(teamId, year) {
  year = year || currentSeasonYear();
  let total = 0;
  teamRoster(teamId).forEach(p => { total += teamPlayerCapHit(teamId, p, year); });
  // dead-cap hits charged to this team for this year
  ((LG().deadCap || {})[teamId] || []).forEach(d => { if (d.year === year) total += d.amount; });
  // money traded: receiving cash reduces cap, sending cash increases it (for that year)
  (LG().moneyTrades || []).forEach(mt => {
    const yrs = mt.years || 1, start = mt.startYear || year;
    if (year >= start && year < start + yrs) {
      const idx = year - start;
      const per = mt.perYearList ? (mt.perYearList[idx]||0) : (mt.perYear != null ? mt.perYear : Math.round(mt.amount / yrs));
      if (String(mt.to) === String(teamId)) total -= per;
      if (String(mt.from) === String(teamId)) total += per;
    }
  });
  return total;
}
/* over-cap penalty (picks lost) for a team, per the tier table */
function teamCapPenalty(teamId, year) {
  const cap = leagueCap();
  const spent = teamSalaryTotal(teamId, year);
  if (spent <= cap) return { overPct:0, picks:0, over:0 };
  const over = spent - cap;
  const overPct = (over / cap) * 100;
  const tier = SALCFG().penaltyTiers.find(t => overPct <= t.maxPct) || { picks:3 };
  return { overPct: Math.round(overPct*10)/10, picks: tier.picks, over };
}
/* dead-cap hit if you drop a player NOW = 2x their current-year escalated salary */
function dropDeadCap(p) {
  const c = playerContract(p);
  if (!c) return 0;                                     // unsigned = no dead cap
  const raw = SALCFG().dropPenalty;
  // 0 is a legitimate setting (no dead cap at all) — only a missing/garbage value
  // falls back to the default, so `|| 2` would be wrong here.
  const mult = (raw == null || isNaN(raw)) ? 2 : Math.max(0, Number(raw));
  return mult * contractSalaryForYear(c, currentSeasonYear());
}

/* ===== PICK OWNERSHIP for penalties =====
   draftPicks[year][round] = teamId records picks whose ownership CHANGED via trade.
   A team's own pick is implicit unless that slot points to someone else.
   removedPicks[year][round] = true marks a pick wiped by a penalty (no longer exists). */
function pickOwner(year, round, originalTeamId) {
  // who owns originalTeamId's pick at (year, round)?
  // Stored per ORIGINAL team: draftPicks[year][round][origTeamId] = newOwner —
  // two teams trading away the same year/round must not clobber each other.
  const slot = (LG().draftPicks||{})[year]?.[round];
  if (slot == null) return originalTeamId;
  if (typeof slot === 'object') {
    const moved = slot[String(originalTeamId)];
    return moved != null ? moved : originalTeamId;
  }
  return slot;   // legacy single-owner record (pre per-team tracking)
}
function pickRemoved(year, round, teamId) {
  const rm = (LG().removedPicks||{});
  return !!(rm[year] && rm[year][round] && rm[year][round][teamId]);
}
/* HOW FAR A FORFEIT IS ALLOWED TO ROLL.
   Two rules, and both matter:

   1. SAME ROUND ONLY. A 4th-rounder is not payment for a forfeited 1st. Taking a
      different round is not a lighter penalty, it is a different penalty, and it
      lets the tiers ("21% over = 3 picks") mean whatever the team's leftovers
      happen to be worth.
   2. WITHIN A YEAR. A punishment several drafts out is not a punishment — it lands
      on a roster that may not resemble the one that broke the rule, and everyone
      has forgotten by then. If the next draft's pick of that round is already gone,
      the forfeit takes the following year's, and that is as far as it goes.

   When neither is available the penalty does not shrink and it does not vanish —
   it converts to dead cap. See chargeUnpayablePenalty(). */
const PENALTY_ROLL_YEARS = 1;   // next draft, or the one after it. That is all.
/* Which year this team pays a round-`round` forfeit from, or null if they cannot.
   `taken` optionally guards against counting the same pick twice in a preview. */
function penaltyPickYear(teamId, round, startYear, taken) {
  for (let y = startYear; y <= startYear + PENALTY_ROLL_YEARS; y++) {
    if (taken && taken.has(y + ':' + round)) continue;
    if (pickRemoved(y, round, teamId)) continue;            // already gone
    // A penalty can NEVER touch a pick the team traded away — the receiver acquired
    // it in good faith and keeps it exactly as-is.
    if (String(pickOwner(y, round, teamId)) !== String(teamId)) continue;
    return y;
  }
  return null;
}
/* Apply ONE pick-removal penalty to a team for a given round. Returns false if they
   have no pick of that round inside the window, in which case the caller charges it
   as dead cap instead. */
function removeOnePick(teamId, round, startYear, log) {
  const y = penaltyPickYear(teamId, round, startYear);
  if (y == null) {
    log && log(`${teamById(teamId).name}: no R${round} pick in ${startYear}–${startYear + PENALTY_ROLL_YEARS} left to take — charged as dead cap instead`);
    return false;
  }
  if (y !== startYear) {
    log && log(`${teamById(teamId).name}: ${startYear} R${round} is already gone — the forfeit falls on ${y} R${round}`);
  }
  LG().removedPicks = LG().removedPicks || {};
  LG().removedPicks[y] = LG().removedPicks[y] || {};
  LG().removedPicks[y][round] = LG().removedPicks[y][round] || {};
  LG().removedPicks[y][round][teamId] = true;
  log && log(`${teamById(teamId).name}: lost their ${y} R${round} pick (penalty)`);
  return true;
}
/* THE MONEY IS NOT AN ALTERNATIVE TO THE PICKS — IT IS THE OTHER HALF.
   Going over the cap costs you the picks the tiers name AND the amount you went
   over by, charged as dead cap the next season. Both, every time.

   Picks alone punish only teams that still have picks: a team that had already sold
   its future could blow past the cap for nothing, which turns "sell the future" into
   a way to buy the present with nothing down. Money alone is just a delayed
   instalment plan on the players you already got to play. Together, the overage is
   taken back and the tier still means what it says.

   The cash half always lands, whether or not any pick was available to take. It hits
   the team that did it, never the innocent team holding their traded pick. */
function chargeOverCapPenalty(teamId, year, overBy, log) {
  if (!(overBy > 0)) return;
  LG().deadCap = LG().deadCap || {};
  LG().deadCap[teamId] = LG().deadCap[teamId] || [];
  LG().deadCap[teamId].push({ playerId: null, amount: overBy, year: year + 1,
                              name: `${year} over-cap penalty (${fmtMoney(overBy)} over)` });
  log && log(`${teamById(teamId).name}: ${fmtMoney(overBy)} over the ${year} cap — charged as dead cap in ${year + 1}, on top of the picks`);
}
function fmtMoney(n) {
  if (n == null) return '—';
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n >= 1000000) s = '$' + (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  else if (n >= 1000) s = '$' + (n/1000).toFixed(0) + 'K';
  else s = '$' + n;
  return neg ? '-' + s : s;
}

/* ============================================================
   ESPN API — player pool ONLY (no league ID needed; the /players
   endpoint is global per game+season, not league-scoped)
   ============================================================ */

/* Pull the full draftable player pool from ESPN's player info endpoint */
async function fetchPlayerPool(logFn) {
  logFn?.('Fetching ESPN player pool…', 'run');
  const statSeason = SP().statSeason;
  const url = `https://lm-api-reads.fantasy.espn.com/apis/v3/games/${SP().espnGame}/seasons/${SP().season}/players?scoringPeriodId=0&view=kona_player_info`;
  // Correct ESPN filter structure:
  //  - filterStatsForTopScoringPeriodIds tells ESPN WHICH stats to attach
  //  - additionalValue carries the season-total key "00<season>" and projected "10<season>"
  //  - sortPercOwned orders by relevance (rostered players first), limit caps the dump
  const filter = {
    players: {
      filterStatsForTopScoringPeriodIds: {
        value: 2,
        additionalValue: [`00${statSeason}`, `10${statSeason}`, `00${SP().season}`, `10${SP().season}`]
      },
      sortPercOwned: { sortPriority: 1, sortAsc: false },
      limit: 600,
      filterRanksForScoringPeriodIds: { value: [0] },
    }
  };
  const res = await fetch(url, { headers: { 'X-Fantasy-Filter': JSON.stringify(filter) } });
  if (!res.ok) throw new Error('ESPN player pool HTTP ' + res.status);
  const data = await res.json();
  const players = Array.isArray(data) ? data : (data.players || []);
  logFn?.(`Got ${players.length} players from ESPN`, 'ok');
  if (players.length) window._lastRawPlayer = players[0];
  return players;
}

/* INJURY STATUS GOES STALE, SO REFRESH IT ON ITS OWN.
   p.injured was a snapshot taken whenever the player pool was last pulled, and a
   pool pull is a manual master action — so a player who came off the IL in July
   could still be wearing an IL badge in October.

   The pool endpoint is not an option for this: ESPN ignores its limit filter and
   returns every player in the league, about 190MB. The league-wide injury report
   is the right source — a couple of megabytes, sent with
   access-control-allow-origin *, and it lists ONLY the players actually hurt.
   Anyone absent from it is healthy, which is exactly the fact we were missing. It
   carries no player ids, so entries match on normalised name, the same way the
   salary database already does. */
const IL_REFRESH_MS = 6 * 3600 * 1000;
const SCHED_TTL_MS = 3 * 3600 * 1000;   // probables and start times move during a week
async function fetchInjuryReport(sportKey) {
  const path = (SPORTS[sportKey || STATE.sport] || SPORTS.flb).injuriesPath;
  if (!path) return null;
  const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${path}/injuries`);
  if (!res.ok) throw new Error('ESPN injuries HTTP ' + res.status);
  const data = await res.json();
  const out = {};
  (data.injuries || []).forEach(team => {
    (team.injuries || []).forEach(x => {
      const nm = (x.athlete || {}).displayName;
      if (!nm) return;
      out[normName(nm)] = { status: x.status || '',
                            detail: (x.type || {}).description || x.shortComment || '' };
    });
  });
  return out;
}
/* Which statuses actually merit an IL slot. Day-to-day does not: those players are
   usually still playable, ESPN doesn't allow them on an IL either, and badging them
   as injured is the same wrong answer from the other direction. */
/* PLAYER NEWS.
   Injury STATUS says "Day-To-Day"; news says why and for how long, which is what
   people actually read before benching someone. ESPN's per-sport news feed is small
   (~10KB) and CORS-open, so it is fetched once per hour for the whole league and
   matched to players by name.

   Why name-matching and not ?athlete=: probing the athlete parameter returned the
   same articles as the unfiltered call, i.e. it does not filter. Matching headlines
   ourselves is less elegant but actually works, and one fetch covers every player
   rather than one request per card. */
const NEWS_TTL_MS = 60 * 60 * 1000;
let _newsCache = { sport: null, at: 0, items: [] };
async function fetchLeagueNews(sportKey) {
  const path = (SPORTS[sportKey || STATE.sport] || SPORTS.flb).injuriesPath;
  if (!path) return [];
  const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${path}/news?limit=50`);
  if (!res.ok) throw new Error('ESPN news HTTP ' + res.status);
  const data = await res.json();
  return (data.articles || []).map(a => ({
    headline: a.headline || '',
    blurb: a.description || '',
    published: a.published || '',
    link: (a.links?.web?.href) || '',
    // ESPN tags most stories with the athletes they concern; when present this is
    // far more reliable than reading the headline
    athleteIds: (a.categories || []).filter(c => c.type === 'athlete')
      .map(c => String(c.athleteId ?? c.id ?? '')).filter(Boolean),
  }));
}
function ensureNews() {
  const sport = STATE.sport;
  if (_newsCache.sport === sport && Date.now() - _newsCache.at < NEWS_TTL_MS) return Promise.resolve(_newsCache.items);
  return fetchLeagueNews(sport).then(items => {
    _newsCache = { sport, at: Date.now(), items };
    return items;
  }).catch(() => _newsCache.items || []);
}
/* stories about one player: by ESPN athlete tag first, then by name in the text */
function newsFor(p, items) {
  if (!p || !items?.length) return [];
  const id = String(p.espnId);
  const tagged = items.filter(a => a.athleteIds.includes(id));
  if (tagged.length) return tagged.slice(0, 3);
  const n = normName(p.name);
  const last = normName(lastNameOf(p.name));
  return items.filter(a => {
    const hay = normName(`${a.headline} ${a.blurb}`);
    return n && (hay.includes(n) || (last.length > 3 && hay.includes(last)));
  }).slice(0, 3);
}
function isIlStatus(status) { return /IL|\bDL\b|^out$/i.test(String(status || '')); }
function isDayToDay(status) { return /day-?to-?day/i.test(String(status || '')); }
window.refreshInjuries = async function(opts = {}) {
  const pool = LG().playerPool || [];
  if (!pool.length) return false;
  let report;
  try { report = await fetchInjuryReport(STATE.sport); }
  catch (e) {
    // A failed fetch must never clear anyone's status — silence beats wrong data.
    if (!opts.silent) toast('Could not reach the injury report', 'err');
    return false;
  }
  if (!report) return false;
  let changed = 0;
  pool.forEach(p => {
    const rec = report[normName(p.name)] || null;
    const nowInjured = !!rec && isIlStatus(rec.status);
    const nowDtd = !!rec && isDayToDay(rec.status);
    if (!!p.injured !== nowInjured || !!p.dtd !== nowDtd) changed++;
    p.injured = nowInjured;
    p.dtd = nowDtd;
    p.injuryStatus = rec ? rec.status : null;
    p.injuryDetail = rec ? rec.detail : null;
  });
  LG().injuriesCheckedAt = Date.now();
  if (STATE.activeLeagueDoc) saveLeague({ silent: true }); else saveLocal();
  if (!opts.silent) toast(changed ? `${changed} injury status${changed!==1?'es':''} updated` : 'Injury report is up to date', 'ok');
  return true;
};
let _ilRefreshing = false;
function ensureFreshInjuries() {
  if (_ilRefreshing) return;
  if (!(LG().playerPool || []).length) return;
  if (Date.now() - (LG().injuriesCheckedAt || 0) < IL_REFRESH_MS) return;
  _ilRefreshing = true;
  refreshInjuries({ silent: true })
    .then(ok => { if (ok) renderActive(); })
    .finally(() => { _ilRefreshing = false; });
}
/* Pull a player's season fantasy-point total from ESPN stat splits.
   ESPN stat split `id` is a string like "00<season>" (season total, actual).
   We try the stat season first, then the league season, then any actual split. */
function seasonPointsFromEspn(pl) {
  const stats = pl.stats || [];
  const tryKeys = [`00${SP().statSeason}`, `00${SP().season}`];
  for (const key of tryKeys) {
    const hit = stats.find(s => s.id === key && s.appliedTotal != null);
    if (hit) return Math.round((hit.appliedTotal || 0) * 10) / 10;
  }
  // fallback: any real (non-projected) season-total split with points
  const any = stats.find(s => s.statSourceId === 0 && s.statSplitTypeId === 0 && s.appliedTotal != null)
           || stats.find(s => s.statSourceId === 0 && s.appliedTotal != null);
  return any ? Math.round((any.appliedTotal || 0) * 10) / 10 : 0;
}

/* ESPN fantasy NBA stat IDs → our scoring keys. ESPN packs raw stats into each
   split's `stats` object keyed by these numeric IDs. */
const ESPN_NBA_STATS = {
  '0': 'PTS',   // points
  '6': 'REB',   // total rebounds
  '3': 'AST',   // assists
  '2': 'STL',   // steals
  '1': 'BLK',   // blocks
  '11': 'TO',   // turnovers
  // Verified against the live 2026 payload: id 19 (FG%) came back as exactly
  // 9/19 = 0.47368, which pins 13 = made and 14 = attempted; the free-throw and
  // three-point pairs follow the same ordering.
  '13': 'FGM', '14': 'FGA',
  '15': 'FTM', '16': 'FTA',
  '17': '3PM',
};
/* Compute NBA fantasy points for a player from ESPN raw stat splits, using the
   league's scoring values. Looks at PER-GAME averages so we can show a per-game
   rate, and season totals for the season number. Returns {seasonPts, perGame, games}. */
function nbaPointsFromEspn(pl) {
  const vals = scoringValues();             // {PTS, REB, AST, STL, BLK, TO}
  const stats = pl.stats || [];
  // find the real (non-projected) split for the chosen season; prefer a TOTAL split
  const seasonId = `00${SP().statSeason}`;
  const split = stats.find(s => s.id === seasonId && s.stats)
             || stats.find(s => s.statSourceId === 0 && s.statSplitTypeId === 0 && s.stats)
             || stats.find(s => s.statSourceId === 0 && s.stats);
  if (!split || !split.stats) return { seasonPts: 0, perGame: 0, games: 0 };
  const raw = split.stats;
  let total = 0;
  // NOTE: double/triple-doubles cannot come from a season TOTAL — they are a
  // per-game fact. They are scored from the game logs (see gamePoints/bigCats);
  // this pool figure is a placeholder until those load, and omits them.
  for (const [id, key] of Object.entries(ESPN_NBA_STATS)) {
    const v = raw[id];
    if (v != null && vals[key] != null) total += v * vals[key];
  }
  const games = Number(raw['42']) || 0;     // 42 = games played (never fall back to minutes)
  // per-game: prefer ESPN's own averageStats when present (most reliable), else total/GP
  let perGame = 0;
  if (split.averageStats) {
    for (const [id, key] of Object.entries(ESPN_NBA_STATS)) {
      const v = split.averageStats[id];
      if (v != null && vals[key] != null) perGame += v * vals[key];
    }
  } else if (games > 0) {
    perGame = total / games;
  }
  return {
    seasonPts: Math.round(total * 10) / 10,
    perGame: Math.round(perGame * 10) / 10,
    games,
  };
}

/* ============================================================
   MLB STATS API — the source of truth for game stats
   (runs in browser; not testable from build env but API is stable)
   ============================================================ */
const MLB = 'https://statsapi.mlb.com/api/v1';
/* NBA stats come from ESPN's public site API. Two things make this a clean fit:
   it is keyed by the SAME ESPN athlete id the player pool already stores (so there
   is no id-mapping step at all, unlike baseball), and it sends
   access-control-allow-origin:*, so the browser can call it directly with no key
   and no proxy. */
const NBA_CORE = 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const NBA_WEB  = 'https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba';

/* search MLB for a player by name → returns best mlbId match */
async function mlbLookup(name) {
  const q = encodeURIComponent(name);
  const res = await fetch(`${MLB}/people/search?names=${q}`);
  if (!res.ok) return null;
  const data = await res.json();
  const people = data.people || [];
  if (!people.length) return null;
  const target = normName(name);
  const exact = people.find(p => normName(p.fullName) === target);
  return (exact || people[0]).id;
}

  fba: [
    { id: 'PTS', label: 'Points',        grp: 'stats', mlb: 'points',        def: 1 },
    { id: 'REB', label: 'Rebounds',      grp: 'stats', mlb: 'rebounds',      def: 1 },
    { id: 'AST', label: 'Assists',       grp: 'stats', mlb: 'assists',       def: 1 },
    { id: 'STL', label: 'Steals',        grp: 'stats', mlb: 'steals',        def: 2 },
    { id: 'BLK', label: 'Blocks',        grp: 'stats', mlb: 'blocks',        def: 2 },
    { id: 'TO',  label: 'Turnovers',     grp: 'stats', mlb: 'turnovers',     def: -1 },
    // THE STANDARD SET, ADDED WITH def:0 ON PURPOSE. scoringValues() overlays
    // customScoring on these defaults, so a league that has never touched its
    // scoring inherits whatever we put here — a non-zero default would silently
    // rescore every week already played. Zero changes nothing; the scoring editor
    // has a one-tap "ESPN standard basketball" preset for anyone who wants them.
    { id: '3PM', label: '3-pointers made', grp: 'stats', mlb: 'threesMade',   def: 0 },
    { id: 'FGM', label: 'FG made',         grp: 'stats', mlb: 'fgMade',       def: 0 },
    { id: 'FGA', label: 'FG attempted',    grp: 'stats', mlb: 'fgAtt',        def: 0 },
    { id: 'FTM', label: 'FT made',         grp: 'stats', mlb: 'ftMade',       def: 0 },
    { id: 'FTA', label: 'FT attempted',    grp: 'stats', mlb: 'ftAtt',        def: 0 },
    // derived, not fed: count the categories that reached double figures
    { id: 'DD',  label: 'Double-double',   grp: 'stats', def: 0, derive: (st) => bigCats(st) >= 2 ? 1 : 0 },
    { id: 'TD',  label: 'Triple-double',   grp: 'stats', def: 0, derive: (st) => bigCats(st) >= 3 ? 1 : 0 },
  ],
};
/* how many of the five countable categories reached 10 in one game */
function bigCats(st) {
  if (!st) return 0;
  return [st.points, st.rebounds, st.assists, st.steals, st.blocks]
    .filter(v => (parseFloat(v) || 0) >= 10).length;
}
/* ESPN standard basketball scoring — the preset behind the button in the scoring
   editor. Only the categories it names are set; anything else is left alone. */
const NBA_STANDARD_SCORING = { PTS: 1, REB: 1, AST: 2, STL: 4, BLK: 4, TO: -2, '3PM': 1, DD: 3, TD: 5 };

/* Get the active scoring values: user overrides if set, else defaults. */
function scoringValues() {
  const cat = SCORING_CATALOG[STATE.sport] || SCORING_CATALOG.flb;
  const saved = LG().customScoring || {};
  const out = {};
  cat.forEach(c => { out[c.id] = (saved[c.id] != null) ? saved[c.id] : c.def; });
  return out;
}
function scoringCatalog() { return SCORING_CATALOG[STATE.sport] || SCORING_CATALOG.flb; }

/* The current stat season — league year, rolls over automatically. */
function statSeasonNow() {
  // Which season's game logs to fetch. The manual season picker (a device-level
  // override) wins; then the league's own year — a league that advanced to 2027
  // pulls 2027, that being the whole point of advancing; else the sport default.
  const ov = (STATE.seasonOverride || {})[STATE.sport];
  if (ov && (ov.statSeason || ov.season)) return ov.statSeason || ov.season;
  const lg = LG();
  if (lg && lg.seasonYear) return lg.seasonYear;
  return SP().season;
}


/* Fetch a player's game-by-game log from MLB StatsAPI for the current season.
   Returns [{date, gamePk, opp, stat:{...}}] for both hitting and pitching. */
/* ---- NBA GAME LOG (ESPN, keyed by espnId) ----
   Returns the same shape the MLB log uses, so all downstream scoring
   (gamePoints / playerWeekScore / applyPointFields) works unchanged.
   Games are bucketed by their US-Eastern calendar date — the NBA's own "game day" —
   which is what a fantasy week means, and matches how the MLB feed groups games. */
const NBA_ET_DATE = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
function nbaGameDay(iso) {
  try { return NBA_ET_DATE.format(new Date(iso)); } catch(e) { return String(iso||'').slice(0,10); }
}
/* Which of ESPN's season buckets counts as the fantasy regular season.
   Preseason and postseason obviously don't. ESPN also ships a separate
   "2023-24 Play In Regular Season" bucket, and a plain /regular season/ test
   matched it — quietly folding a play-in game into the 82. */
function isRegularSeasonType(displayName) {
  const n = String(displayName || '');
  return /regular season/i.test(n) && !/play[\s-]?in/i.test(n);
}
async function nbaGameLog(espnId, season) {
  const yr = season || statSeasonNow();
  const res = await fetch(`${NBA_WEB}/athletes/${espnId}/gamelog?season=${yr}`);
  if (!res.ok) throw new Error(`ESPN NBA gameLog HTTP ${res.status}`);
  const data = await res.json();
  const names = data.names || [];               // stat keys, aligned with each event's stats[]
  const idx = {};
  names.forEach((n, i) => { idx[n] = i; });
  const num = (arr, key) => {
    const i = idx[key]; if (i == null) return 0;
    const v = parseFloat(arr[i]); return isNaN(v) ? 0 : v;
  };
  /* "9-19" -> {made:9, att:19} */
  const madeAtt = (arr, key) => {
    const i = idx[key];
    const raw = i == null ? '' : String(arr[i] || '');
    const [m, a] = raw.split('-');
    return { made: parseFloat(m) || 0, att: parseFloat(a) || 0 };
  };
  const meta = data.events || {};
  const out = [];
  // Regular season only — see isRegularSeasonType.
  (data.seasonTypes || [])
    .filter(st => isRegularSeasonType(st.displayName))
    .forEach(st => (st.categories || []).forEach(cat => (cat.events || []).forEach(ev => {
      const m = meta[ev.eventId] || {};
      if (!m.gameDate) return;
      const s = ev.stats || [];
      out.push({
        date: nbaGameDay(m.gameDate),
        gamePk: ev.eventId,
        opp: m.opponent?.abbreviation || '',
        isHome: m.atVs === 'vs',
        teamId: m.team?.id != null ? Number(m.team.id) : null,
        group: 'stats',
        stat: {
          points:    num(s, 'points'),
          rebounds:  num(s, 'totalRebounds'),
          assists:   num(s, 'assists'),
          steals:    num(s, 'steals'),
          blocks:    num(s, 'blocks'),
          turnovers: num(s, 'turnovers'),
          // ESPN ships shooting as one combined "made-attempted" string per column
          // ("9-19"), so each half has to be split back out to be scoreable.
          fgMade:    madeAtt(s, 'fieldGoalsMade-fieldGoalsAttempted').made,
          fgAtt:     madeAtt(s, 'fieldGoalsMade-fieldGoalsAttempted').att,
          threesMade: madeAtt(s, 'threePointFieldGoalsMade-threePointFieldGoalsAttempted').made,
          threesAtt:  madeAtt(s, 'threePointFieldGoalsMade-threePointFieldGoalsAttempted').att,
          ftMade:    madeAtt(s, 'freeThrowsMade-freeThrowsAttempted').made,
          ftAtt:     madeAtt(s, 'freeThrowsMade-freeThrowsAttempted').att,
        },
      });
    })));
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
/* NBA schedule for a date range → same per-date shape as the MLB schedule, so
   per-player locks and the daily matchup grid work for basketball too. */
async function fetchNbaSchedule(startYmd, endYmd) {
  const d = s => String(s).replace(/-/g, '');
  const res = await fetch(`${NBA_CORE}/scoreboard?dates=${d(startYmd)}-${d(endYmd)}&limit=400`);
  if (!res.ok) throw new Error(`ESPN NBA schedule HTTP ${res.status}`);
  const data = await res.json();
  const byDate = {};
  (data.events || []).forEach(ev => {
    const comp = (ev.competitions || [])[0]; if (!comp) return;
    const home = (comp.competitors || []).find(c => c.homeAway === 'home');
    const away = (comp.competitors || []).find(c => c.homeAway === 'away');
    const day = nbaGameDay(ev.date);
    (byDate[day] = byDate[day] || []).push({
      homeId: home?.team?.id != null ? Number(home.team.id) : null,
      awayId: away?.team?.id != null ? Number(away.team.id) : null,
      homeAbbr: home?.team?.abbreviation || '',
      awayAbbr: away?.team?.abbreviation || '',
      homeProb: null, awayProb: null,          // basketball has no probable starters
      time: ev.date || null,                    // ISO start → per-player locks
      status: ev.status?.type?.description || null,
    });
  });
  return byDate;
}

async function mlbGameLog(mlbId, group, season) {
  const yr = season || statSeasonNow();
  const url = `${MLB}/people/${mlbId}/stats?stats=gameLog&season=${yr}&group=${group}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`MLB gameLog HTTP ${res.status}`);
  const data = await res.json();
  const splits = data.stats?.[0]?.splits || [];
  return splits.map(s => ({
    date: s.date,
    gamePk: s.game?.gamePk,
    opp: s.opponent?.abbreviation || s.opponent?.name || '',
    isHome: s.isHome,
    stat: s.stat || {},
  }));
}

/* ============================================================
   SCHEDULE + PROBABLE PITCHERS (for the week lookahead)
   Fetches the MLB schedule for a date range with probable pitchers,
   then lets us answer: for player X on day D, who do they play, and
   (for pitchers) are they the probable starter? Cached per week.
   ============================================================ */
async function fetchSchedule(startYmd, endYmd) {
  // hydrate=probablePitcher gives us the listed starters
  const url = `${MLB}/schedule?sportId=1&startDate=${startYmd}&endDate=${endYmd}&hydrate=probablePitcher,team`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`MLB schedule HTTP ${res.status}`);
  const data = await res.json();
  // flatten into per-date game records keyed by team id
  const byDate = {}; // 'YYYY-MM-DD' -> [{homeId,awayId,homeAbbr,awayAbbr,homeProb,awayProb}]
  (data.dates||[]).forEach(d => {
    const games = (d.games||[]).map(g => ({
      homeId: g.teams?.home?.team?.id, awayId: g.teams?.away?.team?.id,
      homeAbbr: g.teams?.home?.team?.abbreviation, awayAbbr: g.teams?.away?.team?.abbreviation,
      homeProb: g.teams?.home?.probablePitcher?.id, awayProb: g.teams?.away?.probablePitcher?.id,
      // the NAMES too. Keeping only the ids answered "is this player the starter?"
      // but never "who is my hitter facing?", which is the question hitters have.
      // Probables are announced a day or two out, so these are frequently null and
      // every consumer has to cope with that.
      homeProbName: g.teams?.home?.probablePitcher?.fullName || null,
      awayProbName: g.teams?.away?.probablePitcher?.fullName || null,
      time: g.gameDate || null,                       // ISO start time → individual locks
      status: g.status?.detailedState || null,        // Postponed/Cancelled → attention queue
    }));
    byDate[d.date] = games;
  });
  return byDate;
}

/* cache schedule for a fantasy week in LG().scheduleCache[weekKey] */
async function getWeekSchedule(week) {
  if (!FEAT().schedule) return {};           // sport has no live schedule source
  const days = weekDays(week);
  const startYmd = ymd(days[0]), endYmd = ymd(days[days.length-1]);
  const key = `${statSeasonNow()}_${startYmd}_${endYmd}`;
  LG().scheduleCache = LG().scheduleCache || {};
  // A CACHED WEEK GOES STALE. This cache never expired, which was harmless while it
  // only held fixtures — but probable pitchers are announced a day or two ahead, so
  // a week fetched on Monday would show blanks all week however many starters got
  // named. Times and postponements move too. Re-fetch a few hours old.
  const hit = LG().scheduleCache[key];
  const fresh = hit && (Date.now() - (LG().scheduleFetchedAt?.[key] || 0) < SCHED_TTL_MS);
  if (hit && fresh) return hit;
  try {
    const sched = SP().statsApi === 'nba'
      ? await fetchNbaSchedule(startYmd, endYmd)
      : await fetchSchedule(startYmd, endYmd);
    LG().scheduleCache[key] = sched;
    LG().scheduleFetchedAt = LG().scheduleFetchedAt || {};
    LG().scheduleFetchedAt[key] = Date.now();
    return sched;
  } catch(e) { return hit || {}; }   // a failed refresh keeps whatever we had
}

/* For a player on a given calendar date, return {opp, isProbable} or null.
   Needs the player's MLB team id (we resolve it lazily and cache on the player). */
/* "Christian Scott" -> "Scott". A day cell is ~40px wide; a surname is all that fits. */
function lastNameOf(name) {
  const parts = String(name || '').trim().split(/\s+/);
  return parts.length ? parts[parts.length - 1] : '';
}
function playerDayMatchup(player, dateYmd, sched) {
  const teamId = player.mlbTeamId;
  if (!teamId || !sched || !sched[dateYmd]) return null;
  for (const g of sched[dateYmd]) {
    // isProbable = this player is the listed starter (a pitcher's own question).
    // oppProb   = who they are facing (every hitter's question). Null until the
    //             other club names someone, which is usually a day or two out.
    if (g.homeId === teamId) return { opp: 'vs ' + (g.awayAbbr||''), oppAbbr: g.awayAbbr||'',
      isProbable: g.homeProb === player.mlbId,
      oppProb: g.awayProb ? { id: g.awayProb, name: g.awayProbName || '' } : null };
    if (g.awayId === teamId) return { opp: '@ ' + (g.homeAbbr||''), oppAbbr: g.homeAbbr||'',
      isProbable: g.awayProb === player.mlbId,
      oppProb: g.homeProb ? { id: g.homeProb, name: g.homeProbName || '' } : null };
  }
  return null;
}
/* THE GAMES A PLAYER IS SCHEDULED FOR THIS WEEK — the counterpart to
   playerWeekGames(), which counts games already PLAYED (from the logs). Nothing
   counted the fixtures, and "how many times does he play this week" is the whole
   basis of a basketball start/sit and most of a baseball one. Reads the cached
   week schedule, so it is synchronous and safe to call from a render. */
function playerScheduledGames(player, week) {
  if (!player || !player.mlbTeamId) return [];
  const key = `${statSeasonNow()}_${ymd(weekDays(week)[0])}_${ymd(weekDays(week)[weekDays(week).length-1])}`;
  const sched = LG().scheduleCache?.[key];
  if (!sched) return [];
  return weekDays(week).map((d, i) => {
    const dYmd = ymd(d);
    const m = playerDayMatchup(player, dYmd, sched);
    return m ? { ...m, date: dYmd, dayIdx: i } : null;
  }).filter(Boolean);
}
/* {played, total, left} for a player's week. `left` deliberately counts fixtures
   from today forward that have no logged game yet — a game that happened but has
   not landed in the log yet is not "left to play". */
function playerWeekGameCount(player, week) {
  const sched = playerScheduledGames(player, week);
  const logged = new Set((player.mlbId ? playerWeekGames(player.mlbId, week) : []).map(g => g.date));
  const today = ymd(new Date());
  const left = sched.filter(g => g.date >= today && !logged.has(g.date)).length;
  return { played: logged.size, total: sched.length || logged.size, left };
}

/* Convert one game's MLB stat line into points using OUR scoring system.
   Reads the active per-category values (user overrides or defaults). */
function gamePoints(statObj, group) {
  const vals = scoringValues();
  const cat = scoringCatalog();
  let pts = 0;
  for (const c of cat) {
    if (c.grp !== group) continue;          // hitting cats → hitting games only
    const per = vals[c.id];
    if (!per) continue;                      // zero-valued categories skipped
    let val;
    if (c.derive) val = c.derive(statObj);   // computed (singles, etc.)
    else val = statObj[c.mlb];
    if (val == null) continue;
    val = parseFloat(val);
    if (isNaN(val)) continue;
    pts += val * per;
  }
  return Math.round(pts * 100) / 100;
}

/* Per-category breakdown of a game's points (for tap-to-see detail). */
function gameBreakdown(statObj, group) {
  const vals = scoringValues();
  const cat = scoringCatalog();
  const out = [];
  for (const c of cat) {
    if (c.grp !== group) continue;
    const per = vals[c.id];
    if (!per) continue;
    let raw = c.derive ? c.derive(statObj) : statObj[c.mlb];
    if (raw == null) continue;
    raw = parseFloat(raw);
    if (isNaN(raw) || raw === 0) continue;
    out.push({ label: c.label, raw, per, pts: Math.round(raw*per*100)/100 });
  }
  return out;
}

/* ============================================================
   WEEK ↔ DATE LOGIC
   Each week defaults to 7 days starting from the season opener
   Monday. Users can override (a) the opener date and (b) any
   week's duration in days. Weeks after a custom-duration week
   shift automatically, then resume standard 7-day spacing.
   Stored: LG().schedule = { opener: 'YYYY-MM-DD', durations: {week: days} }
   ============================================================ */
const SEASON_OPENERS = {
  // Monday of each season's opening week. Commissioners can override per league.
  flb: { 2025: '2025-03-24', 2026: '2026-03-23', 2027: '2027-03-29' },
  // ESPN labels an NBA season by its ENDING year (2026 = the 2025-26 season)
  fba: { 2025: '2024-10-21', 2026: '2025-10-20', 2027: '2026-10-19' },
};

function seasonOpenerMonday() {
  // user override first
  const custom = LG().schedule?.opener;
  if (custom) return new Date(custom + 'T00:00:00');
  const table = SEASON_OPENERS[STATE.sport] || SEASON_OPENERS.flb;
  // THE LEAGUE'S OWN SEASON YEAR WINS over the sport's pull season. They are
  // different things: SP().season is which year's ADP and stats we fetch, while
  // seasonYear is the season this league is playing. Advancing a league to next
  // year has to move its calendar too, otherwise the weeks keep counting up from
  // the old opener and the league runs off the end of its own schedule.
  const yr = (LG() && LG().seasonYear) || SP().season;
  const fallback = STATE.sport === 'fba' ? `${yr - 1}-10-20` : `${yr}-03-30`;
  const iso = table[yr] || fallback;
  return new Date(iso + 'T00:00:00');
}
/* duration (days) of a given week — custom or default 7 */
function weekDuration(week) {
  const d = LG().schedule?.durations?.[week];
  return (d && d > 0) ? d : 7;
}
/* start date of a week = opener + sum of all prior weeks' durations */
function weekStart(week) {
  const open = seasonOpenerMonday();
  let offset = 0;
  for (let w = 1; w < week; w++) offset += weekDuration(w);
  const start = new Date(open); start.setDate(open.getDate() + offset);
  return start;
}
function weekDateRange(week) {
  const start = weekStart(week);
  const end = new Date(start); end.setDate(start.getDate() + weekDuration(week) - 1);
  return { start, end };
}
function ymd(d) { return d.toISOString().slice(0,10); }
function dayLabel(d) {
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' + (d.getMonth()+1) + '/' + d.getDate();
}
function weekDays(week) {
  const start = weekStart(week);
  const len = weekDuration(week);
  const days = [];
  for (let i=0;i<len;i++) { const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  return days;
}
/* Which fantasy week is "now" — walk weeks until today falls inside one.
   Accounts for custom week durations. Clamped to 1..26. */
function currentWeekNow() {
  const today = new Date(); today.setHours(0,0,0,0);
  for (let w = 1; w <= 26; w++) {
    const { start, end } = weekDateRange(w);
    if (today >= start && today <= end) return w;
    if (today < start) return Math.max(1, w);  // before this week starts
  }
  return 26;
}
/* Has this league's season not started yet? True when today is before week 1 —
   a league sitting between seasons, waiting for the schedule to come round. */
function preseason() {
  const today = new Date(); today.setHours(0,0,0,0);
  return today < weekStart(1);
}
/* ...and the other end: the schedule has run out. */
function seasonOver() {
  const today = new Date(); today.setHours(0,0,0,0);
  return today > weekDateRange(26).end;
}
/* The week the UI should show: explicit viewWeek if set, else computed now. */
function activeWeek() { return LG().viewWeek || currentWeekNow(); }

/* ============================================================
   LINEUP LOCK — lineups lock at 11:00 AM on the Sunday before
   a week begins (i.e. the day before a Monday week start).
   Returns the lock Date for a given week.
   ============================================================ */
const LOCK_HOUR = 11; // 11:00 AM local
function weekLockTime(week) {
  const start = weekStart(week);          // Monday (week start)
  const lock = new Date(start);
  lock.setDate(start.getDate() - 1);      // the Sunday before
  lock.setHours(LOCK_HOUR, 0, 0, 0);
  return lock;
}
function isWeekLocked(week) {
  return new Date() >= weekLockTime(week);
}
/* human countdown string until a week locks, or 'Locked' */
function lockCountdown(week) {
  const ms = weekLockTime(week) - new Date();
  if (ms <= 0) return 'Locked';
  const d = Math.floor(ms/86400000);
  const h = Math.floor((ms%86400000)/3600000);
  const m = Math.floor((ms%3600000)/60000);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function playerWeekGames(mlbId, week) {
  const logs = LG().gameLogs?.[mlbId] || [];
  const days = weekDays(week).map(ymd);
  const out = [];
  logs.forEach(g => {
    const idx = days.indexOf(g.date);
    if (idx >= 0) out.push({ ...g, dayIdx: idx, pts: gamePoints(g.stat, g.group) });
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function playerBestGame(mlbId, week) {
  const games = playerWeekGames(mlbId, week);
  if (!games.length) return null;
  return games.reduce((best,g)=> g.pts > best.pts ? g : best, games[0]);
}

/* ============================================================
   LEAGUE FORMAT ENGINE — scoring modes, individual locks, waivers,
   transactions, playoffs, attention queue, keepers. (v10)
   ============================================================ */
function teamName(id) {
  const t = LG().teams.find(x => String(x.id)===String(id));
  return t ? t.name : 'Team';
}
/* transaction log: newest first, capped */
function logTxn(type, text) {
  LG().transactions = LG().transactions || [];
  LG().transactions.unshift({ ts: Date.now(), type, text });
  if (LG().transactions.length > 200) LG().transactions.length = 200;
}
/* THE LEAGUE RULEBOOK.
   In a contract league the same three questions get asked in the group chat every
   year: what does dropping a signed guy cost, how long can I sign someone, when is
   the deadline. Those answers already exist — they're the league's settings — so
   the house-rules section is GENERATED from them and can never drift out of date.
   The commissioner adds the parts a computer can't know (tiebreakers, punishments,
   dues) as free text, plus a FAQ. */
function rulesDoc() {
  const d = LG().rulesDoc;
  return (d && typeof d === 'object') ? d : { text: '', faq: [], updated: null };
}
function houseRules() {
  const ls = LSET(), c = SALCFG();
  const rows = [
    ['Format', `${ls.leagueType || 'redraft'} · ${LG().teams.length} teams · ${rosterCap()} roster spots`],
    ['Scoring', ls.scoringFormat === 'regular' ? 'every starter game counts' : 'best single game of the week'],
    ['Trade deadline', `week ${ls.tradeDeadlineWeek || 20} — trades and signings both close`],
    ['Trade review', (Number(ls.tradeReviewDays) || 0) > 0
      ? `${ls.tradeReviewDays} day${ls.tradeReviewDays==1?'':'s'} — ${vetoesNeeded()} objection${vetoesNeeded()===1?'':'s'} from the other teams stops a trade`
      : 'none — accepted trades process immediately'],
    ['Acquisition limit', (() => {
      const wk = Number(ls.maxAddsPerWeek) || 0, sn = Number(ls.maxAddsPerSeason) || 0;
      if (!wk && !sn) return 'unlimited adds';
      return [wk ? `${wk} per week` : null, sn ? `${sn} per season` : null].filter(Boolean).join(', ');
    })()],
    ['Waivers', ls.waiverMode === 'faab' ? `FAAB, $${ls.faabBudget || 100} budget` : 'rolling priority'],
    ['Playoffs', `${ls.playoffTeams || 4} teams, starting week ${ls.playoffStartWeek || 21}`],
  ];
  if (ls.useSalaryCap) {
    rows.push(['Salary cap', `${fmtMoney(leagueCap())} this season, ${c.capGrowthPct}%/yr after${ls.capSetFrom?' — fixed at the draft, changed only by the commissioner':''}`]);
    rows.push(['Contracts', `up to ${c.maxTerm} years · year 1 costs ${c.signingDiscount}× AAV, then +${Math.round(c.escalatorGrowth*100)}%/yr`]);
    rows.push(['Minimum salary', `${fmtMoney(c.arbSalary)}${c.arbSalaryDerived ? ' (tracks the imported salary data)' : ''}`]);
    const dp = (c.dropPenalty == null || isNaN(c.dropPenalty)) ? 2 : Number(c.dropPenalty);
    rows.push(['Dropping a signed player', dp > 0
      ? `${dp}× his current salary as dead cap, charged this season`
      : 'no dead cap — the contract is simply voided']);
    if (FEAT().ir) rows.push(['Injured list', irDiscountRate() < 1
      ? `a player on the IL counts ${Math.round(irDiscountRate()*100)}% of his salary, this season only`
      : 'no cap relief — the IL is a roster spot only']);
    const tiers = (c.penaltyTiers || []).map((t, i, a) => {
      const lo = i === 0 ? 1 : a[i-1].maxPct + 1;
      const hi = t.maxPct >= 999 ? 'and up' : `–${t.maxPct}%`;
      return `${lo}${hi} over = ${t.picks} pick${t.picks!==1?'s':''}`;
    }).join(', ');
    rows.push(['Going over the cap', `${tiers}, forfeited at season end (earliest rounds first), AND the amount you went over by charged as dead cap the following season. Both, every time — the picks do not buy off the money`]);
    rows.push(['If you traded that pick away',
      'the team that acquired it keeps it — a penalty never takes a pick out of an innocent team\'s hands. ' +
      'The forfeit falls on your own pick of the same round the following year instead, and no further']);
    rows.push(['If you have no pick of that round in either year',
      'that pick is simply not taken — a pick from a different round is never taken instead, and the penalty is never deferred further out. The money is charged in full regardless, so trading your picks away is not a way to go over the cap for free']);
  }
  return rows;
}
/* Deliberately tiny markdown: escape everything first, then re-introduce only
   headings, bullets, bold and line breaks. Nothing here can inject markup. */
function mdLite(text) {
  return esc(String(text || '')).split('\n').map(line => {
    const l = line.trim();
    if (!l) return '';
    const bold = t => t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    if (/^#{1,3}\s/.test(l)) return `<div class="divlabel" style="margin-top:.6rem">${bold(l.replace(/^#{1,3}\s/, ''))}</div>`;
    if (/^[-*]\s/.test(l)) return `<div style="font-size:.76rem;padding:.12rem 0 .12rem .8rem">• ${bold(l.slice(2))}</div>`;
    return `<p style="font-size:.76rem;margin:.25rem 0">${bold(l)}</p>`;
  }).join('');
}

/* THE ACTIVITY LOG.

const TXN_TYPES = { add:'➕ Adds', drop:'➖ Drops', trade:'⇄ Trades', waiver:'📥 Waivers',
                    keeper:'📌 Keepers', contract:'✎ Contracts', season:'⏭ Season' };

/* is this player a pitcher (for best-game scope)? */
function isPitcherP(p) { return /SP|RP/.test((p.eligible||[]).join(',')); }
/* which scoring mode applies to THIS player in THIS league?
   'best' = single best game of the week; 'sum' = all games accumulate. */
function playerScoreMode(p) {
  const ls = LSET();
  if (ls.scoringFormat !== 'bestGame') return 'sum';
  const sc = ls.bestGameScope || 'all';
  if (sc === 'all') return 'best';
  const pit = isPitcherP(p);
  if (sc === 'pitchersOnly') return pit ? 'best' : 'sum';
  if (sc === 'hittersOnly')  return pit ? 'sum' : 'best';
  return 'best';
}
/* master-entered manual points for a canceled/makeup situation */
function scoreOverrideFor(week, mlbId) {
  if (!mlbId) return null;
  const key = `${STATE.activeLeagueDoc}|${week}|${mlbId}`;
  const v = (STATE.scoreOverrides || {})[key];
  return (v === undefined || v === null) ? null : Number(v);
}
/* a player's weekly score under the league's format (override-aware) */
function playerWeekScore(p, week) {
  const games = p.mlbId ? playerWeekGames(p.mlbId, week) : [];
  const pts = games.map(g => g.pts);
  const ov = scoreOverrideFor(week, p.mlbId);
  if (ov != null) pts.push(ov);          // resolved makeup counts as a game
  if (!pts.length) return 0;
  return playerScoreMode(p) === 'best'
    ? Math.max(...pts)
    : Math.round(pts.reduce((a,b)=>a+b,0)*10)/10;
}

/* ---- INDIVIDUAL LINEUP LOCKS (best-game leagues) ----
   A player locks the moment their first scheduled game of the week starts,
   and stays locked for the rest of the week. PPD games still lock at the
   original scheduled time (lock is purely time-based). Same-timezone rule:
   whoever loads the app computes locks against the schedule clock. */
function schedForWeekSync(week) {
  if (!FEAT().schedule) return null;           // sport has no live schedule source
  const days = weekDays(week);
  const key = `${SP().season}_${ymd(days[0])}_${ymd(days[days.length-1])}`;
  const c = LG().scheduleCache?.[key];
  // Lock checks call this for every player on every render, so a failing fetch must
  // not become a hot retry loop — back off for a minute per week-key after a miss.
  window._schedRetryAt = window._schedRetryAt || {};
  if (!c && !window._schedFetching && (window._schedRetryAt[key] || 0) <= Date.now()) {
    window._schedFetching = true;
    window._schedRetryAt[key] = Date.now() + 60000;
    getWeekSchedule(week)
      .then(()=>{ window._schedFetching=false; renderActive(); })
      .catch(()=>{ window._schedFetching=false; });
  }
  return c || null;
}
/* The START TIME of a player's first scheduled game in a week, or null if unknown.
   Uses the real schedule when we have one; otherwise null (caller falls back). */
function playerFirstGameTime(p, week) {
  const teamId = p && p.mlbTeamId;
  if (!teamId) return null;
  const sched = schedForWeekSync(week);
  if (!sched) return null;
  let first = null;
  for (const d of Object.keys(sched)) {
    for (const g of (sched[d]||[])) {
      if ((g.homeId===teamId || g.awayId===teamId) && g.time) {
        const t = new Date(g.time).getTime();
        if (!isNaN(t) && (first === null || t < first)) first = t;
      }
    }
  }
  return first;
}
/* When does THIS player lock for THIS week? Their first game's start time, or null
   when there is nothing to lock against.
   Policy: if the sport HAS a schedule source, an unknown (schedule still loading, team
   unresolved, or simply no game this week) FAILS OPEN — you can't be locked out by a
   game that isn't happening or hasn't loaded. Only a sport with no schedule at all
   (NBA today) falls back to the start of the week, the one signal available. */
function playerLockTime(p, week) {
  const first = playerFirstGameTime(p, week);
  if (first != null) return first;
  if (FEAT().schedule) return null;              // schedule-backed sport → no known lock
  return weekStart(week).getTime();              // no schedule source → lock at week start
}
/* A player is locked once their own first game of the week has started. Applies to
   every sport and scoring format — you can edit a position until its game begins.
   If a player already has a logged game this week, they are definitively locked. */
function playerLockedForWeek(p, week) {
  if (!p) return false;
  if (week < currentWeekNow()) return true;                // past weeks are history
  if (week > currentWeekNow()) return false;               // future weeks always open
  // a game already played this week → certainly started
  if (p.mlbId && playerWeekGames(p.mlbId, week).length) return true;
  const t = playerLockTime(p, week);
  if (t == null) return false;                   // nothing to lock against → stays editable
  return Date.now() >= t;
}
/* NOTE: there is no separate "drop lock" any more. Dropping is always allowed —
   a player who has already played this week is HELD OVER (see holdoversFor): they
   finish that week in your lineup and the roster spot frees up from the next week. */
/* Countdown until a specific player locks ('Locked' once their game has started) */
function playerLockCountdown(p, week) {
  if (playerLockedForWeek(p, week)) return 'Locked';
  const t = playerLockTime(p, week);
  if (t == null) return 'no game yet';
  const ms = t - Date.now();
  if (ms <= 0) return 'Locked';
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000), m = Math.floor((ms%3600000)/60000);
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

/* ---- WAIVERS ----
   Dropped players sit on waivers for waiverDays. Claims are placed instead of
   instant adds; when the window expires, the winner is decided by the league's
   mode: 'priority' (rolling, worst record first) or 'faab' (highest blind bid,
   season budget). Processing runs on whichever device loads next (idempotent). */
function standingsOrderIds() {
  const rec = computeRecords();
  return LG().teams.map(t=>t.id).sort((a,b) => {
    const ra=rec[a]||{w:0,pf:0}, rb=rec[b]||{w:0,pf:0};
    return (ra.w - rb.w) || (ra.pf - rb.pf);   // worst first
  });
}
function ensureWaiverPriority() {
  let wp = LG().waiverPriority || [];
  const ids = LG().teams.map(t=>String(t.id));
  wp = wp.filter(id => ids.includes(String(id)));
  ids.forEach(id => { if (!wp.some(x=>String(x)===String(id))) wp.push(id); });
  if (!LG().waiverPriority || !LG().waiverPriority.length) wp = standingsOrderIds();
  LG().waiverPriority = wp;
  return wp;
}
function faabLeft(tid) {
  return (LSET().faabBudget||100) - ((LG().faabSpent||{})[tid] || 0);
}
window.openClaimModal = function(espnId) {

window.submitClaim = function(espnId) {

  const tid = myTeamId(); if (!tid) { toast('Claim your team first', 'err'); return; }

  }

window.cancelClaim = function(espnId) {

function processWaivers() {
  const wvs = LG().waivers || {};
  const now = Date.now();
  let changed = false;
  for (const espnId of Object.keys(wvs)) {
    const wv = wvs[espnId];
    if (wv.until > now) continue;                    // window still open
    const p = LG().playerPool.find(x=>String(x.espnId)===String(espnId));
    const claims = (wv.claims||[]).slice();
    if (claims.length) {
      const wp = ensureWaiverPriority();
      const prio = id => wp.findIndex(x=>String(x)===String(id));
      claims.sort((a,b) => LSET().waiverMode==='faab'
        ? (b.bid - a.bid) || (prio(a.teamId) - prio(b.teamId))
        : (prio(a.teamId) - prio(b.teamId)));
      let winner = null;
      for (const c of claims) {
        const room = rosterActiveCount(c.teamId) < rosterCap();
        const funds = LSET().waiverMode!=='faab' || c.bid <= faabLeft(c.teamId);
        if (room && funds) { winner = c; break; }
      }
      if (winner) {
        const maxPick = LG().draft.picks.reduce((m,pk)=>Math.max(m,pk.pick||0), 0);
        LG().draft.picks.push({ teamId: winner.teamId, playerId: espnId, pick: maxPick+1, addedFA: true });
        if (LSET().waiverMode==='faab' && winner.bid>0) {
          LG().faabSpent = LG().faabSpent || {};
          LG().faabSpent[winner.teamId] = (LG().faabSpent[winner.teamId]||0) + winner.bid;
        }
        // rolling priority: winner drops to the back
        LG().waiverPriority = ensureWaiverPriority().filter(x=>String(x)!==String(winner.teamId));
        LG().waiverPriority.push(winner.teamId);
        logTxn('waiver', `${teamName(winner.teamId)} claimed ${p?.name||'a player'}${LSET().waiverMode==='faab'?` ($${winner.bid})`:''}`);
      }
    }
    delete wvs[espnId];                               // cleared (claimed or now a free agent)
    changed = true;
  }
  if (changed) { save({silent:true}); renderActive(); }
}

/* ---- GAME-ISSUE ATTENTION QUEUE (master resolves) ----
   Postponed/Cancelled/Suspended games for rostered starters get flagged into
   the MASTER doc. Master settings shows the queue; resolving writes a manual
   points override that scoring then counts. */
function auditGameIssues() {
  if (SP().statsApi !== 'mlb' || !STATE.activeLeagueDoc) return;
  if (LSET().scoringFormat !== 'bestGame' && LSET().scoringFormat !== 'regular') return;
  const week = currentWeekNow();
  const sched = schedForWeekSync(week); if (!sched) return;
  const bad = ['Postponed','Cancelled','Suspended'];
  STATE.attention = STATE.attention || {};
  let dirty = false;
  for (const t of LG().teams) {
    for (const pid of getStarters(t.id, week)) {
      const p = LG().playerPool.find(x=>String(x.espnId)===String(pid));
      if (!p?.mlbId || !p.mlbTeamId) continue;
      for (const d of Object.keys(sched)) {
        for (const g of (sched[d]||[])) {
          if ((g.homeId===p.mlbTeamId || g.awayId===p.mlbTeamId) && bad.includes(g.status)) {
            const key = `${STATE.activeLeagueDoc}|${week}|${p.mlbId}|${d}`;
            const okey = `${STATE.activeLeagueDoc}|${week}|${p.mlbId}`;
            if (!STATE.attention[key] && (STATE.scoreOverrides||{})[okey] === undefined) {
              STATE.attention[key] = { leagueName: LG().leagueName, player: p.name, mlbId: p.mlbId,
                week, date: d, status: g.status, ts: Date.now() };
              dirty = true;
            }
          }
        }
      }
    }
  }
  if (dirty) save({ master:true, silent:true });
}
window.resolveIssue = function(key) {
  const item = (STATE.attention||{})[key]; if (!item) return;
  const v = prompt(`Points for ${item.player} (week ${item.week}, ${item.status} ${item.date})?\nEnter the makeup-game points, or 0 if none:`);
  if (v === null) return;
  const pts = Number(v);
  if (isNaN(pts)) { toast('Enter a number', 'err'); return; }
  STATE.scoreOverrides = STATE.scoreOverrides || {};
  const parts = key.split('|');
  STATE.scoreOverrides[`${parts[0]}|${parts[1]}|${parts[2]}`] = pts;
  delete STATE.attention[key];
  save({ master:true });
  toast(`Resolved: ${item.player} → ${pts} pts`, 'ok');
  renderActive();
};
window.dismissIssue = function(key) {
  if (!STATE.attention?.[key]) return;
  delete STATE.attention[key];
  save({ master:true }); renderActive();
};

/* ---- PLAYOFFS ----
   Seeds from H2H standings at the start week; single-week rounds. 2 or 4 teams. */
function standingsBestFirst() {
  const rec = computeRecords();
  return LG().teams.map(t=>t.id).sort((a,b) => {
    const ra=rec[a]||{w:0,pf:0}, rb=rec[b]||{w:0,pf:0};
    return (rb.w - ra.w) || (rb.pf - ra.pf);
  });
}
/* Standard bracket seeding order for a power-of-two bracket (1 vs size, etc.) */
function bracketSeedOrder(size) {
  let ord = [1];
  while (ord.length < size) {
    const m = ord.length * 2;
    const next = [];
    ord.forEach(s => { next.push(s, m + 1 - s); });
    ord = next;
  }
  return ord;
}
/* Seeded single-elimination bracket for ANY playoff size (2..teams).
   Bracket pads to the next power of two; top seeds get first-round byes.
   One week per round starting at playoffStartWeek. In pair slots:
   null = bye, undefined = participant not yet decided (TBD). */
function playoffBracket() {
  const start = Number(LSET().playoffStartWeek) || 0;
  if (!start) return null;
  const teamCount = LG().teams.length;
  const n = Math.min(Math.max(2, Number(LSET().playoffTeams) || 4), teamCount);
  const seeds = standingsBestFirst().slice(0, n);
  if (seeds.length < 2) return null;
  const cur = currentWeekNow();
  const seedRank = tid => seeds.findIndex(s => String(s) === String(tid));
  const winner = (a, b, wk) => {
    if (a === undefined || b === undefined) return undefined;  // waiting on prior round
    if (a === null) return b; if (b === null) return a;        // bye advances immediately
    if (cur <= wk) return undefined;                           // round not played yet
    const sa = teamWeekTotal(a, wk), sb = teamWeekTotal(b, wk);
    if (sa > sb) return a; if (sb > sa) return b;
    return seedRank(a) <= seedRank(b) ? a : b;                 // tie → higher seed
  };
  const size = 2 ** Math.ceil(Math.log2(n));
  let slots = bracketSeedOrder(size).map(s => s <= n ? seeds[s - 1] : null);
  const roundLabel = c => c === 2 ? 'Championship' : c === 4 ? 'Semifinals' : c === 8 ? 'Quarterfinals' : `Round of ${c}`;
  const rounds = [];
  let wk = start;
  while (slots.length > 1) {
    const pairs = [];
    for (let i = 0; i < slots.length; i += 2) pairs.push([slots[i], slots[i + 1]]);
    // an all-bye round can't happen (n>=2), but a pair may be a pure bye
    rounds.push({ week: wk, label: roundLabel(slots.length), pairs });
    slots = pairs.map(([a, b]) => winner(a, b, wk));
    wk++;
  }
  return { rounds, champ: slots[0] ?? null };
}

/* ---- KEEPERS (traditional) ----
   Keeper leagues: at season end the commissioner runs "new season", picking each
   team's keepers. Keeping a player costs next draft's pick in the round he was
   drafted (FA adds cost the last round). When the new live draft reaches that
   round for that team, the keeper IS the pick — recorded automatically. */
window.openKeeperFlow = function() {
  if (!(window._masterUnlocked || commishUnlocked())) { toast('Commissioner PIN required', 'err'); return; }
  if (LSET().leagueType !== 'keeper') { toast('This is not a keeper league', 'err'); return; }
  window._keep = { ti: 0, sel: {} };
  renderKeeperModal();
};
function keeperCostRound(pk) {
  if (!pk) return 99;
  if (pk.round) return pk.round;
  const rounds = LG().draft.picks.reduce((m,p)=>Math.max(m, p.round||0), 0);
  return rounds || Math.ceil(rosterCap());
}
function renderKeeperModal() {
  const k = window._keep;
  const team = LG().teams[k.ti];
  if (!team) { finishKeeperFlow(); return; }
  const roster = teamRoster(team.id);
  const sel = k.sel[team.id] || [];
  const max = LSET().keeperCount || 3;
  const rows = roster.map(p => {
    const pk = LG().draft.picks.find(x => String(x.playerId)===String(p.espnId) && String(x.teamId)===String(team.id));
    const cost = keeperCostRound(pk);
    const on = sel.includes(String(p.espnId));
    return `<div class="row-between" style="padding:.35rem 0;border-bottom:1px solid rgba(42,61,48,.35)">
      <span style="font-size:.8rem">${esc(p.name)} <span class="sub" style="font-size:.62rem">costs Rd ${cost}${pk?.addedFA?' (FA)':''}</span></span>
      <button class="btn btn-sm ${on?'btn-amber':'btn-ghost'}" onclick="toggleKeeperSel('${team.id}','${p.espnId}')">${on?'✓ Keep':'Keep'}</button>
    </div>`;
  }).join('') || '<p class="sub">No rostered players.</p>';
  openModal(`
    <div class="h2">Keepers · ${esc(team.name)}</div>
    <p class="sub mb">Team ${k.ti+1} of ${LG().teams.length} · pick up to <b>${max}</b>. Each keeper costs that round's pick in the new draft.</p>
    <div style="max-height:45vh;overflow:auto">${rows}</div>
    <button class="btn btn-amber btn-block mt" onclick="keeperNextTeam()">${k.ti+1 < LG().teams.length ? 'Next team →' : '✓ Finish & start new season'}</button>
    <button class="btn btn-ghost btn-block mt" onclick="closeModal()">Cancel (nothing saved)</button>`);
}
window.toggleKeeperSel = function(teamId, espnId) {
  const k = window._keep; k.sel[teamId] = k.sel[teamId] || [];
  const i = k.sel[teamId].indexOf(String(espnId));
  if (i >= 0) k.sel[teamId].splice(i, 1);
  else {
    if (k.sel[teamId].length >= (LSET().keeperCount||3)) { toast(`Max ${LSET().keeperCount||3} keepers`, 'err'); return; }
    k.sel[teamId].push(String(espnId));
  }
  renderKeeperModal();
};
window.keeperNextTeam = function() {
  const k = window._keep;
  if (k.ti + 1 < LG().teams.length) { k.ti++; renderKeeperModal(); }
  else finishKeeperFlow();
};
function finishKeeperFlow() {
  const k = window._keep; if (!k) return;
  const keepers = {}, costs = {};
  for (const team of LG().teams) {
    const list = (k.sel[team.id] || []).map(eid => {
      const p = LG().playerPool.find(x=>String(x.espnId)===String(eid));
      const pk = LG().draft.picks.find(x => String(x.playerId)===String(eid) && String(x.teamId)===String(team.id));
      let round = keeperCostRound(pk);
      // two keepers can't cost the same round — bump to the next open later round
      const used = new Set((keepers[team.id]||[]).map(x=>x.costRound));
      while (used.has(round)) round++;
      return { espnId: eid, name: p?.name||'Player', costRound: round };
    });
    if (list.length) {
      keepers[team.id] = list;
      costs[team.id] = {};
      list.forEach(x => { costs[team.id][x.costRound] = x.name; logTxn('keeper', `${team.name} keeps ${x.name} (Rd ${x.costRound})`); });
    }
  }
  LG().keepers = keepers;
  LG().keeperCosts = costs;
  // FINISHING THE KEEPER FLOW IS THE SEASON END for a keeper league — the same
  // engine every league type uses, so a keeper year gets penalties, cap growth,
  // contract aging and the stats turnover, not just a draft reset.
  const yr = currentSeasonYear();
  LG().rollbackSnapshot = snapshotForRollover();
  const logs = [];
  const log = (m) => logs.push(m);
  applyCapSeasonEnd(yr, log);
  // players NOT kept return to the pool, and their contracts go with them — voided,
  // not dropped: no dead cap when a keeper year simply lets a player walk. Without
  // this, a re-drafted player would arrive carrying his old team's deal.
  const keptIds = new Set(Object.values(keepers).flatMap(l => l.map(x => String(x.espnId))));
  let walked = 0;
  Object.keys(LG().contracts || {}).forEach(pid => {
    if (!keptIds.has(String(pid))) { delete LG().contracts[pid]; walked++; }
  });
  if (walked) log(`${walked} contract${walked!==1?'s':''} of unkept players ended — no dead cap`);
  // fresh draft; keepers auto-slot at their cost rounds as it runs
  LG().draft = { started:false, complete:false, live:false, order: LG().draft.order||[], picks:[], currentPick:0,
                 draftDate:null, secPerPick: LSET().secPerPick||90, snake:true, pickStartedAt:null, paused:false };
  LG().irStash = {};
  ensureSettings();
  if (LG().settings.capSetFrom) LG().settings.capSetFrom = null;  // the new draft re-fixes the cap
  turnSeasonPage(yr, log);
  LG().seasonApplied = yr;
  LG().currentWeek = 1;
  logTxn('season', `Season advanced ${yr} → ${yr+1} (keeper year: ${Object.values(keepers).flat().length} keepers set)`);
  window._keep = null;
  save(); closeModal();
  toast(`Now in ${yr+1} — keepers will auto-slot in their cost rounds during the draft`, 'ok');
  renderActive();
}
/* A FORFEITED PICK IS AN EMPTY SEAT AT THE DRAFT. Pick penalties are recorded in
   removedPicks, and dynasty rookie drafts already honour them — but the MAIN draft
   never looked, so in a redraft or keeper league losing next year's R1 cost
   nothing at all. When the seat comes up it is consumed by a marker pick with no
   player, and the draft moves on: the team simply does not pick that round. */
function applyForfeitSkips() {
  const d = LG().draft;
  if (!d.live || d.complete) return;
  let guard = 0;
  while (guard++ < 200) {
    const team = currentPickTeam(); if (!team) return;
    const { round } = pickRoundAndSlot(currentPickIndex());
    if (!pickRemoved(currentSeasonYear(), round, team)) return;
    d.picks.push({ pick: currentPickIndex() + 1, round, teamId: team, playerId: null, forfeited: true });
    logTxn('season', `${teamName(team)} forfeits their R${round} pick (over-cap penalty)`);
    if (draftDone()) { finishDraft(); return; }
  }
}
/* during the live draft: when the on-clock team owes a round to a keeper,
   the keeper IS that pick — record it and keep the draft moving. */
function checkKeeperSkips() {
  const d = LG().draft;
  if (!d.live || d.paused) return;
  let guard = 0;
  while (guard++ < 60) {
    const team = currentPickTeam(); if (!team) return;
    const { round } = pickRoundAndSlot(currentPickIndex());
    const ks = (LG().keepers||{})[team];
    const hit = ks?.find(x => x.costRound === round &&
      !d.picks.some(p => String(p.playerId)===String(x.espnId)));
    if (!hit) return;
    commitPick(hit.espnId, team);   // the keeper is the pick for this slot
  }
}

/* ============================================================
   PLAYER POOL POINTS — fetch game logs for the top 200 by ADP and
   roll them into season + last-7/14/30-day totals using league scoring.
   Stored on each player: ptsSeason, pts7, pts14, pts30.
   ============================================================ */
let _poolPtsRunning = false;
// Declared HERE, beside computePoolPoints, not at the bottom of the file: renderPage
// calls ensurePoolPoints() and boot renders a page before the end of the script is
// reached, so a declaration down there sits in the temporal dead zone and every
// render throws.
let _pooledOnce = false;
async function computePoolPoints(force, progressFn) {
  if (_poolPtsRunning) return;
  _poolPtsRunning = true;
  try {
    // the stored pool is already the top 300 by ADP — just compute all of them.
    // (Players outside the 300 get computed individually via loadExtraPlayer.)
    const mapped = LG().playerPool.filter(p => p.mlbId);
    LG().gameLogs = LG().gameLogs || {};
    let done = 0;
    for (const p of mapped) {
      done++;
      try {
        // reuse cached log if present and not forcing
        let log = LG().gameLogs[p.mlbId];
        if (!log || force) {
          if (SP().statsApi === 'nba') {
            log = await nbaGameLog(p.espnId);          // already carries group:'stats'
            // adopt the team id from the most recent game so per-player locks can
            // match this player against the schedule
            const last = log[log.length - 1];
            if (last && last.teamId != null) p.mlbTeamId = last.teamId;
          } else {
            const isPitcher = /SP|RP/.test((p.eligible||[]).join('')) && !/1B|2B|3B|SS|OF|C|DH/.test((p.eligible||[]).join(''));
            const grp = isPitcher ? 'pitching' : 'hitting';
            const raw = await mlbGameLog(p.mlbId, grp);
            log = raw.map(g => ({...g, group: grp}));
          }
          LG().gameLogs[p.mlbId] = log;
          await new Promise(r=>setTimeout(r,40));
        }
        applyPointFields(p, log);
      } catch(e) {}
      progressFn?.(done, mapped.length);
    }
    // persist to league doc (shared cache benefits everyone)
    if (STATE.activeLeagueDoc) saveLeague({silent:true}); else saveLocal();
  } finally { _poolPtsRunning = false; }
}


/* ============================================================
   ID MAPPING — bridge ESPN players ↔ MLB players
   Strategy: name match + override table; cache results
   ============================================================ */
async function resolveMlbIds(logFn, progressFn) {
  const api = SP().statsApi;
  if (api === 'mlb') return resolveIds(logFn, progressFn, mlbLookup, 'MLB');
  if (api === 'nba') {
    // ESPN's NBA stats are keyed by the same athlete id the pool already carries,
    // so "mapping" is just adopting it — no lookups, no failures, no network.
    let mapped = 0;
    LG().playerPool.forEach(p => { if (p.espnId != null) { p.mlbId = String(p.espnId); mapped++; } });
    logFn?.(`Mapped ${mapped} NBA players (ESPN IDs used directly)`, 'ok');
    return { mapped, failed: 0, failures: [] };
  }
  logFn?.(`No stat provider for ${SP().label}`, 'err');
  return { mapped: 0, failed: 0, failures: [] };
}

/* generic resolver — sport provides the lookup fn */
async function resolveIds(logFn, progressFn, lookupFn, apiName) {
  logFn?.(`Mapping ${SP().label} players to ${apiName} IDs…`, 'run');
  let mapped = 0, failed = 0, done = 0;
  const failures = [];
  const pool = LG().playerPool;
  const total = pool.length;
  for (const p of pool) {
    done++;
    if (p.mlbId) { mapped++; progressFn?.(done, total, mapped, failed); continue; }
    if (STATE.idOverrides[normName(p.name)]) {
      p.mlbId = STATE.idOverrides[normName(p.name)];
      mapped++; progressFn?.(done, total, mapped, failed); continue;
    }
    try {
      const id = await lookupFn(p.name);
      if (id) { p.mlbId = id; mapped++; }
      else { failed++; failures.push(p.name); }
    } catch { failed++; failures.push(p.name); }
    progressFn?.(done, total, mapped, failed);
    await new Promise(r => setTimeout(r, 35));
  }
  logFn?.(`Mapped ${mapped}, failed ${failed}`, failed ? 'err' : 'ok');
  if (failures.length) logFn?.('Unmapped: ' + failures.slice(0,10).join(', ') + (failures.length>10?'…':''), 'pending');
  return { mapped, failed, failures };
}

/* drive the 1-second draft clock; auto-pick when it hits zero */
let _draftTimer = null;
let _autoPickGuard = -1;   // pick index we last auto-fired, prevents double-fire
function manageDraftTimer(page) {
  const live = LG().draft?.live && !LG().draft?.paused;
  const onDraftPage = page === 'draft';
  if (live && onDraftPage) {
    if (!_draftTimer) {
      _draftTimer = setInterval(() => {
        if (!LG().draft?.live || LG().draft?.paused) { clearInterval(_draftTimer); _draftTimer=null; return; }
        applyForfeitSkips();  // penalty seats are consumed, not picked
        checkKeeperSkips();   // keeper leagues: keepers auto-slot as their round's pick
        const left = draftSecondsLeft();
        const t = document.querySelector('.draft-timer');
        if (t) { t.textContent = fmtClock(left); t.classList.toggle('urgent', left<=10); }
        if (left <= 0) {
          // AUTO-PICK for whichever team is on the clock — fires regardless of which
          // team is "mine", so other teams' expired picks don't stall the draft.
          const idx = currentPickIndex();
          if (_autoPickGuard === idx) return;   // already fired for this pick; wait for sync
          _autoPickGuard = idx;
          autoPickForCurrent();
        }
      }, 1000);
    }
  } else if (_draftTimer) {
    clearInterval(_draftTimer); _draftTimer = null;
  }
}

    clearInterval(_rookieTimer); _rookieTimer = null;
  }
}

  const d = LG().draft;
  if (d.paused || !d.pickStartedAt) return LSET().secPerPick;
