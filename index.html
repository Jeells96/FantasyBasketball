/* ============================================================
   GLOBAL HANDLER EXPOSURE
   This file runs as <script type="module">, so its top-level functions are
   module-scoped, NOT global. Inline HTML handlers (onclick="foo()") are
   evaluated against the GLOBAL scope, so any function reached from markup
   must be published on window or the click silently throws ReferenceError
   and the button does nothing.
   Most handlers are declared as `window.foo = function` already; these are
   plain declarations that are also referenced from markup, so they are
   published here. tests/ audits this automatically — see the inline-handler
   check in tests/sim.js.
   ============================================================ */
window.joinLeagueById   = joinLeagueById;
window.goToHub          = goToHub;
window.showGate         = showGate;
window.renderActive     = renderActive;
window.renderTradeBuilder = renderTradeBuilder;

/* ============================================================
   BOOT
   ============================================================ */
/* Read a shared league link like  ...#league=68261  so opening the link
   auto-joins that league. Approvals load from Firebase a moment after boot,
   so we stash the requested ID and the master-load handler completes the join. */
/* ============================================================
   LEAGUE URLs — every league lives at its own name-based page:
     #my-dynasty-league            ← the league's name, slugified
     #my-dynasty-league-12345      ← disambiguated when two leagues share a name
     #league=12345                 ← legacy ID links, still honored forever
   Resolution is by slug against the approvals list; the 5-digit ID remains the
   real identity, so a slug is only ever a friendly alias for one.
   ============================================================ */
/* the Firestore doc a league id actually points at (migrated leagues keep their
   original doc, so never assume 'league_'+id) */
function leagueDocFor(id) {
  return (STATE.approvals || {})[id]?.leagueDocId || ('league_' + id);
}
function leagueSlug(id) {
  const a = (STATE.approvals || {})[id];
  const base = normLeague(a?.leagueName || '') || ('league-' + id);
  // if another approved league slugifies the same way, suffix with the ID
  // aliases of the same underlying league (e.g. a migrated text key + its new 5-digit
  // id) are the SAME league, not a name collision
  const myDoc = leagueDocFor(id);
  const clash = Object.keys(STATE.approvals || {}).some(other =>
    String(other) !== String(id) &&
    leagueDocFor(other) !== myDoc &&
    (normLeague(STATE.approvals[other]?.leagueName || '') || ('league-' + other)) === base);
  return clash ? `${base}-${id}` : base;
}
/* slug (or raw id) -> league id, or null. Accepts a trailing -12345 disambiguator. */
function leagueIdFromHash(h) {
  if (!h) return null;
  const params = new URLSearchParams(h);
  const legacy = params.get('league');                 // #league=12345
  if (legacy && /^\d{5}$/.test(legacy)) return legacy;
  const raw = String(h).replace(/^#/, '').trim();
  if (!raw || raw.includes('=')) return null;
  const appr = STATE.approvals || {};
  if (/^\d{5}$/.test(raw) && appr[raw]) return raw;    // #12345 (only if it exists,
                                                       // so a league NAMED "12345" still resolves below)
  // exact slug match on current names
  for (const id of Object.keys(appr)) {
    if (leagueSlug(id) === raw) return id;
  }
  // A "<slug>-<id>" form whose ID exists. This is what keeps a shared link alive after
  // a rename, and it is safe because exact-slug matching above already took precedence:
  // we only fall back to the embedded id when no league currently claims this slug.
  const m = raw.match(/^(.*)-(\d{5})$/);
  if (m && appr[m[2]]) return m[2];
  if (/^\d{5}$/.test(raw)) return raw;                 // unknown 5-digit id → let the join path report it
  // bare name match ignoring any disambiguator, when unambiguous
  const hits = Object.keys(appr).filter(id => normLeague(appr[id]?.leagueName || '') === raw);
  if (hits.length === 1) return hits[0];
  return null;
}
function readDeepLink() {
  try {
    const h = (location.hash || '').replace(/^#/, '');
    if (!h) return;
    const id = leagueIdFromHash(h);
    if (id) { window._pendingDeepLink = id; return; }
    // approvals may not have loaded yet — remember the raw slug and retry after sync
    window._pendingSlug = h;
  } catch(e) {}
}
/* Try to complete a pending deep-link join (called after approvals arrive). */
function tryDeepLinkJoin() {
  // a slug link parked before approvals loaded → resolve it now that they have
  if (!window._pendingDeepLink && window._pendingSlug) {
    const resolved = leagueIdFromHash(window._pendingSlug);
    if (resolved) { window._pendingDeepLink = resolved; window._pendingSlug = null; }
    else if (STATE._loaded) {
      window._pendingSlug = null;
      setLeagueHash(null);
      toast('League not found — check the invite link', 'err');
      showGate('landing');
      return;
    } else return;   // still waiting on master
  }
  const id = window._pendingDeepLink;
  if (!id) return;
  if (!STATE.approvals || !STATE.approvals[id]) {
    // approvals may simply not have loaded yet — but if the master HAS loaded and
    // the ID still isn't there, this link points at a league that doesn't exist.
    if (STATE._loaded) {
      window._pendingDeepLink = null;
      setLeagueHash(null);
      toast(`League ${id} not found — check the invite link`, 'err');
      showGate('landing');
    }
    return;
  }
  window._pendingDeepLink = null;
  // already in this exact league? just clear the gate.
  if (STATE.activeLeagueDoc === leagueDocFor(id)) { hideGate(); return; }
  joinLeagueById(id, { silent: false });
}
// initFirebase() runs loadLocal() synchronously before its first await, so the cached
// league directory is in place; reading the deep link AFTER it lets a name-based #slug
// resolve immediately (and offline) instead of parking until the master doc arrives.
initFirebase();
readDeepLink();
go('home');
if (!fbReady) setTimeout(() => { if (!STATE._loaded) renderActive(); }, 300);

/* background league ops: waiver processing + game-issue audit (throttled).
   Runs on whichever device is open — idempotent, safe to run everywhere. */
setInterval(() => {
  if (!STATE.activeLeagueDoc) return;
  try { processWaivers(); } catch(e) {}
  const _n = Date.now();
  if (!window._lastAudit || _n - window._lastAudit > 5*60*1000) {
    window._lastAudit = _n;
    try { auditGameIssues(); } catch(e) {}
  }
}, 60*1000);
setTimeout(() => { if (STATE.activeLeagueDoc) { try { processWaivers(); auditGameIssues(); ensureFreshPool(); } catch(e) {} } }, 4000);

/* URL IS THE SOURCE OF TRUTH.
   - #league=<id>  → open that league (auto-join, hash persists on refresh)
   - bare URL      → the master hub / landing (create & manage leagues)
   A previously-joined league in localStorage does NOT override the URL: if the
   URL is bare, we show the hub even if this device joined a league before. */
if (window._pendingDeepLink || window._pendingSlug) {
  // A league URL — seed a hub entry underneath so the back button returns to the
  // hub even when someone opens the league link cold (no prior hub view).
  seedHubHistory();
  const wantDoc = window._pendingDeepLink ? leagueDocFor(window._pendingDeepLink) : null;
  if (!wantDoc || STATE.activeLeagueDoc !== wantDoc) {
    // not already in it — clear any other league binding and join fresh
    showGate('landing');
    setTimeout(tryDeepLinkJoin, 300);
    setTimeout(tryDeepLinkJoin, 900);
    setTimeout(tryDeepLinkJoin, 2000);
    setTimeout(tryDeepLinkJoin, 3500);
  } else {
    // already in this league (refresh case) — just show it, keep the hash
    window._pendingDeepLink = null;
    hideGate();
  }
} else {
  // BARE URL → master hub. Do not auto-open a previously joined league.
  // Mark this history entry as the hub so back/forward routing is unambiguous.
  try { history.replaceState({ hub: true }, '', location.pathname + location.search); } catch(e) {}
  showGate('landing');
}

/* Safety re-check: if we ended up with no league and the gate isn't up (and master
   isn't unlocked), show the hub. */
setTimeout(() => {
  if (!window._pendingDeepLink && !window._pendingSlug && gateNeeded() && !window._masterUnlocked
      && $('gate')?.style.display === 'none') {
    showGate('landing');
  }
}, 500);

/* Keep the URL in sync when the user navigates between leagues via the app
   (switcher, leave, join). Writing the hash makes each league bookmarkable. */
/* Central URL→view router. Reads the current hash and shows the right thing:
   a league (if #league=<id>) or the hub (bare URL). Used by both the back/forward
   buttons (popstate) and manual hash edits (hashchange). */
function routeFromUrl() {
  if (window._suppressHash) return;   // we changed the URL ourselves; ignore the echo
  const h = (location.hash || '').replace(/^#/, '');
  const id = leagueIdFromHash(h);
  if (!id && h) {
    // a slug we can't resolve yet (approvals still syncing) — wait for master
    if (!STATE._loaded) { window._pendingSlug = h; return; }
    window._pendingSlug = null;
    toast('League not found — check the invite link', 'err');
    showGate('landing');
    return;
  }
  if (id) {
    // going to a league URL
    const wantDoc = leagueDocFor(id);
    if (STATE.activeLeagueDoc === wantDoc) {
      hideGate();                    // already in it (e.g. forward button) → just show it
    } else {
      window._pendingDeepLink = id;
      tryDeepLinkJoin();             // switch/join into that league
    }
  } else {
    // bare URL → the hub. This is the BACK-from-a-league case. Always show the
    // landing hub, even if this device is bound to a league.
    window._pendingDeepLink = null;
    window._pendingSlug = null;
    window._pausedFor = null;
    showGate('landing');
  }
}
window.addEventListener('popstate', routeFromUrl);   // Safari/Chrome back & forward buttons
window.addEventListener('hashchange', routeFromUrl); // manual URL edits

/* Auto-pull MLB stats on load (once per ~6h) and when a team is chosen.
   Runs silently in the background; refreshes the view when done. */
async function autoPullStats(force) {
  if (!myTeamId()) return;                 // only if user has a team
  const last = LG().lastStatPull || 0;
  const sixHrs = 6*60*60*1000;
  if (!force && (Date.now() - last) < sixHrs) return;  // recently pulled
  const roster = teamRoster(myTeamId()).filter(p => p.mlbId);
  if (!roster.length) return;
  LG().gameLogs = LG().gameLogs || {};
  for (const p of roster) {
    try {
      const isPitcher = /SP|RP/.test((p.eligible||[]).join('')) && !/1B|2B|3B|SS|OF|C|DH/.test((p.eligible||[]).join(''));
      const grp = isPitcher ? 'pitching' : 'hitting';
      const log = await mlbGameLog(p.mlbId, grp);
      const mapped = log.map(g => ({...g, group: grp}));
      LG().gameLogs[p.mlbId] = mapped;
      applyPointFields(p, mapped);  // compute point fields (incl. bestAvg)
    } catch(e) {}
    await new Promise(r=>setTimeout(r,50));
  }
  LG().lastStatPull = Date.now();
  if (STATE.activeLeagueDoc) saveLeague({silent:true}); else saveLocal();
  renderActive();
  // background: resolve team ids + injuries + schedule (non-blocking for the grid)
  refreshTeamMeta();
  // also compute points for the rest of the pool (top players + free agents) in the
  // background, so the Players page is populated without a manual "Load points" tap.
  computePoolPoints(false).then(() => renderActive()).catch(()=>{});
}

/* resolve each rostered player's MLB team id + current injury status, then
   fetch this week's schedule so the lookahead can show opponents/probables.
   Injury status here is the LIVE source (updates when a player returns). */
async function refreshTeamMeta() {
  if (!myTeamId()) return;
  const roster = teamRoster(myTeamId()).filter(p => p.mlbId);
  // batch people lookup for team id + injury status
  if (roster.length) {
    try {
      const ids = roster.map(p => p.mlbId).join(',');
      const res = await fetch(`${MLB}/people?personIds=${ids}&hydrate=currentTeam`);
      if (res.ok) {
        const data = await res.json();
        const byId = {}; (data.people||[]).forEach(person => byId[person.id] = person);
        LG().playerPool.forEach(pl => {
          const person = byId[pl.mlbId];
          if (person) {
            pl.mlbTeamId = person.currentTeam?.id || pl.mlbTeamId;
            // NOTE: do NOT clear pl.injured here. MLB's person.active means "not retired",
            // not "healthy" — injured players are still active, so this would wrongly wipe
            // the IL tag from nearly everyone. Injury status comes from the ESPN pool pull.
          }
        });
      }
    } catch(e) {}
  }
  // fetch schedule for the viewed week (so opponents/probables show)
  try { await getWeekSchedule(activeWeek()); } catch(e) {}
  if (STATE.activeLeagueDoc) saveLeague({silent:true}); else saveLocal();
  renderActive();
}
// kick off shortly after load
setTimeout(() => autoPullStats(false), 800);
// ALWAYS resolve team meta + schedule on load (independent of the stat-pull 6h guard),
// so upcoming opponents and probable starters appear even when stats are already cached.
setTimeout(() => { if (myTeamId()) refreshTeamMeta(); }, 1200);
// ALWAYS compute pool points on load, independent of autoPullStats' guards, so the
// Players page is populated automatically. Reuses cached logs so it's cheap on refresh.
setTimeout(() => {
  if (LG().playerPool.some(p => p.mlbId)) {
    computePoolPoints(false).then(() => renderActive()).catch(()=>{});
  }
}, 1500);
// re-run when the league doc first syncs in (pool may arrive after boot)
/* GAME DATA LOADS ITSELF.
   There used to be a "Pull stats for my roster" button behind an empty-state card,
   which is a chore the app can do on its own — computePoolPoints() is already
   sport-aware and fills the same cache for the whole pool.

   The guard checks for GAME LOGS rather than computed points on purpose: basketball
   sets ptsSeason at pool-pull time, so a points-based guard was always satisfied and
   basketball never fetched a single log — no daily scoring, ever. */
function ensurePoolPoints() {
  if (_pooledOnce) return;
  if (!FEAT().gameLogs) return;                       // sport has no per-game source
  const pool = LG().playerPool || [];
  if (!pool.some(p => p.mlbId)) return;               // nothing mapped to fetch for
  const logs = LG().gameLogs || {};
  const haveAny = Object.keys(logs).length > 0;
  const havePts = pool.some(p => p.ptsSeason != null);
  if (haveAny && havePts) return;                     // already loaded
  _pooledOnce = true;
  computePoolPoints(false).then(() => renderActive()).catch(() => { _pooledOnce = false; });
}
</script>
